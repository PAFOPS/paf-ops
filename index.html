<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1f4a">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PAF OPS">
<meta name="description" content="PAF OPS — préparation des meetings de la Patrouille de France">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>PAF OPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Mise en page : barre haute (logo + navigation), contenu centré 1040px, feuilles modales pour la saisie guidée. */
:root{
 --bg:#f2f4f8; --surface:#ffffff; --surface2:#f7f8fb; --line:#e1e6ef; --fg:#0f1d3a; --muted:#5a6884;
 --navy:#0c1f4a; --navy2:#1b3a80; --gold:#c8961e; --gold2:#f6ead0;
 --ok:#16975a; --ok2:#e3f5ec; --warn:#d9820b; --warn2:#fff1dc; --bad:#d33242; --bad2:#fde9eb;
 --shadow:0 1px 2px rgba(12,31,74,.06),0 8px 24px rgba(12,31,74,.07); --pri:#0c1f4a; --pri2:#1b3a80;
 --f-disp:"Saira","Arial Narrow",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1222;--surface:#131c31;--surface2:#18233c;--line:#26324d;--fg:#e8edf7;--muted:#9aa7c1;--navy:#e8edf7;--navy2:#9fb8ff;--gold2:#3a2f14;--ok2:#12321f;--warn2:#3a2a10;--bad2:#3b161b;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--pri:#2f63d8;--pri2:#4677e6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1222;--surface:#131c31;--surface2:#18233c;--line:#26324d;--fg:#e8edf7;--muted:#9aa7c1;--navy:#e8edf7;--navy2:#9fb8ff;--gold2:#3a2f14;--ok2:#12321f;--warn2:#3a2a10;--bad2:#3b161b;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--pri:#2f63d8;--pri2:#4677e6;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{overflow-x:clip;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:28px;font-weight:800}h2{font-size:20px;font-weight:700}h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
:focus-visible{outline:3px solid #6ea2ff;outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Barre haute */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .tin{max-width:1040px;margin:auto;display:flex;align-items:center;gap:14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.brand img{width:42px;height:42px}
.brand b{white-space:nowrap;font-family:var(--f-disp);font-size:20px;font-weight:800;letter-spacing:.06em;color:var(--navy)}
.nav{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px}
.nav button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
.nav button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.sp{flex:1}
.role{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.role span{white-space:nowrap}
@media (max-width:1100px){.nav button{padding:8px 10px;gap:5px;font-size:14px}}
@media (max-width:980px){.nav button span{display:none}.nav button{padding:9px 11px}}
.role select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;font-weight:700;font-size:13px}
.wrap{max-width:1040px;margin:auto;padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--gold2);color:var(--fg);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:20px}
.note svg{color:var(--gold);margin-top:1px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 15px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.big{padding:14px 22px;font-size:16px;border-radius:14px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad2);background:var(--bad2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--muted)}
.ib:hover{color:var(--fg);border-color:var(--muted)}

/* Pastilles d'icônes colorées */
.tile{display:grid;place-items:center;color:#fff;border-radius:16px;width:48px;height:48px;flex:none;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 6px 14px -6px var(--c2),inset 0 1px 0 rgba(255,255,255,.3)}
.tile.lg{width:64px;height:64px;border-radius:20px}.tile.sm{width:36px;height:36px;border-radius:11px}.tile.xs{width:28px;height:28px;border-radius:9px}

/* En-tête de page */
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:4px 0 0}

/* Cartes meeting */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;text-align:left;transition:transform .15s}
.mcard:hover{transform:translateY(-2px)}
.mcard{padding:12px 14px 12px 12px;gap:8px;border-radius:16px;border-left:6px solid var(--c,var(--line))}
.mcard .mtop{gap:10px;align-items:center}.mcard .mtop h3{font-size:15.5px;line-height:1.2}
.mdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.mcard .jx{min-width:54px;padding:4px 8px;border-radius:10px}.mcard .jx b{font-size:17px}.mcard .jx span{font-size:9.5px}
.mmeta{display:flex;gap:12px;font-size:12.5px;color:var(--muted);font-weight:700}.mmeta span{display:inline-flex;align-items:center;gap:4px}
.itm b .lsub{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.prop{margin-top:14px;border:1.5px dashed var(--pri);border-radius:14px;padding:12px;display:grid;gap:8px}.prop>b{display:flex;align-items:center;gap:6px;font-size:14px}
.mtop{display:flex;gap:14px;align-items:flex-start}
.mtop .t{flex:1;min-width:0}
.mtop h3{font-size:19px}
.jx{font-family:var(--f-disp);text-align:center;border-radius:14px;padding:6px 10px;background:var(--surface2);min-width:64px}
.jx b{display:block;font-size:22px;line-height:1}.jx span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dates{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.chip.entr{background:#e6efff;border-color:#c9dbff;color:#1b3a80}
.chip.demo{background:var(--gold2);border-color:#ecd9a7;color:#7a5507}
:root[data-theme="dark"] .chip.entr{background:#1a2a50;border-color:#2a3f73;color:#bcd0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.entr{background:#1a2a50;border-color:#2a3f73;color:#bcd0ff}:root:not([data-theme="light"]) .chip.demo{color:#f2d48e;border-color:#5a4718}}
:root[data-theme="dark"] .chip.demo{color:#f2d48e;border-color:#5a4718}
.avs{display:flex;align-items:center}.avs .tile{margin-left:-8px;border:2px solid var(--surface)}.avs .tile:first-child{margin-left:0}
.ex{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);background:var(--gold2);border-radius:6px;padding:2px 6px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:20px;padding:36px 20px;text-align:center}
.empty p{margin:6px 0 16px}

/* Détail meeting */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:700;padding:0;margin-bottom:12px}
.hero{background:linear-gradient(140deg,#0c1f4a,#1b3a80 70%,#2c56b0);color:#fff;border-radius:24px;padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:0 18px 40px -18px rgba(12,31,74,.6)}
.hero .t{flex:1;min-width:220px}
.hero h1{color:#fff}
.hero .meta{opacity:.85;margin-top:4px}
.hero .dates{margin-top:12px}
.hero .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.hero .jx{background:rgba(255,255,255,.14);color:#fff}.hero .jx span{color:rgba(255,255,255,.75)}
.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.sect{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sect h2{display:flex;align-items:center;gap:10px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);min-width:0}
.ccard .t{flex:1;min-width:0}
.ccard .fn{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ccard .nm{font-weight:800;font-size:16px;margin-top:1px}
.ccard .org{font-size:13px;color:var(--muted)}
.line{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:6px;min-width:0}
.line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all;font-variant-numeric:tabular-nums}
.line .cp{border:0;background:none;color:var(--muted);padding:2px;border-radius:6px;display:grid;place-items:center}
.line .cp:hover{color:var(--fg)}
.ccard .acts{display:flex;flex-direction:column;gap:6px}
.ghostc{border:2px dashed var(--line);background:transparent;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;color:var(--muted)}
.ghostc:hover{border-color:var(--muted);color:var(--fg)}
.ghostc .tile{opacity:.55}
.ghostc b{display:block;color:var(--fg)}

/* Unité */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.fchip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 12px 6px 6px;font-weight:700}
.fchip[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.fchip .n{font-family:var(--f-disp);font-size:13px;color:var(--muted)}
.search{position:relative;max-width:340px;flex:1}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.grp{margin-top:22px}
.grp h3{display:flex;align-items:center;gap:10px;font-size:15px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.grp h3 .n{font-family:var(--f-body);font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.mrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .who{display:flex;gap:10px;align-items:center;min-width:0}
.mrow .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .who small{color:var(--muted)}
.mrow .line{margin:0}

/* Feuille de saisie */
.ov{position:fixed;inset:0;background:rgba(8,16,36,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none!important}
.sheet{background:var(--surface);border-radius:24px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet .sh{padding:20px 22px 6px;display:flex;gap:12px;align-items:flex-start}
.sheet .sh .t{flex:1}
.sheet .sb{padding:10px 22px 4px}
.sheet .sf{padding:14px 22px 20px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:6px;margin-top:8px}
.steps i{height:5px;flex:1;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--gold)}
.q{font-family:var(--f-disp);font-size:24px;font-weight:700;margin:8px 0 2px}
label.l{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:16px}
.in:focus{outline:none;border-color:#6ea2ff;box-shadow:0 0 0 3px rgba(110,162,255,.25)}
.in.err{border-color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.hint.bad{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.pk{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;font-weight:700;transition:border-color .12s,transform .12s}
.pk:hover{border-color:var(--muted);transform:translateY(-1px)}
.pk[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.drow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.drow .in{flex:1}
.recap{background:var(--surface2);border-radius:16px;padding:14px;display:grid;gap:8px}
.recap div{display:flex;gap:10px;align-items:center}
.confirm{background:var(--bad2);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);visibility:hidden;background:var(--pri);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible}

/* Accès */
.ro{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:18px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:6px 0;margin-bottom:16px}
.acard .ah{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px 8px}
.arow{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.arow .rl{display:flex;gap:10px;align-items:center;min-width:0}
.arow .rl b{display:block}.arow .rl small{color:var(--muted);font-size:12px}
.people{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;max-width:100%}
.person span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person button{border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:2px;border-radius:50%}
.person button:hover{color:var(--bad)}
.tnum{font-family:var(--f-disp);font-weight:800;font-size:17px}
.linkbox{display:flex;gap:8px;align-items:center;padding:4px 16px 14px;flex-wrap:wrap}
.linkbox code{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.switch{position:relative;width:46px;height:28px;border-radius:999px;border:0;background:var(--line);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ok)}.switch[aria-checked="true"]::after{left:21px}
.matrix{overflow-x:auto;padding:0 6px 8px}
.matrix table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:13px}
.matrix th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:10px 6px;font-weight:800;vertical-align:bottom}
.matrix th:first-child{text-align:left;padding-left:10px}
.matrix td{padding:6px;text-align:center;border-top:1px solid var(--line)}
.matrix td:first-child{text-align:left;padding-left:10px}
.matrix .rl{display:flex;gap:8px;align-items:center;font-weight:700;white-space:nowrap}
.matrix .grp td{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:8px 10px}
.rt{border:1px solid transparent;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px;min-width:84px}
.rt.e{background:var(--ok2);color:var(--ok)}.rt.r{background:#e6efff;color:#1b3a80}.rt.n{background:var(--surface2);color:var(--muted);border-color:var(--line)}
:root[data-theme="dark"] .rt.r{background:#1a2a50;color:#bcd0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rt.r{background:#1a2a50;color:#bcd0ff}}
.rt:disabled{cursor:default;opacity:.9}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 16px 12px;font-size:12px;color:var(--muted)}
.soon{font-size:10px;font-weight:700;color:var(--gold);display:block;text-transform:none;letter-spacing:0}

/* Directeur des vols */
.dvbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.dvbox .bh{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dvbox .bh .t{flex:1;min-width:200px}
.dvsec{padding:16px 18px;border-bottom:1px solid var(--line)}
.dvsec:last-child{border-bottom:0}
.dvsec h3{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stepn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-family:var(--f-disp);font-size:13px;font-weight:800}
.stepn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fdrop{border:2px dashed var(--line);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface2);width:100%}
.fdrop:hover{border-color:var(--muted)}
.fdrop b{display:block}
.fdrop.has{border-style:solid;background:var(--surface)}
.fdrop .t{flex:1;min-width:0}

.prog{display:flex;align-items:center;gap:10px;font-weight:700}
.pbar{width:140px;height:8px;border-radius:8px;background:var(--line);overflow:hidden}

.pill.sent{background:var(--warn2);color:var(--warn)}.pill.ok{background:var(--ok2);color:var(--ok)}.pill.todo{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.docs{display:grid;gap:8px}
.drow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}

.ask{background:linear-gradient(140deg,#eef4ff,#f7f2e4);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;margin-bottom:4px}

.ask p{margin:0;font-size:14px;line-height:1.5}

.coord{grid-column:2/-1;display:grid;gap:6px}

.hemi{display:flex;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;height:50px}

/* Rappel ZRT */
:root{--zrt:#d9a21b;--zrt-fill:rgba(234,179,8,.13);--axe:#3d6fd8;--pub:#22a45d;--pub-fill:rgba(34,164,93,.18);--pc:#f97316;--meas:#d33242}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--zrt:#f2c14e;--zrt-fill:rgba(242,193,78,.12);--axe:#7aa2ff;--pub:#3ccf7f;--pub-fill:rgba(60,207,127,.16);--meas:#ff6b77}}
:root[data-theme="dark"]{--zrt:#f2c14e;--zrt-fill:rgba(242,193,78,.12);--axe:#7aa2ff;--pub:#3ccf7f;--pub-fill:rgba(60,207,127,.16);--meas:#ff6b77}
details.zrt>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}

.zkeys{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.zk{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.zk b{font-family:var(--f-disp);font-size:20px;line-height:1}
.zk span{font-size:12px;color:var(--muted);font-weight:700;line-height:1.2}
.zgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.zfig{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.zfig svg{width:100%;height:auto;display:block}
.zfig figcaption{font-size:13px;font-weight:700;text-align:center}
.zfig figcaption small{display:block;font-weight:500;color:var(--muted)}
.zsvg text{font-family:var(--f-body);fill:var(--fg)}
.zsvg .lbl{font-size:11px;font-weight:700}
.zsvg .sm{font-size:9.5px;fill:var(--muted)}
.zsvg .zone{fill:var(--zrt-fill);stroke:var(--zrt);stroke-width:3.5}
.zsvg .ring{fill:none;stroke:var(--zrt);stroke-opacity:.25;stroke-width:1;stroke-dasharray:2 4}
.zsvg .axe{stroke:var(--axe);stroke-width:1.6;stroke-dasharray:7 5}
.zsvg .axet{fill:var(--axe);font-size:11px;font-weight:700}
.zsvg .pub{fill:var(--pub-fill);stroke:var(--pub);stroke-width:1.4}
.zsvg .pubt{fill:var(--pub);font-size:10px;font-weight:800}
.zsvg .pc{fill:var(--pc);stroke:#fff;stroke-width:1.2}
.zsvg .r6{stroke:var(--pc);stroke-width:1.6}
.zsvg .r6t{fill:var(--pc);font-size:12px;font-weight:800}
.zsvg .m4{stroke:var(--meas);stroke-width:1.6}
.zsvg .m4t{fill:var(--meas);font-size:12px;font-weight:800}
.zsvg .gnd{stroke:var(--muted);stroke-width:2}
.zsvg .hatch{stroke:var(--muted);stroke-opacity:.35;stroke-width:1}
.zret{margin-top:14px;border:2px solid var(--bad);border-radius:16px;padding:12px 14px;background:var(--surface)}
.zret h4{margin:0 0 8px;font-family:var(--f-disp);font-size:15px;color:var(--bad);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}

.zret li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}

/* Rappel stationnement */
:root{--grass:#d9f2dc;--taxi:#1f2937;--jet:#1d4ed8;--jet2:#d33242;--cargo:#7d8b6a;--cargo-d:#4b5640}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grass:#173322;--taxi:#cbd5e1;--jet:#6ea2ff;--cargo:#97a382;--cargo-d:#5d6a4f}}
:root[data-theme="dark"]{--grass:#173322;--taxi:#cbd5e1;--jet:#6ea2ff;--cargo:#97a382;--cargo-d:#5d6a4f}
.pfig{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:10px;overflow-x:auto}
.pfig svg{display:block;width:100%;min-width:560px;height:auto}
.psvg text{font-family:var(--f-body);fill:var(--fg)}
.psvg .grass{fill:var(--grass)}
.psvg .edge{stroke:var(--taxi);stroke-width:4}
.psvg .cl{stroke:var(--taxi);stroke-width:1.6}
.psvg .tx{stroke:var(--taxi);stroke-width:2.2;fill:none;stroke-dasharray:9 6}
.psvg .dim{stroke:var(--muted);stroke-width:1}
.psvg .dimt{font-size:11px;font-weight:800;fill:var(--muted);paint-order:stroke;stroke:var(--surface2);stroke-width:5px;stroke-linejoin:round}
.psvg .num{font-size:11px;font-weight:800}
.psvg .jet{fill:var(--jet)}.psvg .jet2{fill:var(--jet2)}.psvg .jw{fill:#fff}
.psvg .cargo{fill:var(--cargo)}.psvg .cargo2{fill:var(--cargo-d)}.psvg .cargo3{fill:var(--cargo-d);opacity:.45}.psvg .prop{fill:var(--cargo-d);opacity:.8}
.psvg .ctl{font-size:10.5px;font-weight:700;fill:var(--muted)}
.psvg .zone{fill:none;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:4 4}
.psvg .zonet{font-size:10.5px;font-weight:800;fill:var(--bad);paint-order:stroke;stroke:var(--surface2);stroke-width:5px;stroke-linejoin:round}
.dimtab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.dimtab th,.dimtab td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.dimtab th:first-child,.dimtab td:first-child{text-align:left}

.dimwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.warnbox{margin-top:12px;border:2px solid var(--bad);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;background:var(--bad2)}
.warnbox p{margin:0;font-size:14px;line-height:1.5}

/* Partie technique */
:root{--mr:#dc4a3a;--pf:#e2b766;--mrt:#fff;--pft:#4a3510}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mr:#c23d2f;--pf:#b98f45;--pft:#1d1406}}
:root[data-theme="dark"]{--mr:#c23d2f;--pf:#b98f45;--pft:#1d1406}
.pfig svg.dsvg{display:block;width:100%;min-width:0;max-width:560px;height:auto;margin:0 auto}
.dsvg text{font-family:var(--f-body)}
.dsvg .mr{fill:var(--mr)}.dsvg .pf{fill:var(--pf)}
.dsvg .rot{fill:var(--mr);opacity:.55}
.dsvg .lm{font-size:12px;font-weight:800;fill:var(--mrt)}
.dsvg .lp{font-size:12px;font-weight:800;fill:var(--pft)}
.dsvg .ld{font-size:13px;font-weight:800;fill:var(--fg)}
.dsvg .lx{font-size:11.5px;font-weight:700;fill:var(--muted)}
.dsvg .sep{stroke:var(--fg);stroke-width:1.2;stroke-dasharray:4 4;opacity:.5}
.dsvg .jet{fill:var(--jet)}.dsvg .jet2{fill:var(--jet2)}.dsvg .jw{fill:#fff}
.dleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.dleg>div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.dleg h5{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dleg p{margin:2px 0;font-size:14px;display:flex;align-items:center;gap:8px}
.dleg i{display:inline-block;width:14px;height:14px;border-radius:4px;flex:none}
.expl .dimwrap{margin:8px 0}
.tnote{width:100%;min-height:84px;resize:vertical}

/* Logement */
.rooms{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.rooms .big{font-family:var(--f-disp);font-size:30px;font-weight:800;line-height:1}
.rooms .gauge{flex:1;min-width:160px;height:12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.rooms .gauge i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--warn)}
.rooms .gauge i.ok{background:var(--ok)}.rooms .gauge i.ko{background:var(--bad)}
.rooms .gauge b{position:absolute;top:0;bottom:0;border-left:2px dashed var(--muted);opacity:.6}
.hcard{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface);margin-bottom:10px}
.hcard .t{flex:1;min-width:0}.hcard .nm{font-weight:800;font-size:16px}
.hcard .meta{font-size:13px;color:var(--muted);margin-top:2px}
.hcard .nb{font-family:var(--f-disp);font-weight:800;font-size:22px;text-align:right;line-height:1}
.hcard .nb small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--muted)}

/* Rubriques par thème */
.rubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:22px 0 6px}
.rub{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:132px}
.rub:hover{transform:translateY(-2px)}
.rub[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 12%,transparent),var(--shadow)}
.rub b{font-family:var(--f-disp);font-size:16px;line-height:1.15}
.rub small{font-size:12px;color:var(--muted);line-height:1.3}
.rub .rst{margin-top:auto;width:100%;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted)}
.rub .rst .pbar{flex:1;height:6px}
.rub .rst.ok{color:var(--ok)}.rub .rst.sent{color:var(--warn)}
.rub .dot{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.rub .dot.ok{background:var(--ok)}.rub .dot.sent{background:var(--warn)}
.rubhint{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:14px 2px}
#rubsec{scroll-margin-top:80px}
/* Détails incendie, repas, véhicules */
.fdet{grid-column:1/-1;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.fd{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fd>b{display:flex;align-items:center;gap:6px;font-size:14px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 100px auto;gap:8px;margin-top:8px;align-items:center}
.frow2{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px;margin-top:8px}
.fd .hint{margin-top:8px}
.okc{color:var(--ok)!important;font-weight:700}
.meal{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.meal:first-of-type{border-top:0}
.meal .mh b{display:flex;align-items:center;gap:6px}
.meal .rec{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.meal .rec b{color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chips button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chips button .star{color:var(--warn)}
.chips button[aria-pressed="true"] .star{color:inherit}
.mrow2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;margin-top:8px}
.dayc{border:1px solid var(--line);border-radius:16px;padding:6px 14px 8px;background:var(--surface);margin-bottom:10px}
.dayc h4{margin:8px 0 4px;display:flex;align-items:center;gap:8px;font-size:15px}
.dayc h4 .pill{padding:2px 9px;font-size:11px}
.cnt{display:grid;grid-template-columns:auto minmax(0,1fr) 92px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.cnt:first-of-type{border-top:0}
.cnt .tgt{font-size:12.5px;font-weight:800}
.hmap{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--pri);margin-top:4px;text-decoration:none}

/* Interlocuteurs, salles, communication */
.owners{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 -12px}

.roomh{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.roomh h3{margin:0 0 2px}
.linkbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none}

/* Équipe, volontaires, repas */
.tgrp{margin-top:14px}.tgrp h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px}

.mchip.lock[aria-pressed="true"] .av{background:var(--pri)}
.tot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(140deg,#eef4ff,#f7f2e4);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
:root[data-theme="dark"] .tot{background:linear-gradient(140deg,#16213d,#2a2412)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tot{background:linear-gradient(140deg,#16213d,#2a2412)}}
.tot .big{font-family:var(--f-disp);font-size:44px;font-weight:800;line-height:1}
.tot .det{display:flex;flex-wrap:wrap;gap:6px}

function merge3(base,mine,theirs){const out=clone(theirs);if(!base)return out;const J=JSON.stringify;
 ['meetings','members','access','pdocs','retex','itw','cad','rg'].forEach(k=>{if(!mine[k]&&!theirs[k])return;const B=new Map((base[k]||[]).map(x=>[x.id,x])),M=new Map((mine[k]||[]).map(x=>[x.id,x]));let T=(out[k]||[]).slice();const Ti=new Map(T.map((x,i)=>[x.id,i]));
  (mine[k]||[]).forEach(x=>{const b0=B.get(x.id);if(!b0){if(!Ti.has(x.id))T.push(x)}else if(J(b0)!==J(x)){if(Ti.has(x.id))T[Ti.get(x.id)]=x;else T.push(x)}});
  B.forEach((x,id)=>{if(!M.has(id))T=T.filter(y=>y.id!==id)});out[k]=T});
 Object.keys(mine).forEach(k=>{if(['meetings','members','access','pdocs','retex','itw','cad','rg','rev','ro'].includes(k))return;if(J(mine[k])!==J(base[k]))out[k]=(k==='pc'||k==='ex'||k==='asda')?mergeObj(base[k],mine[k],out[k]):mine[k]});

// Coordonnées : accepte « 48.5867, -3.8320 » ou « 48°35'12.1"N 3°49'55.2"W »
function parseCoord(t){

 const dec=t.match(/^(-?\d{1,2}(?:[.,]\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:[.,]\d+)?)$/);
 const ok=(la,lo)=>Math.abs(la)<=90&&Math.abs(lo)<=180?{lat:+la.toFixed(6),lon:+lo.toFixed(6)}:null;
 if(dec)return ok(parseFloat(dec[1].replace(',','.')),parseFloat(dec[2].replace(',','.')));
 const re=/(\d{1,3})\s*[°º]\s*(\d{1,2})?\s*['’′]?\s*(\d{1,2}(?:[.,]\d+)?)?\s*(?:["”″]|'')?\s*([NSEWO])/gi;
 const g=[...t.matchAll(re)];if(g.length!==2)return null;
 const v=x=>(+x[1]+(+(x[2]||0))/60+parseFloat(String(x[3]||0).replace(',','.'))/3600)*(/[SWO]/i.test(x[4])?-1:1);
 const a=g.find(x=>/[NS]/i.test(x[4])),b=g.find(x=>/[EWO]/i.test(x[4]));

}

}

 if([...la,...lo].some(isNaN))return null;
 if(la[0]>90||lo[0]>180||la[1]>=60||lo[1]>=60||la[2]>=60||lo[2]>=60||[...la,...lo].some(x=>x<0))return null;
 const lat=(la[0]+la[1]/60+la[2]/3600)*(o.latH==='S'?-1:1),lon=(lo[0]+lo[1]/60+lo[2]/3600)*(o.lonH==='O'||o.lonH==='W'?-1:1);

}

const WHO_S={team:'équipe',chauffeur:'chauffeur',o2:'convoyeurs oxygène',autre:'autre',adj:'ajusté par la PAF'};
function nightsAuto(m){const P=lodgPlan(m);if(!P.length)return [];const a=P.reduce((x,p)=>p.from<x?p.from:x,P[0].from),z=P.reduce((x,p)=>p.to>x?p.to:x,P[0].to),out=[];
 for(let d=a;d<=z;d=dAdd(d,1)){const parts=P.filter(p=>p.from<=d&&p.to>=d&&+p.n>0).map(p=>({who:p.who,n:+p.n}));if(parts.length)out.push({d,n:parts.reduce((x,p)=>x+p.n,0),parts})}return out}
/* Ajustements du chef ops / de la secrétaire, nuit par nuit : ils priment sur le calcul */
function nightsWanted(m){const A=lodg(m).adj||{},out=nightsAuto(m).map(x=>Object.assign({},x));
 Object.keys(A).forEach(d=>{const n=+A[d];const i=out.findIndex(x=>x.d===d);if(i>=0){if(n<=0)out.splice(i,1);else{out[i].auto=out[i].n;out[i].n=n;out[i].parts=[{who:'adj',n}]}}else if(n>0)out.push({d,n,parts:[{who:'adj',n}],added:true})});
 return out.sort((a,b)=>a.d.localeCompare(b.d))}
const bookedOk=(m,L)=>{const N=nightsWanted(m),B=L.booked||{};return N.length>0&&N.every(x=>B[x.d]!==undefined&&B[x.d]!==''&&+B[x.d]>=x.n)};
const bookedKo=(m,L)=>{const B=L.booked||{};return nightsWanted(m).some(x=>B[x.d]!==undefined&&B[x.d]!==''&&+B[x.d]<x.n)};

/* ====================== Séquences (week-ends) et vœux des volontaires ====================== */
const SEQC=['#3b82f6','#ec4899','#22c55e','#f59e0b','#a855f7','#06b6d4','#ef4444','#6366f1'];
function mSpan(m){const ds=[...entrs(m),...(m.demos||[])].filter(Boolean).sort();return ds.length?[ds[0],ds[ds.length-1]]:null}
function anchorSat(s){const d=fromISO(s),w=d.getDay(),off={6:0,0:-1,1:-2,2:-3,3:3,4:2,5:1}[w];d.setDate(d.getDate()+off);return iso(d)}
function seqs(all){const L=DB.meetings.map(m=>({m,sp:mSpan(m)})).filter(x=>x.sp&&(all||daysTo(x.sp[1])>=0)).sort((a,b)=>a.sp[0].localeCompare(b.sp[0]));const out=[];
 L.forEach(x=>{const a=anchorSat(x.sp[1]);let S0=out.find(s=>s.id===a||(x.sp[0]<=s.end&&x.sp[1]>=s.start));if(!S0){S0={id:a,start:x.sp[0],end:x.sp[1],ms:[]};out.push(S0)}S0.ms.push(x.m);if(x.sp[0]<S0.start)S0.start=x.sp[0];if(x.sp[1]>S0.end)S0.end=x.sp[1]});
 out.sort((a,b)=>a.start.localeCompare(b.start)).forEach((s,i)=>s.c=SEQC[i%SEQC.length]);return out}
const seqOf=m=>seqs().find(s=>s.ms.includes(m));
const seqOfAll=m=>seqs(true).find(s=>s.ms.includes(m));
const seqLabel=s=>{const a=fromISO(s.start),b=fromISO(s.end),f=(d,o)=>d.toLocaleDateString('fr-FR',o);return a.getMonth()===b.getMonth()?`Du ${f(a,{weekday:'short',day:'numeric'})} au ${f(b,{weekday:'short',day:'numeric',month:'long'})}`:`Du ${f(a,{weekday:'short',day:'numeric',month:'short'})} au ${f(b,{weekday:'short',day:'numeric',month:'short'})}`};
const VKEY=KEY+':voter';
function voter(){try{return JSON.parse(localStorage.getItem(VKEY)||'null')}catch(e){return null}}
function setVoter(v){try{if(v)localStorage.setItem(VKEY,JSON.stringify(v));else localStorage.removeItem(VKEY)}catch(e){}}
const vkey=v=>v.mem?v.mem:'n:'+v.name.toLowerCase();
function myVote(){const v=voter();if(!v)return null;DB.votes=DB.votes||{};const k=vkey(v);DB.votes[k]=DB.votes[k]||{name:v.name,fn:v.fn,mem:v.mem||'',seq:{}};return DB.votes[k]}
function togSeq(id){const V=myVote();if(V.seq[id]!==undefined)delete V.seq[id];else V.seq[id]=0;save();render()}
function setPrio(id,p){const V=myVote();if(V.seq[id]===p){V.seq[id]=0}else{Object.keys(V.seq).forEach(k=>{if(V.seq[k]===p)V.seq[k]=0});V.seq[id]=p}save();render()}
function voterStatus(v,s){const ok=s.ms.some(m=>{const t=team(m);return v.mem?teamList(m).some(x=>x.id===v.mem):t.ext.some(e=>e.name.toLowerCase()===v.name.toLowerCase())});if(ok)return 'ok';const ko=s.ms.every(m=>(team(m).ref||[]).includes(vkey(v)));return ko?'ko':''}
function calMonth(SQ){const now=new Date();let ym=S.calM;if(!ym){const f=SQ[0]?fromISO(SQ[0].start):now;ym=f.getFullYear()*12+f.getMonth()}S.calM=ym;
 const y=Math.floor(ym/12),mo=ym%12,first=new Date(y,mo,1),st=new Date(first);st.setDate(1-((first.getDay()+6)%7));
 const byDay={};SQ.forEach(s=>s.ms.forEach(m=>{[...entrs(m),...(m.demos||[])].filter(Boolean).forEach(d=>{(byDay[d]=byDay[d]||[]).push({m,s,ty:entrs(m).includes(d)?'entr':'demo'})})}));
 let cells='';for(let i=0;i<42;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=iso(d),ev=byDay[k]||[],out=d.getMonth()!==mo;
  cells+=`<div class="cday ${out?'out':''} ${k===iso(today)?'today':''}"><span class="dn">${d.getDate()}</span>${ev.map(e=>`<${S.calGo?'button':'span'} class="cev" style="--c:${e.s.c}" title="${esc(mName(e.m))}" ${S.calGo?`onclick="S.rub=null;go('meeting','${e.m.id}')"`:''}>${e.ty==='entr'?ic('plane',10):ic('star',10)} ${esc(e.m.city||mName(e.m))}</${S.calGo?'button':'span'}>`).join('')}</div>`}
 return `<div class="cal"><div class="calh"><button class="ib" onclick="S.calM--;render()" aria-label="Mois précédent">${ic('back',16)}</button><b>${first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><button class="ib" onclick="S.calM++;render()" aria-label="Mois suivant" style="transform:rotate(180deg)">${ic('back',16)}</button></div>
  <div class="cgridc">${['lun','mar','mer','jeu','ven','sam','dim'].map(d=>`<div class="cdh">${d}</div>`).join('')}${cells}</div>
  <div class="small muted" style="margin-top:8px">${ic('plane',12)} entraînement · ${ic('star',12)} démonstration · une couleur par séquence</div></div>`}
function vVote(){
 const v=voter(),SQ=seqs();
 if(!v){const f=VF.fn||'',ms=f?DB.members.filter(x=>x.fn===f):[];
  return `<div class="head"><div><h1>Mes meetings</h1><p class="muted">D'abord, dites-nous qui vous êtes.</p></div></div>

   <label class="l" for="v-name">${ms.length?'Pas dans la liste ? ':''}Votre grade, prénom et nom</label><input class="in" id="v-name" value="${esc(VF.name||'')}" oninput="VF.name=this.value;VF.mem=''"></div>
   <div class="dvfoot"><span></span><button class="btn pri big" onclick="iAm()">${ic('check',18)} C'est moi</button></div>`:''}</section>`}

 ${calMonth(SQ)}
 <div class="lead" style="margin:18px 0 10px">Cochez les séquences qui vous intéressent, puis donnez jusqu'à 3 préférences. <span class="lchip">${n} cochée${n>1?'s':''}</span></div>
 ${SQ.length?`<div class="seqs">${SQ.map(s=>{const p=V.seq[s.id],on=p!==undefined,st=voterStatus(v,s);
  return `<div class="seq ${on?'on':''}" style="--c:${s.c}"><div class="seqh"><span class="sdot"></span><div style="flex:1;min-width:0"><b>${seqLabel(s)}</b><div class="small muted">${s.ms.map(m=>esc(mName(m))+' ('+esc(m.city||'')+')').join(' · ')}</div></div>
   ${st==='ok'?`<span class="pill ok">${ic('check',13,3)} Retenu</span>`:st==='ko'?'<span class="pill todo">Pas retenu</span>':''}</div>
   <div class="seqa"><button class="vbtn" aria-pressed="${on}" onclick="togSeq('${s.id}')">${on?ic('check',16,3)+' Je suis volontaire':ic('hand',16)+' Je me propose'}</button>
    ${on?`<div class="prios">${[1,2,3].map(k=>`<button aria-pressed="${p===k}" onclick="setPrio('${s.id}',${k})">Préférence n°${k}</button>`).join('')}</div>`:''}</div></div>`}).join('')}</div>`:'<p class="muted">Aucun meeting à venir pour l\'instant.</p>'}
 <p class="small muted" style="margin-top:14px">${ic('info',13)} Une séquence regroupe les meetings d'un même week-end, entraînements compris. La secrétaire ops choisit en favorisant les préférences, puis confirme.</p>`;
}
function iAm(){const x=VF.mem?DB.members.find(y=>y.id===VF.mem):null,name=x?[x.grade,x.first,x.last].filter(Boolean).join(' '):(VF.name||'').trim();if(!VF.fn||!name){toast('Choisissez votre nom ou écrivez-le');return}setVoter({fn:VF.fn,mem:x?x.id:'',name});VF={};render()}
/* Côté secrétaire : volontaires de la séquence, triés par priorité puis par équité */
function seqVolunteers(m){const s=seqOf(m);if(!s)return [];const t=team(m),ids=new Set(teamList(m).map(x=>x.id)),ref=t.ref||[];
 const done=k=>DB.meetings.filter(mm=>mm!==m&&(k.startsWith('n:')?team(mm).ext.some(e=>'n:'+e.name.toLowerCase()===k):teamList(mm).some(x=>x.id===k))).length;
 return Object.entries(DB.votes||{}).filter(([k,V])=>V.seq[s.id]!==undefined&&!ref.includes(k)&&!(V.mem?ids.has(V.mem):t.ext.some(e=>e.name.toLowerCase()===V.name.toLowerCase())))
  .map(([k,V])=>({k,V,p:V.seq[s.id]||4,n:done(k)})).sort((a,b)=>a.p-b.p||a.n-b.n||a.V.name.localeCompare(b.V.name))}
function voteAns(mid,k,ok){const m=DB.meetings.find(x=>x.id===mid),t=team(m),V=(DB.votes||{})[k];if(!V)return;
 if(ok){if(V.mem){const x=DB.members.find(y=>y.id===V.mem);if(x){t.out=t.out.filter(i=>i!==x.id);if(!isDefault(x)&&!t.add.includes(x.id))t.add.push(x.id)}}else t.ext.push({id:uid(),name:V.name,fn:V.fn})}
 else{t.ref=t.ref||[];t.ref.push(k)}save();render();toast(ok?'Ajouté à l\'équipe':'Proposition écartée')}

/* ====================== Logement : plan des chambres (calculé, modifiable par le chef ops et la secrétaire) ====================== */
const WHO_L={team:'Toute l\'équipe',chauffeur:'Chauffeur du camion',o2:'Convoyeurs oxygène',autre:'Autre'};
const dAdd=(s,n)=>{const d=fromISO(s);d.setDate(d.getDate()+n);return iso(d)};
function autoPlan(m){const sp=mSpan(m);if(!sp)return [];const a=sp[0],z=sp[1];
 return [{id:'p1',who:'chauffeur',n:1,from:dAdd(a,-1),to:dAdd(a,-1)},{id:'p2',who:'team',n:teamN(m)||35,from:a,to:z},{id:'p3',who:'chauffeur',n:1,from:dAdd(z,1),to:dAdd(z,1)}]}
function lodgPlan(m){const L=lodg(m);if(L.plan&&L.planEdited)return L.plan;return autoPlan(m)}
const dShort=s=>fromISO(s).toLocaleDateString('fr-FR',{day:'numeric',month:'2-digit'});
const nightsTxt=p=>p.from===p.to?`Nuit du ${dShort(p.from)}`:`Nuits du ${dShort(p.from)} au ${dShort(p.to)}`;
const maxNight=m=>{const P=lodgPlan(m);if(!P.length)return 0;let mx=0;P.forEach(p=>{for(let d=p.from;d<=p.to;d=dAdd(d,1)){const t=P.filter(q=>q.from<=d&&q.to>=d).reduce((a,q)=>a+(+q.n||0),0);if(t>mx)mx=t}});return mx};
function planTable(m,canEd){const P=lodgPlan(m);
 return `<div class="plan">${P.map(p=>`<div class="pl"><span class="pln">${+p.n||0}</span><div style="flex:1;min-width:0"><b>${nightsTxt(p)}</b><span class="small muted" style="display:block">${WHO_L[p.who]||esc(p.who)} · ${+p.n>1?'chambres individuelles':'chambre individuelle'} · arrivée le ${dShort(p.from)}, départ le ${dShort(dAdd(p.to,1))}</span></div></div>`).join('')||'<p class="small muted">Les dates du meeting ne sont pas encore connues.</p>'}
 ${canEd?`<button class="more" onclick="planSheet('${m.id}')">${ic('edit',14)} Modifier les chambres demandées</button>`:''}</div>`}
function planSheet(mid){if(!canVal('lodg'))return;const m=DB.meetings.find(x=>x.id===mid),L=lodg(m);if(!L.planEdited){L.plan=JSON.parse(JSON.stringify(autoPlan(m)));}S.fs={mid};openLive(planHTML)}
function setAdj(d,n){const m=DB.meetings.find(x=>x.id===S.fs.mid),L=lodg(m);L.adj=L.adj||{};const auto=nightsAuto(m).find(x=>x.d===d);n=Math.max(0,+n||0);
 if(auto&&auto.n===n)delete L.adj[d];else if(!auto&&n===0)delete L.adj[d];else L.adj[d]=n;save();render()}
function addNight(d){if(!d)return;const m=DB.meetings.find(x=>x.id===S.fs.mid);if(nightsWanted(m).some(x=>x.d===d)){toast('Cette nuit est déjà dans la liste');return}setAdj(d,teamN(m)||1)}
function planHTML(){const m=DB.meetings.find(x=>x.id===S.fs.mid),L=lodg(m),P=L.plan||[],N=nightsWanted(m),A=L.adj||{},tot=N.reduce((a,x)=>a+x.n,0);
 return shHead({i:'bed',c1:'#a855f7',c2:'#7e22ce'},'Chambres demandées','Calculées à partir des dates et de l\'équipe. Vous gardez la main : ajustez une nuit, ajoutez-en ou retirez-en.')+`<div class="sb">
  <label class="l">Nuit par nuit · ${N.length} nuit${N.length>1?'s':''}, ${tot} nuitées</label>

const FEA_C=[['ann','Mission annulée','#ef4444','#b91c1c','x'],['int','Mission interrompue','#f59e0b','#c2410c','alert'],['rien','Aucune conséquence','#22c55e','#15803d','check']];
function feaNew(){const d=new Date();return {date:iso(d),time:String(d.getHours()).padStart(2,'0')+':'+String(Math.floor(d.getMinutes()/5)*5).padStart(2,'0'),ac:'',cons:'',txt:'',photos:[]}}
/* Photos d'une FEA : réduites sur le téléphone (1600 px, ≈ 200-400 Ko) + vignette de 200 px gardée dans la fiche */
const FEA_PMAX=6;
function shrink(file,max,q){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>ok({blob:b,url:c.toDataURL('image/jpeg',q)}),'image/jpeg',q)};im.src=r.result};r.readAsDataURL(file)})}
function feaAddPhotos(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{const f=feaIn();f.photos=f.photos||[];const L=[...i.files].slice(0,FEA_PMAX-f.photos.length);
 if(i.files.length>L.length)toast(FEA_PMAX+' photos au maximum par FEA');
 for(const file of L){try{const big=await shrink(file,1600,.78),th=await shrink(file,160,.55);f.photos.push({id:uid(),name:(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',size:big.blob.size,blob:big.blob,thumb:th.url})}catch(e){toast('Image illisible : '+file.name)}}render()};i.click()}
function feaDelPhoto(id){const f=feaIn();f.photos=(f.photos||[]).filter(p=>p.id!==id);render()}
/* Envoi d'une photo : dans la maquette elle reste dans le navigateur ; en ligne elle part dans le Drive de PAF OPS */
async function feaUp(p){const b64=await new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>ok(String(r.result).split(',')[1]);r.readAsDataURL(p.blob)});
 // jusqu'à 4 essais : une réponse perdue en route (réseau mobile) ne fait plus échouer l'envoi, et le serveur ne crée pas de doublon
 let r=null,last='';for(let k=0;k<4&&!(r&&r.id);k++){if(k)await new Promise(ok=>setTimeout(ok,1500*k));try{r=await api('upload',{name:p.name,type:'image/jpeg',b64,mid:null,label:'FEA',key:p.id});if(r&&r.error)throw new Error(r.error)}catch(e){last=e.message||'';r=null;if(/Consultation|trop lourd|vide/.test(last))break}}
 if(!r||!r.id)throw new Error(last||'envoi impossible');try{FILEB[p.id]=URL.createObjectURL(p.blob)}catch(e){}return {driveId:r.id}}
async function feaView(feaId,pid){const e=(DB.fea||[]).find(x=>x.id===feaId),p=e&&(e.photos||[]).find(x=>x.id===pid);if(!p)return;
 let src=FILEB[p.id];if(!src&&p.driveId&&typeof api==='function'){toast('Ouverture de la photo…');try{const r=await api('dl',{id:p.driveId});if(r&&r.b64){const bin=atob(r.b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);src=FILEB[p.id]=URL.createObjectURL(new Blob([u8],{type:r.type||'image/jpeg'}))}else toast(r&&r.error||'Photo indisponible')}catch(err){toast('Connexion impossible')}}
 src=src||p.thumb;const L=e.photos,k=L.indexOf(p);
 openSheet(()=>`<div class="sh"><div class="t"><div class="q">Photo ${k+1} / ${L.length}</div><div class="small muted">Alphajet n° ${esc(e.ac)} · ${fromISO(e.date).toLocaleDateString('fr-FR')}</div></div><button class="ib" onclick="closeSheet()" aria-label="Fermer">${ic('x',18)}</button></div>
  <div class="sb"><img src="${src}" alt="" style="width:100%;border-radius:12px;display:block"></div>
  <div class="sf">${k>0?`<button class="btn" onclick="feaView('${e.id}','${L[k-1].id}')">${ic('back',16)} Précédente</button>`:'<span></span>'}${k<L.length-1?`<button class="btn" onclick="feaView('${e.id}','${L[k+1].id}')">Suivante ${ic('chev',16)}</button>`:'<span></span>'}</div>`)}

let FEA_BUSY=false;
async function feaSave(){if(FEA_BUSY)return;const f=feaIn();const err=!f.date?'Indiquez la date.':!f.time?'Indiquez l\'heure.':!/^\d{2,3}$/.test(String(f.ac).trim())?'Indiquez le numéro de l\'Alphajet (2 ou 3 chiffres).':!f.cons?'Indiquez la conséquence sur la mission.':!f.txt.trim()?'Décrivez en quelques mots ce qui est arrivé.':'';

 if(S.feaEdit&&isChef()){const e=(DB.fea||[]).find(x=>x.id===S.feaEdit);if(e){Object.assign(e,{date:f.date,time:f.time,ac:String(f.ac).trim(),cons:f.cons,txt:f.txt.trim(),photos:ph,editedAt:Date.now()});if(forM){e.by=memLabel(forM);e.byMail=forM.mail||'';e.postedBy=e.postedBy||'le chef des opérations'}

/* Modèle : feuilles « Centrage SR20 » et « Centrage SR22 G3-G5 » de l'escadron (masses en lb, moments en lb·in/1000),
   masses à vide et moments : Lutin SR2X édition 2024, §11. Les bras sont ceux des feuilles (par kg ou par USG). */
const CG_T={
 SR20:{l:'SR20',mtow:3050,fuelMax:56,tks:false,arm:{f:0.32,r:0.40,b:0.46,fuel:0.93,tks:1.4},
  env:w=>[(w-132.8)/6.8,(w+23.6)/6.8],wmin:2200},
 G3:{l:'SR22 G3',mtow:3400,fuelMax:92,tks:true,arm:{f:0.32,r:0.40,b:0.46,fuel:0.93,tks:1.4},
  fwd:[[2200,304],[2300,318],[2400,333],[2500,347],[2600,362],[2700,375],[2800,390],[2900,406],[3000,421],[3100,437],[3200,452],[3300,467],[3400,484]],
  env:function(w){return [lerp(this.fwd.map(p=>p[0]),this.fwd.map(p=>p[1]),w),326+(w-2200)*178/1200]},wmin:2200},
 G5:{l:'SR22 G5',mtow:3600,fuelMax:92,tks:true,arm:{f:0.1435*2.205,r:0.18*2.205,b:0.208*2.205,fuel:0.1549*6,tks:0.148*9.2},

const CG_FLEET=[

 ['SR20','F-HKCH',2177,306.0],['SR20','F-HKCJ',2175,306.0],['SR20','F-HKCK',2178,306.6],['SR20','F-HKCM',2178,306.1],['SR20','F-HKCN',2175,305.5],
 ['SR20','F-HKCP',2175,305.5],['SR20','F-HKCQ',2170,304.0],['SR20','F-HKCT',2172,304.8],['SR20','F-HKCU',2179,306.2],['SR20','F-HKCV',2174,305.0],['SR20','F-HKCX',2172,304.8],
 ['G3','F-HKCA',2336,323.6],['G3','F-HKCF',2317,320.0],['G3','F-HKCI',2344,324.4],['G3','F-HKCL',2323,322.2],['G3','F-HKCO',2328,322.1],
 ['G5','F-GKCI',2400,334.5],['G5','F-HKCC',2420,339.6],['G5','F-HKCY',2444,345.1],['G5','F-HKCZ',2427,340.7]];
const CG_BAGMAX=59,LB=2.205;
function cgIn(){if(!S.cg){let o=null;try{o=JSON.parse(localStorage.getItem(KEY+':cg')||'null')}catch(e){}
 S.cg=Object.assign({type:'SR20',ac:'F-HKCB',ew:2179,em:306.6,fl:85,fr:0,rl:0,rr:0,bag:5,fuel:40,tks:3,burn:15},o||{})}return S.cg}
function cgSet(k,v){const o=cgIn();o[k]=v;
 if(k==='type'){const f=CG_FLEET.find(a=>a[0]===v);if(f){o.ac=f[1];o.ew=f[2];o.em=f[3]}else{o.ac='autre'}o.fuel=Math.min(o.fuel,CG_T[v].fuelMax)}
 if(k==='ac'){const f=CG_FLEET.find(a=>a[1]===v);if(f){o.type=f[0];o.ew=f[2];o.em=f[3]}}
 try{localStorage.setItem(KEY+':cg',JSON.stringify(o))}catch(e){}render()}
function cgCalc(){const o=cgIn(),T=CG_T[o.type]||CG_T.SR20,A=T.arm;
 const kg=k=>Math.max(0,+o[k]||0);const tks=T.tks?Math.max(0,+o.tks||0):0,fuel=Math.max(0,+o.fuel||0),burn=Math.min(fuel,Math.max(0,+o.burn||0));
 const pax=kg('fl')+kg('fr')+kg('rl')+kg('rr')+kg('bag');
 const W=(+o.ew||0)+pax*LB+fuel*6+tks*9.2;
 const M=(+o.em||0)+(kg('fl')+kg('fr'))*A.f+(kg('rl')+kg('rr'))*A.r+kg('bag')*A.b+fuel*A.fuel+tks*A.tks;
 const pt=(w,m)=>{const [mn,mx]=T.env(w);const pct=mx>mn?100*(m-mn)/(mx-mn):0;return {w,m,mn,mx,pct,cg:w?m*1000/w:0,inEnv:m>=mn-1e-9&&m<=mx+1e-9&&w<=T.mtow}};
 const to=pt(W,M),ldg=pt(W-burn*6,M-burn*A.fuel),zfw=pt(W-fuel*6-tks*9.2,M-fuel*A.fuel-tks*A.tks);
 const rest=(T.mtow-W)/LB,fuelMax=Math.max(0,Math.min(T.fuelMax,fuel+(T.mtow-W)/6));
 const al=[];
 if(W>T.mtow)al.push({t:'bad',h:'Masse maximale dépassée',p:`${Math.round(W)} lb pour ${T.mtow} lb autorisées (${Math.round((W-T.mtow)/LB)} kg de trop). Réduire le carburant ou la charge.`});
 if(!to.inEnv&&W<=T.mtow)al.push({t:'bad',h:to.m<to.mn?'Centrage trop avant au décollage':'Centrage trop arrière au décollage',p:'Le point de décollage est hors de l\'enveloppe. Déplacer des masses (bagages, passagers) ou revoir le carburant.'});
 if(to.inEnv&&!ldg.inEnv)al.push({t:'bad',h:'Hors enveloppe à l\'atterrissage',p:'En consommant le carburant prévu, le centrage sort de l\'enveloppe. Revoir la répartition des masses.'});
 if(to.inEnv&&ldg.inEnv&&!zfw.inEnv)al.push({t:'warn',h:'Hors enveloppe réservoirs vides',p:'Avec tout le carburant consommé le centrage sortirait de l\'enveloppe : attention en cas de vol plus long que prévu.'});
 if(kg('bag')>CG_BAGMAX)al.push({t:'bad',h:'Soute bagages : 59 kg maximum',p:`${kg('bag')} kg saisis pour 130 lb (59 kg) autorisés.`});
 if(fuel>T.fuelMax)al.push({t:'warn',h:'Carburant au-dessus du plein complet',p:`Plein complet ${T.fuelMax} USG sur ${T.l}.`});
 if(to.inEnv&&W<=T.mtow&&(to.pct<8||to.pct>92))al.push({t:'warn',h:'Centrage proche d\'une limite',p:`Point de décollage à ${Math.round(to.pct)} % de la plage (0 % = limite avant, 100 % = limite arrière).`});
 if(!al.length)al.push({t:'ok',h:'Dans l\'enveloppe',p:`Décollage, atterrissage estimé et réservoirs vides sont dans les limites. Charge utile restante ≈ ${Math.max(0,Math.round(rest))} kg.`});
 return {T,W,M,to,ldg,zfw,rest,fuelMax,pax,burn,al,ok:al[0].t==='ok'||al.every(a=>a.t!=='bad')}}
function cgSvg(x){const T=x.T,w0=T.wmin-100,w1=T.mtow+150,pts=[];const n=48,CG=(m,w)=>m*1000/w;
 for(let i=0;i<=n;i++){const w=T.wmin+(T.mtow-T.wmin)*i/n;pts.push([CG(T.env(w)[0],w),w])}
 for(let i=n;i>=0;i--){const w=T.wmin+(T.mtow-T.wmin)*i/n;pts.push([CG(T.env(w)[1],w),w])}
 const ms=pts.map(p=>p[0]).concat([x.to.cg,x.ldg.cg,x.zfw.cg]),m0=Math.min(...ms)-1.5,m1=Math.max(...ms)+1.5;
 const Wd=420,Hd=300,L=52,R=14,Tp=14,B=36;const X=m=>L+(m-m0)/(m1-m0)*(Wd-L-R),Y=w=>Tp+(w1-w)/(w1-w0)*(Hd-Tp-B);

 const gy=[];for(let w=Math.ceil(w0/200)*200;w<=w1;w+=200)gy.push(w);const gx=[];for(let m=Math.ceil(m0);m<=m1;m+=1)gx.push(m);
 const dot=(p,c,lab,r)=>{const left=X(p.cg)>Wd-110;return `<circle cx="${X(p.cg).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="${r}" fill="${c}" stroke="#fff" stroke-width="2"/><text x="${(X(p.cg)+(left?-r-4:r+4)).toFixed(1)}" y="${(Y(p.w)+4).toFixed(1)}" class="cgl" fill="${c}" text-anchor="${left?'end':'start'}">${lab}</text>`};
 const okc=x.to.inEnv&&x.ldg.inEnv&&x.W<=T.mtow?'var(--ok)':'var(--bad)';
 return `<svg class="cgsvg" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Enveloppe de centrage ${T.l}">
  ${gy.map(w=>`<line class="cgg" x1="${L}" x2="${Wd-R}" y1="${Y(w).toFixed(1)}" y2="${Y(w).toFixed(1)}"/><text class="cgt" x="${L-6}" y="${(Y(w)+4).toFixed(1)}" text-anchor="end">${w}</text>`).join('')}
  ${gx.map(m=>`<line class="cgg" y1="${Tp}" y2="${Hd-B}" x1="${X(m).toFixed(1)}" x2="${X(m).toFixed(1)}"/><text class="cgt" y="${Hd-B+14}" x="${X(m).toFixed(1)}" text-anchor="middle">${m}</text>`).join('')}

  ${dot(x.zfw,'#64748b','Réservoirs vides',5)}${dot(x.ldg,'#f59e0b','Atterrissage',6)}${dot(x.to,x.to.inEnv&&x.W<=T.mtow?'#16a34a':'#dc2626','Décollage',8)}

  <text class="cgt" transform="translate(11 ${((Hd-B)/2+Tp).toFixed(1)}) rotate(-90)" text-anchor="middle">Masse (lb)</text></svg>`}

/* ====================== RETEX : retours d'expérience par lieu ====================== */
/* Une remarque = un lieu, une année, une rubrique (OPS, Rayonnement, Log, Comm), un type (synthèse du #5, remarque, compte rendu DT/CST ou Comm) et une diffusion (interne par défaut).
   Jamais envoyé à l'organisateur ni au DV : le serveur ne transmet le RETEX qu'aux rôles de la Patrouille. */
/* 4 rubriques : OPS (DV, démonstration en vol) · Technique (mécas) · Rayonnement / Comm · Log (hébergement, repas, locomotion)
   Accès (lecture et écriture) : pilotes et direction → tout ; DT / CST → Technique, Rayonnement / Comm, Log ; Comm → Rayonnement / Comm, Log ; secrétaire ops → Log */
const RX_R=[['ops','OPS','#3b82f6','#1d4ed8','plane','Travail du DV, démonstration en vol'],['tech','Technique','#64748b','#334155','wrench','Mécas : avions, parking, servitudes, pièces'],['ray','Rayonnement / Comm','#ec4899','#be185d','star','Public, médias, relations publiques'],['log','Log','#a855f7','#7e22ce','bed','Hébergement, repas, locomotion']];
const rxRub=e=>e.rub==='com'?'ray':(e.rub||'ops');   // l'ancienne rubrique Comm est rangée avec le Rayonnement
const RX_V=[['int','Interne PAF','#64748b','lock'],['org','À dire à l\'organisateur','#16a34a','send'],['dv','À dire au DV','#6366f1','radio'],['gen','Leçon générale','#d97706','star']];
const RX_K={syn:'Synthèse',rem:'Remarque',crt:'Compte rendu DT / CST',crc:'Compte rendu Comm'};
const rxRm=Object.fromEntries(RX_R.map(r=>[r[0],r])),rxVm=Object.fromEntries(RX_V.map(v=>[v[0],v]));
const rxCan=()=>['chef','sec','dt','cst','comm','visit'].includes(ROLE);
const rxKey=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').replace(/\bSTE\b/g,'SAINTE').replace(/\bST\b/g,'SAINT').trim();
const rxNice=s=>String(s||'').toLowerCase().replace(/(^|[\s\-'’(])(\p{L})/gu,(a,b,c)=>b+c.toUpperCase());
const rxSynN=()=>+(DB.rxSyn||5);
const rxSiteOf=m=>m.rxSite||rxKey(m.city);

function exImport(){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls';i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;toast('Lecture de '+f.name+'…');

   const tour=/^T[123]$/.test(String(row[1]||'').trim())?String(row[1]).trim():'T2',time=TT[tour],dt=fromISO(d),w=iso(pcMon(dt)),dd=Math.round((dt-fromISO(w))/864e5),id='xl-'+box+'-'+d+'-'+tour;
   const dom={};[['out',2],['in',3],['to',4],['brk',5]].forEach(([k,c])=>{const v=String(row[c]||'').trim().toUpperCase();if(v)dom[k]=v});
   const c={};for(let q=6;q<=30;q+=3){const fig=String(row[q]||'').trim().toUpperCase();if(!fig)continue;const form=String(row[q+1]||'').trim().toUpperCase(),nb=Math.max(1,Math.round(+row[q+2]||1)),k=exKey(fig,form);c[k]=(c[k]||0)+nb}
   const old=DB.ex[id],e={w,d:dd,time,title:'@'+box+' · classeur',ev:id,tour,box,dom,c,g:old&&old.g||{},note:old&&old.note||'',by:'Classeur Excel',t:old&&old.t||Date.now(),tm:Date.now(),v2:1,xl:1,sheet:Date.now()};

/* Le break : l'instant où chaque avion entame son virage (taux > 5°/s tenu 3 s) après le passage à grande vitesse */
function rgBreaks(R){R.A.forEach(a=>{if(a.bad)return;const hd=i=>Math.atan2(a.x[i+1]-a.x[i-1],a.y[i+1]-a.y[i-1]),rate=i=>{let d=(hd(i+1)-hd(i-1))*180/Math.PI/2;while(d>180)d-=360;while(d<-180)d+=360;return Math.abs(d)};
  let b=-1;for(let i=a.dw[0]-20;i<a.td-10;i++){if(i<2||isNaN(a.x[i-2])||isNaN(a.x[i+2])||!(a.v[i]>170))continue;if(rate(i)>5&&rate(i+1)>5&&rate(i+2)>5){b=i;break}}
  a.brk=b>=0?b:a.dw[0];a.dw[0]=Math.min(a.dw[0],a.brk);

  const h0=hd(Math.max(2,a.brk-4));let s0=-1,e0=-1;for(let i=a.brk+3;i<a.td-5;i++){if(i<2||isNaN(a.x[i-2])||isNaN(a.x[i+2]))continue;let dh=(hd(i)-h0)*180/Math.PI;while(dh>180)dh-=360;while(dh<-180)dh+=360;
   if(s0<0){if(Math.abs(Math.abs(dh)-180)<30&&rate(i)<2.5&&rate(i+1)<2.5)s0=i}else if(rate(i)>3&&rate(i+1)>3){e0=i;break}}
  a.dwE=s0>=0?[s0,e0>=0?e0:a.td]:null});
 const ok=R.A.filter(a=>!a.bad);R.ordDw=ok.slice().sort((p,q)=>p.brk-q.brk).map(a=>a.k);
 R.brkGap=[];for(let r=1;r<R.ordDw.length;r++){const A0=R.A[R.ordDw[r-1]],A1=R.A[R.ordDw[r]];R.brkGap.push({a:A0.k,b:A1.k,t:A1.brk,gap:A1.brk-A0.brk})}}
/* Phases d'un avion : roulage aller, course, vol, break, posé, roulage retour */
function rgPhases(a){const N=a.v.length,v=a.v,up=i=>v[i]>60;let to=-1;
 for(let i=0;i<N-10&&to<0;i++){let ok=true;for(let j=0;j<10;j++)if(!up(i+j)){ok=false;break}if(ok)to=i}
 if(to<0){a.bad='décollage introuvable';return}
 let roll=to;while(roll>0&&v[roll-1]>=25)roll--;let s=0;while(s<roll&&!(v[s]>=1))s++;a.out=[s,roll];a.to=to;
 let land=-1;for(let i=N-1;i>to;i--)if(up(i)){land=i;break}
 let re=land;while(re<N-1&&!(v[re]<25))re++;let e=N-1;while(e>re&&!(v[e]>=1))e--;a.in=[re,e];
 const zs=[];for(let i=s;i<roll;i++)if(!isNaN(a.z[i]))zs.push(a.z[i]);zs.sort((p,q)=>p-q);a.gz=zs.length?zs[zs.length>>1]:NaN;
 let td=-1;if(!isNaN(a.gz)){for(let i=land;i>to;i--)if(a.z[i]-a.gz>20){td=Math.min(land,i+3);break}}if(td<0)td=Math.max(to,land-20);a.td=td;
 let brk=-1;for(let i=td;i>to;i--)if(v[i]>=250){brk=i;break}if(brk<0)for(let i=td;i>to;i--)if(v[i]>=200){brk=i;break}if(brk<0)brk=Math.max(to,td-180);
 a.dw=[brk,td]}
/* Qui est qui : ordre de passage sur le chemin du roulage aller (le premier = 1) */
const rgMed=L=>{const s=L.slice().sort((p,q)=>p-q);return s.length?s[s.length>>1]:NaN};
/* Ordre de passage sur un chemin : on prend l'avion au plus long trajet comme référence et on mesure, pour chaque autre, son retard (en s) sur les mêmes points du chemin */
function rgOrderAlong(R,seg,fb){const ok=R.A.filter(a=>!a.bad),ref=ok.slice().sort((p,q)=>(q.c[q[seg][1]]-q.c[q[seg][0]])-(p.c[p[seg][1]]-p.c[p[seg][0]]))[0];
 const pts=[];let last=-1e9;for(let i=ref[seg][0];i<=ref[seg][1];i++){if(isNaN(ref.x[i]))continue;if(ref.c[i]-last>=40&&ref.c[ref[seg][1]]-ref.c[i]>60){pts.push(i);last=ref.c[i]}}
 const key={};ok.forEach(a=>{const off=[];pts.forEach(i0=>{let b=1e12,bi=-1;for(let i=a[seg][0];i<=a[seg][1];i++){if(isNaN(a.x[i]))continue;const d=(a.x[i]-ref.x[i0])**2+(a.y[i]-ref.y[i0])**2;if(d<b){b=d;bi=i}}if(b<900)off.push(bi-i0)});
  key[a.k]=off.length>=3?rgMed(off):fb(a)-fb(ref)});

/* Avions non suivis (pas de trace GPX). Le nombre d'avions du vol vient de la plaquette (« 8 FUS+100 ») ou du choix du pilote ;
   les numéros manquants sont déduits des écarts au roulage aller : un trou double entre deux avions qui se suivent = un avion absent.
   Les absents restants sont placés en fin de patrouille. Le pilote corrige d'un geste si besoin (qui est qui). */
function rgGhosts(R){const ok=R.A.filter(a=>!a.bad),n=ok.length,N=Math.max(R.nAv||n,n);R.nAv=N;R.ghost=[];R.ordOut.forEach((k,i)=>R.num[k]=i+1);if(N<=n)return;
 const miss=N-n,ord=R.ordOut,off=ord.map(k=>(R.off.out||{})[k]||0),gaps=[];for(let i=1;i<ord.length;i++)gaps.push({i,g:off[i]-off[i-1],x:0});
 const m=rgMed(gaps.map(e=>e.g).filter(g=>g>0))||1;gaps.forEach(e=>{e.x=e.g>1.6*m?Math.min(miss,Math.round(e.g/m)-1):0});

/* Pour chaque paire d'avions qui se suivent : les absents entre les deux (roulage aller : d'après les numéros ; retour et vent arrière :
   d'après un trou anormal dans la file) → l'objectif de distance est multiplié d'autant, et un fantôme est dessiné à mi-chemin. */
function rgGhostPairs(R){const G=R.ghost||[];['out','dw','in'].forEach(key=>{const P=R.P[key];P.forEach(pr=>{pr.gh=[];pr.m=1});if(!G.length||!P.length)return;
 if(key==='out'){P.forEach(pr=>{pr.gh=G.filter(v=>v>R.num[pr.a]&&v<R.num[pr.b]);pr.m=1+pr.gh.length});return}
 const off=key==='in'?(R.off.in||{}):null,gaps=P.map(pr=>key==='in'?(off[pr.b]||0)-(off[pr.a]||0):R.A[pr.b].brk-R.A[pr.a].brk);
 const m=rgMed(gaps.filter(g=>g>0))||1;let left=G.length;P.forEach((pr,i)=>{const g=gaps[i],x=g>1.6*m?Math.min(left,Math.round(g/m)-1):0;left-=x;pr.m=1+x;pr.gh=x?(G.length===1?G.slice():new Array(x).fill('?')):[]})})}
/* Distance du suivant sur le précédent, à chaque seconde : le long du chemin du précédent (virages compris), sinon en ligne droite */
function rgPairs(R,ord,key,tol,back){const P=[];for(let r=1;r<ord.length;r++){const L=R.A[ord[r-1]],F=R.A[ord[r]],lo=Math.max(L[key][0],F[key][0]),hi=Math.min(L[key][1],F[key][1]);
  if(hi<=lo){P.push({a:L.k,b:F.k,lo:0,d:new Float32Array(0)});continue}const d=new Float32Array(hi-lo+1).fill(NaN);
  let pj=-1;   // le point du chemin du précédent ne peut qu'avancer : on ne se raccroche pas à un passage plus ancien au même endroit
  for(let i=lo;i<=hi;i++){if(isNaN(F.x[i])||isNaN(L.x[i]))continue;let b=1e12,bj=-1;if(pj<0){for(let q=i;q>=Math.max(0,i-back);q--){if(isNaN(L.x[q]))continue;const dd=(L.x[q]-F.x[i])**2+(L.y[q]-F.y[i])**2;if(dd<b){b=dd;bj=q}else if(b<tol*tol&&dd>tol*tol)break}}   // premier raccrochage : le passage le plus récent
   else for(let q=Math.max(0,i-back,pj-2);q<=i;q++){if(isNaN(L.x[q]))continue;const dd=(L.x[q]-F.x[i])**2+(L.y[q]-F.y[i])**2;if(dd<=b){b=dd;bj=q}}
   if(bj>=0&&b<tol*tol){pj=bj;d[i-lo]=L.c[i]-L.c[bj]}else d[i-lo]=Math.hypot(L.x[i]-F.x[i],L.y[i]-F.y[i])}

/* Fenêtre de calcul du bilan (min, moyenne par point, max) :
   · roulage aller : du moment où tous les avions roulent (≥ 6 kt) jusqu'à ce que le leader repasse sous 6 kt ;
   · roulage retour : à partir du moment où tous roulent, où le dernier tient au moins 40 % de la vitesse du leader et où chaque écart est sous 150 % de l'objectif, jusqu'à l'arrêt du leader (< 6 kt) ;
   · vent arrière : les deux avions stabilisés entre 120 et 220 kt.
   Dans la fenêtre, un point ne compte que si les deux avions roulent (≥ 3 kt) et l'écart est réel (> 5 m : un 0 est un artefact GPS). */
function rgMask(R,key,tgt){const ord=key==='out'?R.ordOut:key==='dw'?R.ordDw:R.ordIn,A=ord.map(k=>R.A[k]),P=R.P[key];if(!A.length)return;

 const lead=A[0],w=rgSegWin(R,key),allRoll=t=>A.every(a=>a.v[t]>=6&&a.v[t]<40),last=A[A.length-1];let t0=-1,t1=-1;

 if(t0<0){R.win=R.win||{};R.win[key]=null;return}for(let t=t0+1;t<=w[1];t++){if(lead.v[t]<6){t1=t;break}}if(t1<0)t1=w[1];R.win=R.win||{};R.win[key]=[t0,t1];
 P.forEach(pr=>{const L=R.A[pr.a],F=R.A[pr.b];for(let t=t0;t<=t1;t++){const i=t-pr.lo;if(i<0||i>=pr.d.length)continue;pr.ok[i]=L.v[t]>=3&&F.v[t]>=3&&pr.d[i]>5?1:0}})}

function rgSetNum(k,n){const R=RG,old=R.num[k];if(old===n)return;const o=Object.keys(R.num).find(x=>R.num[x]===n),G=new Set(R.ghost||[]);
 if(o!=null)R.num[o]=old;else{G.delete(n);if(G.size||n>(R.nAv||0))G.add(old)}   // n était libre : l'ancien numéro devient fantôme (ou, hors liste, l'avion s'ajoute)
 R.num[k]=n;R.ordOut=Object.keys(R.num).map(Number).sort((a,b)=>R.num[a]-R.num[b]);
 const used=new Set(Object.values(R.num));for(let v=1;v<=(R.nAv||0);v++)if(!used.has(v)&&!G.has(v)&&G.size+used.size<R.nAv)G.add(v);
 R.ghost=[...G].filter(v=>!used.has(v)).sort((a,b)=>a-b);R.nAv=R.ordOut.length+R.ghost.length;R.ghMan=true;rgPairsAll(R);render()}
/* Avions non suivis déclarés d'un geste : le numéro touché devient un fantôme ; les traces gardent leur ordre et sont renumérotées sur les numéros restants */
function rgToggleGhost(n){const R=RG;if(!R)return;const G=new Set(R.ghost||[]);if(G.has(n))G.delete(n);else G.add(n);
 const trk=R.ordOut.slice(),n0=trk.length,free=[];for(let v=1;free.length<n0;v++)if(!G.has(v))free.push(v);trk.forEach((k,i)=>R.num[k]=free[i]);
 R.ghost=[...G].sort((a,b)=>a-b);R.nAv=n0+G.size;R.ghMan=true;rgPairsAll(R);render();toast(G.has(n)?'N°'+n+' non suivi : fantôme à sa place':'N°'+n+' retiré des fantômes')}

function dlDoc(id){const d=(DB.pdocs||[]).find(x=>x.id===id);if(d)dlFile(d)}
async function dlFile(f){if(f&&f.driveId){toast('Téléchargement de '+f.name+'…');let r;try{r=await api('dl',{id:f.driveId})}catch(e){r={error:'Connexion impossible'}}
 if(!r||r.error){toast(r&&r.error||'Téléchargement impossible');return}
 const bin=atob(r.b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u8],{type:r.type||'application/octet-stream'}));a.download=f.name||r.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return}
 const u=FILEB[f.id];if(u){const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();return}toast(f.ex?'Document d\'exemple : pas de fichier à télécharger':'Fichier téléchargeable dans la version en ligne')}
