const FEA_C=[['ann','Mission annulée','#ef4444','#b91c1c','x'],['int','Mission interrompue','#f59e0b','#c2410c','alert'],['rien','Aucune conséquence','#22c55e','#15803d','check']];
function feaNew(){const d=new Date();return {date:iso(d),time:String(d.getHours()).padStart(2,'0')+':'+String(Math.floor(d.getMinutes()/5)*5).padStart(2,'0'),ac:'',cons:'',txt:''}}
function feaIn(){if(!S.fea)S.fea=feaNew();return S.fea}
function feaSet(k,v){feaIn()[k]=v;render()}
function feaMe(){return typeof ME!=='undefined'&&ME?ME:null}
function feaAuthor(){const me=feaMe(),x=me&&memOf(me.mail);if(x)return memLabel(x);if(me&&me.name)return me.name;return (RLm[ROLE]||{}).l||''}
function feaSave(){const f=feaIn();const err=!f.date?'Indiquez la date.':!f.time?'Indiquez l\'heure.':!/^\d{2,3}$/.test(String(f.ac).trim())?'Indiquez le numéro de l\'Alphajet (2 ou 3 chiffres).':!f.cons?'Indiquez la conséquence sur la mission.':!f.txt.trim()?'Décrivez en quelques mots ce qui est arrivé.':'';
 if(err){toast(err);return}
 DB.fea=DB.fea||[];DB.fea.unshift({id:uid(),t:Date.now(),by:feaAuthor(),byMail:(feaMe()||{}).mail||'',date:f.date,time:f.time,ac:String(f.ac).trim(),cons:f.cons,txt:f.txt.trim()});
 mcfg().log.unshift({id:uid(),t:Date.now(),d:todayKey(),type:'fea',to:'Chef ops',txt:'FEA Alphajet n° '+DB.fea[0].ac});save();S.fea=null;S.feaDone=DB.fea[0].id;render();toast('FEA envoyée au chef ops')}

function feaCopy(id){const e=(DB.fea||[]).find(x=>x.id===id);if(!e)return;const t=feaText(e);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('FEA copiée : collez-la dans un SMS ou un email'),()=>{const w=window.open('','_blank');if(w){w.document.write('<pre style="font:15px/1.5 sans-serif;white-space:pre-wrap;padding:20px">'+esc(t)+'</pre>')}})}

/* ====================== Centrage Cirrus SR20 / SR22 ====================== */
/* Modèle : feuilles « Centrage SR20 » et « Centrage SR22 G3-G5 » de l'escadron (masses en lb, moments en lb·in/1000),
   masses à vide et moments : Lutin SR2X édition 2024, §11. Les bras sont ceux des feuilles (par kg ou par USG). */
const CG_T={
 SR20:{l:'SR20',mtow:3050,fuelMax:56,tks:false,arm:{f:0.32,r:0.40,b:0.46,fuel:0.93,tks:1.4},
  env:w=>[(w-132.8)/6.8,(w+23.6)/6.8],wmin:2200},
 G3:{l:'SR22 G3',mtow:3400,fuelMax:92,tks:true,arm:{f:0.32,r:0.40,b:0.46,fuel:0.93,tks:1.4},
  fwd:[[2200,304],[2300,318],[2400,333],[2500,347],[2600,362],[2700,375],[2800,390],[2900,406],[3000,421],[3100,437],[3200,452],[3300,467],[3400,484]],
  env:function(w){return [lerp(this.fwd.map(p=>p[0]),this.fwd.map(p=>p[1]),w),326+(w-2200)*178/1200]},wmin:2200},
 G5:{l:'SR22 G5',mtow:3600,fuelMax:92,tks:true,arm:{f:0.1435*2.205,r:0.18*2.205,b:0.208*2.205,fuel:0.1549*6,tks:0.148*9.2},
  env:w=>[304+(w-2200)*207/1400,326+(w-2200)*207/1400],wmin:2200}};
const CG_FLEET=[
 ['SR20','F-HGDU',2167,304.6],['SR20','F-HKCB',2179,306.6],['SR20','F-HKCD',2184,308.2],['SR20','F-HKCE',2178,308.2],['SR20','F-HKCG',2178,306.2],
 ['SR20','F-HKCH',2177,306.0],['SR20','F-HKCJ',2175,306.0],['SR20','F-HKCK',2178,306.6],['SR20','F-HKCM',2178,306.1],['SR20','F-HKCN',2175,305.5],
 ['SR20','F-HKCP',2175,305.5],['SR20','F-HKCQ',2170,304.0],['SR20','F-HKCT',2172,304.8],['SR20','F-HKCU',2179,306.2],['SR20','F-HKCV',2174,305.0],['SR20','F-HKCX',2172,304.8],
 ['G3','F-HKCA',2336,323.6],['G3','F-HKCF',2317,320.0],['G3','F-HKCI',2344,324.4],['G3','F-HKCL',2323,322.2],['G3','F-HKCO',2328,322.1],
 ['G5','F-GKCI',2400,334.5],['G5','F-HKCC',2420,339.6],['G5','F-HKCY',2444,345.1],['G5','F-HKCZ',2427,340.7]];
const CG_BAGMAX=59,LB=2.205;
function cgIn(){if(!S.cg){let o=null;try{o=JSON.parse(localStorage.getItem(KEY+':cg')||'null')}catch(e){}
 S.cg=Object.assign({type:'SR20',ac:'F-HKCB',ew:2179,em:306.6,fl:85,fr:0,rl:0,rr:0,bag:5,fuel:40,tks:3,burn:15},o||{})}return S.cg}
function cgSet(k,v){const o=cgIn();o[k]=v;
 if(k==='type'){const f=CG_FLEET.find(a=>a[0]===v);if(f){o.ac=f[1];o.ew=f[2];o.em=f[3]}else{o.ac='autre'}o.fuel=Math.min(o.fuel,CG_T[v].fuelMax)}
 if(k==='ac'){const f=CG_FLEET.find(a=>a[1]===v);if(f){o.type=f[0];o.ew=f[2];o.em=f[3]}}
 try{localStorage.setItem(KEY+':cg',JSON.stringify(o))}catch(e){}render()}
function cgCalc(){const o=cgIn(),T=CG_T[o.type]||CG_T.SR20,A=T.arm;
 const kg=k=>Math.max(0,+o[k]||0);const tks=T.tks?Math.max(0,+o.tks||0):0,fuel=Math.max(0,+o.fuel||0),burn=Math.min(fuel,Math.max(0,+o.burn||0));
 const pax=kg('fl')+kg('fr')+kg('rl')+kg('rr')+kg('bag');
 const W=(+o.ew||0)+pax*LB+fuel*6+tks*9.2;
 const M=(+o.em||0)+(kg('fl')+kg('fr'))*A.f+(kg('rl')+kg('rr'))*A.r+kg('bag')*A.b+fuel*A.fuel+tks*A.tks;
 const pt=(w,m)=>{const [mn,mx]=T.env(w);const pct=mx>mn?100*(m-mn)/(mx-mn):0;return {w,m,mn,mx,pct,cg:w?m*1000/w:0,inEnv:m>=mn-1e-9&&m<=mx+1e-9&&w<=T.mtow}};
 const to=pt(W,M),ldg=pt(W-burn*6,M-burn*A.fuel),zfw=pt(W-fuel*6-tks*9.2,M-fuel*A.fuel-tks*A.tks);
 const rest=(T.mtow-W)/LB,fuelMax=Math.max(0,Math.min(T.fuelMax,fuel+(T.mtow-W)/6));
 const al=[];
 if(W>T.mtow)al.push({t:'bad',h:'Masse maximale dépassée',p:`${Math.round(W)} lb pour ${T.mtow} lb autorisées (${Math.round((W-T.mtow)/LB)} kg de trop). Réduire le carburant ou la charge.`});
 if(!to.inEnv&&W<=T.mtow)al.push({t:'bad',h:to.m<to.mn?'Centrage trop avant au décollage':'Centrage trop arrière au décollage',p:'Le point de décollage est hors de l\'enveloppe. Déplacer des masses (bagages, passagers) ou revoir le carburant.'});
 if(to.inEnv&&!ldg.inEnv)al.push({t:'bad',h:'Hors enveloppe à l\'atterrissage',p:'En consommant le carburant prévu, le centrage sort de l\'enveloppe. Revoir la répartition des masses.'});
 if(to.inEnv&&ldg.inEnv&&!zfw.inEnv)al.push({t:'warn',h:'Hors enveloppe réservoirs vides',p:'Avec tout le carburant consommé le centrage sortirait de l\'enveloppe : attention en cas de vol plus long que prévu.'});
 if(kg('bag')>CG_BAGMAX)al.push({t:'bad',h:'Soute bagages : 59 kg maximum',p:`${kg('bag')} kg saisis pour 130 lb (59 kg) autorisés.`});
 if(fuel>T.fuelMax)al.push({t:'warn',h:'Carburant au-dessus du plein complet',p:`Plein complet ${T.fuelMax} USG sur ${T.l}.`});
 if(to.inEnv&&W<=T.mtow&&(to.pct<8||to.pct>92))al.push({t:'warn',h:'Centrage proche d\'une limite',p:`Point de décollage à ${Math.round(to.pct)} % de la plage (0 % = limite avant, 100 % = limite arrière).`});
 if(!al.length)al.push({t:'ok',h:'Dans l\'enveloppe',p:`Décollage, atterrissage estimé et réservoirs vides sont dans les limites. Charge utile restante ≈ ${Math.max(0,Math.round(rest))} kg.`});
 return {T,W,M,to,ldg,zfw,rest,fuelMax,pax,burn,al,ok:al[0].t==='ok'||al.every(a=>a.t!=='bad')}}
function cgSvg(x){const T=x.T,w0=T.wmin-100,w1=T.mtow+150,pts=[];const n=48,CG=(m,w)=>m*1000/w;
 for(let i=0;i<=n;i++){const w=T.wmin+(T.mtow-T.wmin)*i/n;pts.push([CG(T.env(w)[0],w),w])}
 for(let i=n;i>=0;i--){const w=T.wmin+(T.mtow-T.wmin)*i/n;pts.push([CG(T.env(w)[1],w),w])}
 const ms=pts.map(p=>p[0]).concat([x.to.cg,x.ldg.cg,x.zfw.cg]),m0=Math.min(...ms)-1.5,m1=Math.max(...ms)+1.5;
 const Wd=420,Hd=300,L=52,R=14,Tp=14,B=36;const X=m=>L+(m-m0)/(m1-m0)*(Wd-L-R),Y=w=>Tp+(w1-w)/(w1-w0)*(Hd-Tp-B);
 const poly=pts.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
 const gy=[];for(let w=Math.ceil(w0/200)*200;w<=w1;w+=200)gy.push(w);const gx=[];for(let m=Math.ceil(m0);m<=m1;m+=1)gx.push(m);
 const dot=(p,c,lab,r)=>{const left=X(p.cg)>Wd-110;return `<circle cx="${X(p.cg).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="${r}" fill="${c}" stroke="#fff" stroke-width="2"/><text x="${(X(p.cg)+(left?-r-4:r+4)).toFixed(1)}" y="${(Y(p.w)+4).toFixed(1)}" class="cgl" fill="${c}" text-anchor="${left?'end':'start'}">${lab}</text>`};
 const okc=x.to.inEnv&&x.ldg.inEnv&&x.W<=T.mtow?'var(--ok)':'var(--bad)';
 return `<svg class="cgsvg" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Enveloppe de centrage ${T.l}">
  ${gy.map(w=>`<line class="cgg" x1="${L}" x2="${Wd-R}" y1="${Y(w).toFixed(1)}" y2="${Y(w).toFixed(1)}"/><text class="cgt" x="${L-6}" y="${(Y(w)+4).toFixed(1)}" text-anchor="end">${w}</text>`).join('')}
  ${gx.map(m=>`<line class="cgg" y1="${Tp}" y2="${Hd-B}" x1="${X(m).toFixed(1)}" x2="${X(m).toFixed(1)}"/><text class="cgt" y="${Hd-B+14}" x="${X(m).toFixed(1)}" text-anchor="middle">${m}</text>`).join('')}
  <line class="cgmax" x1="${L}" x2="${Wd-R}" y1="${Y(T.mtow).toFixed(1)}" y2="${Y(T.mtow).toFixed(1)}"/><text class="cgt" x="${Wd-R}" y="${(Y(T.mtow)-5).toFixed(1)}" text-anchor="end">Masse max ${T.mtow} lb</text>
  <polygon class="cgenv" points="${poly}" style="--c:${okc}"/>
  <line class="cgline" x1="${X(x.to.cg).toFixed(1)}" y1="${Y(x.to.w).toFixed(1)}" x2="${X(x.zfw.cg).toFixed(1)}" y2="${Y(x.zfw.w).toFixed(1)}"/>
  ${dot(x.zfw,'#64748b','Réservoirs vides',5)}${dot(x.ldg,'#f59e0b','Atterrissage',6)}${dot(x.to,x.to.inEnv&&x.W<=T.mtow?'#16a34a':'#dc2626','Décollage',8)}
  <text class="cgt" x="${(L+(Wd-L-R)/2).toFixed(1)}" y="${Hd-4}" text-anchor="middle">Centrage (pouces en arrière de la référence)</text>
  <text class="cgt" transform="translate(11 ${((Hd-B)/2+Tp).toFixed(1)}) rotate(-90)" text-anchor="middle">Masse (lb)</text></svg>`}
function vCentrage(tabs){const o=cgIn(),x=cgCalc(),T=x.T;
 const num=(k,lab,unit,step,min,max,sub)=>`<label class="pfn"><span>${lab}${sub?` <small class="muted" style="font-weight:600">${sub}</small>`:''}</span><div class="pfin"><button onclick="cgSet('${k}',Math.max(${min},${(+o[k]||0)-step}))" aria-label="Moins">−</button><input class="in" type="number" inputmode="decimal" step="${step}" min="${min}" ${max!=null?`max="${max}"`:''} value="${esc(String(o[k]))}" onchange="cgSet('${k}',this.value===''?0:+this.value)"><button onclick="cgSet('${k}',${(+o[k]||0)+step})" aria-label="Plus">+</button><b>${unit}</b></div></label>`;

 const AL={bad:['#ef4444','#b91c1c','alert'],warn:['#f59e0b','#c2410c','alert'],ok:['#22c55e','#15803d','check'],info:['#64748b','#334155','info']};
 const fleet=CG_FLEET.filter(a=>a[0]===o.type);
 const kgF=w=>Math.round(w/LB);
 return `${NOTE}<div class="head"><div><h1>Centrage Cirrus</h1><p class="muted">SR20 · SR22 G3 · SR22 G5. Masses en kilos, carburant en gallons US : le résultat se met à jour tout seul.</p></div></div>${tabs}
 <div class="pfgrid">

   <h3 style="margin:16px 0 4px">À bord</h3>

function uSave(){
 const d=MF.d,e=$('u-err');
 if(!d.fn){e.textContent='Choisissez une fonction.';return}
 if(!d.first.trim()&&!d.last.trim()){e.textContent='Indiquez au moins un nom ou un prénom.';return}
 if(!String(d.role||'').trim()){e.textContent='Indiquez la fonction de cette personne.';return}
 if(!okTel(d.tel)){e.textContent='Le numéro de téléphone semble incomplet (10 chiffres).';return}
 if(!okMail(d.mail)){e.textContent='L\'adresse email n\'est pas valide.';return}
 const a0=accOf(MF.mail0||d.mail),accR=d.acc===undefined?(a0?a0.role:(U_DEF[d.fn]||'')):d.acc;
 const rec={id:MF.id||uid(),photo:d.photo||'',fn:d.fn,grade:d.grade.trim(),first:d.first.trim(),last:d.last.trim(),role:d.role.trim(),kp:d.kp||'',tel:String(d.tel||'').replace(/[^\d+]/g,''),mail:(d.mail||'').trim(),acc:accR};
 if(rec.kp)DB.members.forEach(y=>{if(y.kp===rec.kp&&y.id!==rec.id)y.kp=''});
 const i=DB.members.findIndex(x=>x.id===rec.id);if(i>=0)DB.members[i]=rec;else DB.members.push(rec);
 if(MF.toMeet&&i<0){const mm=DB.meetings.find(x=>x.id===MF.toMeet);if(mm){const t=team(mm);if(!isDefault(rec)&&!t.add.includes(rec.id))t.add.push(rec.id)}}
 let msg='Membre enregistré';
 if(isChef()){const a=a0;
  if(a&&!accR){msg+=' · son accès reste actif (retirez-le depuis la page Accès si besoin)'}
  else if(a){a.role=accR;a.name=memLabel(rec)||a.name;if(rec.mail&&lc(rec.mail)!==lc(a.mail)){a.mail=rec.mail;a.hold=true;a.renew=Date.now();a.msg=invMsg(a.role,null,a.name);save();closeSheet();render();invQueue();toast('Nouvel email : relisez le message puis envoyez le lien');return}}

 save();closeSheet();render();toast(msg);
}

 if(DB.access.some(a=>a.role===IV.role&&a.mid===IV.mid&&a.mail.toLowerCase()===IV.mail.toLowerCase())){$('iv-err').textContent='Cette personne a déjà cet accès.';return}
 addAccess({id:uid(),role:IV.role,mid:IV.mid,name:IV.name.trim(),mail:IV.mail,msg:IV.msg,hold:false,at:Date.now()});
 if(IV.mid&&(IV.role==='org'||IV.role==='dv')){const m=DB.meetings.find(x=>x.id===IV.mid);m.contacts=m.contacts||[];const c=m.contacts.find(x=>x.fn===IV.role&&(!x.mail||x.mail.toLowerCase()===IV.mail.toLowerCase())&&(!x.mail||true));const [f,...l]=IV.name.trim().split(' ');if(c&&!c.mail){c.mail=IV.mail}else if(!m.contacts.some(x=>x.mail&&x.mail.toLowerCase()===IV.mail.toLowerCase()))m.contacts.push({id:uid(),fn:IV.role,first:f||'',last:l.join(' '),org:'',tel:'',mail:IV.mail})}
 save();closeSheet();render();
 toast('Lien envoyé à '+IV.mail);
}

let sheetFn=null;

function fixSheet(){const sh=$('sheet');if(!sh)return;const ctrls=[...sh.querySelectorAll('input,textarea,select,.yn button,.chips button,.step button,.mchip,.pk,.ocat button,.fdrop,.ghostc,.more')];const any=ctrls.some(x=>!x.disabled);if(ROLE==='visit'||RLm[ROLE].side==='suivi'||!any){sh.querySelectorAll('.sf .btn.pri').forEach(b=>{if(/Je valide|C'est noté|Enregistrer|Remplir/.test(b.textContent)){b.textContent='Fermer';b.onclick=closeSheet;b.className='btn pri'}})}}
function closeSheet(){$('ov').hidden=true;sheetFn=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').hidden)closeSheet()});

$('filein').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f||!PICK)return;
 if(f.size>20*1024*1024){toast('Fichier trop lourd (20 Mo maximum)');PICK=null;return}
 toast('Envoi de '+f.name+'…');
 const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(f)});
 const mid=PICK.mid||PICK.park||null,label=PICK.pdoc?'Dossier pilotes':PICK.park?'Parking':PICK.key==='axe'?'Plan du site':PICK.key==='pb'?'Pilot book':'';
 let up;try{up=await api('upload',{name:f.name,type:f.type,b64,mid,label})}catch(err){up={error:'Connexion impossible'}}
 if(!up||up.error){toast(up&&up.error||'Envoi impossible');PICK=null;return}
 const meta={name:f.name,size:f.size,t:Date.now(),url:up.url,driveId:up.id};
 if(PICK.park){const T=tech(DB.meetings.find(x=>x.id===PICK.park));T.parkFile=meta;if(/^image\//.test(f.type)){try{FILES[PICK.park+'park']=URL.createObjectURL(f)}catch(err){}}else delete FILES[PICK.park+'park'];save();render();toast('Schéma du parking déposé');PICK=null;return}
 if(PICK.pdoc){DB.pdocs.unshift(Object.assign({id:uid(),cat:PICK.pdoc},meta));save();closeSheet();render();toast('Document ajouté au dossier des pilotes');PICK=null;return}
 const m=DB.meetings.find(x=>x.id===PICK.mid),A=aero(m),old=A[PICK.key];
 A[PICK.key]=Object.assign(meta,PICK.key==='pb'?{draft:old?!!old.draft:true}:{});
 if(/^image\//.test(f.type)){try{FILES[m.id+PICK.key]=URL.createObjectURL(f)}catch(err){}}else delete FILES[m.id+PICK.key];
 save();render();toast((PICK.key==='axe'?'Axe':'Pilot book')+' déposé');PICK=null;
});
/* ---- Application installable sur téléphone (PWA) ---- */
let INSTALL=null;
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;instBar()});
window.addEventListener('appinstalled',()=>{const b=$('instbar');if(b)b.remove();toast('PAF OPS est installé sur votre écran d\'accueil')});
function instBar(){
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 let off=false;try{off=!!localStorage.getItem('pafops:inst')}catch(e){}
 if(standalone||off||innerWidth>900||$('instbar'))return;
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.MSStream;
 const how=INSTALL?'':ios?'Touchez <b>Partager</b> (le carré avec la flèche) puis <b>« Sur l\'écran d\'accueil »</b>.':'Ouvrez le menu du navigateur (⋮) puis <b>« Ajouter à l\'écran d\'accueil »</b> ou <b>« Installer l\'application »</b>.';
 const d=document.createElement('div');d.id='instbar';d.className='instbar';
 d.innerHTML=`<img src="./icon-192.png" alt="" width="40" height="40"><div><b>Garder PAF OPS sur le téléphone</b><span>${how||'Un raccourci sur l\'écran d\'accueil, comme une application.'}</span></div>${INSTALL?`<button class="btn pri" onclick="INSTALL.prompt()">Installer</button>`:''}<button class="ib" aria-label="Fermer" onclick="try{localStorage.setItem('pafops:inst','1')}catch(e){};this.parentNode.remove()">${ic('x',16)}</button>`;
 document.querySelector('header.top').after(d)}
window.addEventListener('load',()=>setTimeout(instBar,1500));
boot();
</script>
