      @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap');
      .app { font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif; background: #F4EEE2; color: #1F3A4A; min-height: 100vh; }
      .num { font-family: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', 'Barlow', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
      .muted { color: #6B6A5F; }
      .ok { color: #2E8B57; }
      .bad { color: #C23E26; }
      .capitalize { text-transform: capitalize; }
      .card { background: #FFFFFF; border-radius: 20px; }
      .tile { background: #FFFFFF; border-radius: 18px; text-align: left; width: 100%; padding: 14px; }
      .tile:hover { box-shadow: 0 0 0 2px #D8CEB9; }
      .tile:active { transform: scale(0.98); }
      .field { background: #FFFFFF; border: 1.5px solid #D8CEB9; border-radius: 12px; padding: 10px 12px; font-size: 17px; color: #1F3A4A; width: 100%; }
      .field:focus { outline: none; border-color: #1F3A4A; box-shadow: 0 0 0 3px #F2C230; }
      .pill { white-space: nowrap; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 15px; border: 1.5px solid #D8CEB9; background: #FFFFFF; }
      .pill[aria-pressed="true"] { background: #1F3A4A; border-color: #1F3A4A; color: #FFFFFF; }
      .big-btn { border-radius: 14px; padding: 12px 4px; font-weight: 700; font-size: 14px; border: 2px solid #E3DAC7; background: #FFFFFF; }
      .primary { background: #1F3A4A; color: #FFFFFF; border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
      .primary:hover { background: #2E5368; }
      .ghost { border: 1.5px solid #D8CEB9; background: #FFFFFF; border-radius: 12px; padding: 10px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
      .ghost:hover { background: #F1EADB; }
      .icon-btn { border: 1.5px solid #D8CEB9; background: #FFFFFF; border-radius: 999px; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; }
      .icon-btn:hover { background: #F1EADB; }
      .danger { background: #C23E26; color: #FFFFFF; border-radius: 12px; padding: 10px 14px; font-weight: 700; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, [role="button"]:focus-visible { outline: 3px solid #F2C230; outline-offset: 2px; }

      /* Mise en page */
      .shell { max-width: 1360px; margin: 0 auto; padding: 24px 16px 64px; }
      .shell > * + * { margin-top: 20px; }
      .topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
      .main-toggle { width: 100%; }
      .budget-layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
      .tiles { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .plan-layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
      .plan-side, .plan-main, .side-col { min-width: 0; }
      .plan-side > * + * { margin-top: 16px; }
      .plan-main > * + * { margin-top: 16px; }
      @media (min-width: 700px) {
        .shell { padding: 32px 28px 64px; }
        .main-toggle { width: 450px; }
        .tiles { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      }
      @media (min-width: 1000px) {
        .budget-layout { grid-template-columns: 390px minmax(0, 1fr); align-items: start; }
        .side-col { position: sticky; top: 20px; }
        .plan-layout { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
        .plan-side { position: sticky; top: 20px; }
      }

      /* Jauge budget */
      .gauge { position: relative; height: 44px; border-radius: 12px; background: #E9E1D0; overflow: hidden; display: flex; }
      .seg { height: 100%; transition: width 500ms ease; }
      .seg-paid { background: #2E8B57; }
      .seg-signed { background: #2F6FB0; }
      .seg-quotes { background: repeating-linear-gradient(135deg, #8C9AA1 0 6px, #B3BEC3 6px 12px); }
      .seg-tools { background: #7A5BA6; }
      .seg-reserve { background: repeating-linear-gradient(135deg, #F2C230 0 6px, #F7D97A 6px 12px); }
      .overflow { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(194,62,38,0.35); border-left: 3px solid #C23E26; }
      .marker { position: absolute; top: -6px; bottom: -6px; width: 3px; background: #1F3A4A; border-radius: 2px; }
      .swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; display: inline-block; }

      /* Panneau latéral / feuille du bas */
      .sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
      .backdrop { background: rgba(30,43,51,0.5); }
      .sheet { background: #F8F3E9; border-radius: 24px 24px 0 0; width: 100%; max-width: 560px; max-height: 92vh; display: flex; flex-direction: column; animation: up 260ms ease-out; }
      .sheet-body { overflow-y: auto; }
      @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes side { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
      @media (min-width: 900px) {
        .sheet-wrap { align-items: stretch; justify-content: flex-end; }
        .sheet { max-width: 520px; max-height: none; height: 100%; border-radius: 24px 0 0 24px; animation: side 240ms ease-out; }
      }

      .seg-toggle { background: #DDE1DF; border-radius: 16px; padding: 4px; gap: 4px; display: grid; }
      .seg-toggle button { border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 16px; color: #44525A; white-space: nowrap; }
      .seg-toggle button[aria-pressed="true"] { background: #1F3A4A; color: #FFFFFF; }

      /* Calendrier */
      .plan-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
      .view-switch { grid-template-columns: repeat(4, auto); }
      .view-switch button { font-size: 14px; padding: 8px 14px; }
      .cal { overflow: hidden; }
      .cal-head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid #E9E1D0; }
      .cal-head div { padding: 10px 8px; font-size: 13px; font-weight: 700; color: #6B6A5F; text-transform: capitalize; }
      .cal-week { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid #E9E1D0; }
      .cal-week:last-child { border-bottom: 0; }
      .cal-day { border-right: 1px solid #E9E1D0; padding: 4px 5px; position: relative; cursor: pointer; }
      .cal-day:nth-child(7) { border-right: 0; }
      .cal-day:hover { background: #F4F7F5; }
      .cal-day.wkend { background: #FAFBFA; }
      .cal-day.out .cal-num { color: #A3AEB3; }
      .cal-num { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; border-radius: 999px; font-size: 13px; font-weight: 700; padding: 0 6px; white-space: nowrap; }
      .cal-num:hover { background: #E9E1D0; }
      .cal-num.today { background: #C23E26; color: #FFFFFF; }
      .cal-more { position: absolute; left: 7px; bottom: 3px; font-size: 11px; font-weight: 700; color: #6B6A5F; }
      .cal-ev { position: absolute; z-index: 2; text-align: left; padding: 0 7px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
      .cal-ev:hover { filter: brightness(0.95); box-shadow: 0 1px 4px rgba(30,43,51,0.25); }

      .week-grid { display: grid; gap: 8px; grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .week-col { padding: 10px; min-height: 460px; display: flex; flex-direction: column; }
      .week-col.is-today { box-shadow: inset 0 4px 0 #C23E26; }
      .week-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; text-transform: capitalize; }
      .week-num { font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; font-size: 26px; font-weight: 700; min-width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; }
      .week-num.today { background: #C23E26; color: #FFFFFF; }
      .week-body { display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .week-ev { text-align: left; border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.3; }
      .week-ev:hover { filter: brightness(0.95); }
      .week-add { margin-top: auto; border: 1.5px dashed #D8CEB9; border-radius: 10px; padding: 6px; font-size: 13px; color: #6B6A5F; display: flex; align-items: center; justify-content: center; gap: 4px; }
      .week-add:hover { background: #F1EADB; }
      @media (max-width: 760px) {
        .week-grid { grid-template-columns: minmax(0, 1fr); }
        .week-col { min-height: 0; }
        .week-add { margin-top: 6px; }
        .view-switch { grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
        .view-switch button { padding: 8px 4px; }
      }

      .mini { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
      .mini-h { font-size: 11px; font-weight: 700; color: #6B6A5F; padding: 4px 0; }
      .mini-d { position: relative; height: 32px; border-radius: 999px; font-size: 13px; font-weight: 600; }
      .mini-d:hover { background: #E9E1D0; }
      .mini-d.out { color: #A3AEB3; }
      .mini-d.sel { box-shadow: inset 0 0 0 2px #1F3A4A; }
      .mini-d.today { background: #C23E26; color: #FFFFFF; }
      .mini-dot { position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; border-radius: 999px; transform: translateX(-50%); }

      .lot-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .lot-choice { display: flex; align-items: center; gap: 8px; border: 2px solid #E3DAC7; border-radius: 12px; padding: 8px 10px; background: #FFFFFF; text-align: left; }
      .legend-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 4px; border-radius: 10px; text-align: left; }
      .legend-row:hover { background: #F1EADB; }
      .color-dot { width: 30px; height: 30px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; }

      /* Vue chantier (Gantt) */
      .gantt-scroll { overflow-x: auto; border: 1px solid #E9E1D0; border-radius: 14px; -webkit-overflow-scrolling: touch; }
      .sticky-cell { position: sticky; left: 0; z-index: 4; background: #FFFFFF; flex-shrink: 0; border-right: 1px solid #E9E1D0; }
      .head-cell { background: #F1EADB; }
      .row-label { display: flex; align-items: center; gap: 6px; padding: 0 10px; text-align: left; height: 100%; }
      .gantt-row { position: relative; border-top: 1px solid #EEF0EF; }
      .month-label { top: 0; height: 26px; line-height: 26px; padding-left: 6px; font-weight: 700; font-size: 13px; text-transform: capitalize; border-left: 2px solid #1F3A4A; white-space: nowrap; background: #F1EADB; }
      .month-sticky { position: sticky; display: inline-block; }
      .day-label { top: 0; height: 22px; line-height: 22px; font-size: 11px; color: #6B6A5F; padding-left: 2px; background: #F1EADB; }
      .day-label.is-today { background: #C23E26; color: #FFFFFF; font-weight: 700; border-radius: 6px; }
      .weekend { background: #F1F2F1; }
      .month-line { width: 2px; background: #E3DAC7; }
      .today-line { width: 2px; background: #C23E26; z-index: 3; }
      .gbar { position: absolute; top: 10px; height: 30px; border-radius: 8px; font-size: 12px; font-weight: 700; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; z-index: 2; }
      .gbar.live { outline: 3px solid #F2C230; outline-offset: 1px; }
      .diamond { width: 14px; height: 14px; background: #1F3A4A; transform: rotate(45deg); flex-shrink: 0; border-radius: 2px; }
      .ms-label { font-size: 12px; font-weight: 700; margin-left: 6px; white-space: nowrap; background: rgba(255,255,255,0.9); padding: 0 4px; border-radius: 4px; }
      .date-block { width: 54px; flex-shrink: 0; border-left: 5px solid; padding-left: 8px; display: flex; flex-direction: column; }
      .badge { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; background: #E9E1D0; white-space: nowrap; }
      .live-row { display: flex; gap: 10px; align-items: center; background: #FDF3D0; border-radius: 12px; padding: 10px 12px; }

      @media (prefers-reduced-motion: reduce) {
        .sheet { animation: none; } .seg { transition: none; } .tile:active { transform: none; }
      }

      .nc-recap{position:fixed;inset:0;z-index:60;background:#EDEAE2;overflow:auto;color:#1c2630;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .nc-recap .page{max-width:900px;margin:0 auto;padding:16px 16px 60px}
      .nc-recap .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
      .rc-sheet{background:#fff;padding:36px 40px;box-shadow:0 1px 8px rgba(0,0,0,.12);font-size:14px;line-height:1.4}
      .rc-sheet h1{font-size:24px;font-weight:700;letter-spacing:.01em}
      .rc-sheet h2{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid #1c2630}
      .rc-meta{color:#4a5662;margin-top:4px}
      .rc-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:18px;border:1px solid #1c2630}
      .rc-kpis div{padding:10px 12px;border-left:1px solid #c9ccd0}
      .rc-kpis div:first-child{border-left:0}
      .rc-kpis small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#4a5662}
      .rc-kpis b{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
      .rc-sheet table{width:100%;border-collapse:collapse}
      .rc-sheet th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#4a5662;text-align:left;font-weight:600;padding:5px 8px;border-bottom:1px solid #1c2630}
      .rc-sheet td{padding:6px 8px;border-bottom:1px solid #e1e3e6;vertical-align:top}
      .rc-sheet .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
      .rc-sheet tr.head td{background:#F1F2F4;font-weight:700;border-top:1px solid #9aa1a8}
      .rc-sheet tr.sub td{color:#333;padding-left:22px}
      .rc-sheet tr.sub td+td,.rc-sheet tr.sub td.r{padding-left:8px}
      .rc-sheet tr.tot td{font-weight:700;border-top:2px solid #1c2630;border-bottom:0}
      .rc-ok{color:#1d6b3f;font-weight:600}
      .rc-ko{color:#b3321b;font-weight:700}
      .rc-link{display:block;background:none;border:0;padding:0;margin:0;font:inherit;font-size:12.5px;color:#1f5a8a;text-decoration:underline;text-align:left;cursor:pointer}
      .rc-todo{border:1px solid #b3321b;background:#fdf1ee;padding:10px 12px;margin-top:18px}
      .rc-todo b{color:#b3321b}
      .rc-ph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
      .rc-ph figure{margin:0;border:1px solid #c9ccd0;break-inside:avoid}
      .rc-ph figcaption{font-size:12px;padding:5px 8px;border-top:1px solid #e1e3e6;color:#4a5662}
      .rc-fig{cursor:pointer;transition:box-shadow .12s}
      .rc-fig:hover,.rc-fig:focus-visible{box-shadow:0 0 0 2px #1f5a8a;outline:none}
      .rc-kind{display:block;font-weight:700;color:#1c2630;margin-bottom:2px}
      .rc-fig .rc-link{overflow-wrap:anywhere}
      .rc-file-i{display:inline-flex;align-items:center;justify-content:center;width:54px;height:66px;border-radius:6px;background:#f4ece9;color:#b3321b;font-weight:800;font-size:15px;border:1.5px solid #e6cfc8}
      .rc-file{height:110px;display:flex;align-items:center;justify-content:center;color:#4a5662;font-size:13px}
      .rc-note{color:#6b7480;font-size:12px;margin-top:24px}
      .rc-scroll{overflow-x:auto}
      @media (max-width:700px){.rc-sheet{padding:20px 14px}.rc-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.rc-kpis div{border-top:1px solid #c9ccd0}.rc-ph{grid-template-columns:repeat(2,minmax(0,1fr))}.rc-scroll table{min-width:600px}}
      @media print{
        .shell,.sheet-wrap,.nc-noprint,.nc-nav{display:none!important}
        .app{background:#fff!important;min-height:0!important}
        html,body{background:#fff!important}
        .nc-recap{position:static!important;overflow:visible!important;background:#fff}
        .nc-recap .page{padding:0;max-width:none}
        .rc-sheet{box-shadow:none;padding:0}
        .rc-sheet tr{break-inside:avoid}

.nc-act .nc-tip{position:absolute;top:calc(100% + 12px);left:50%;width:250px;transform:translate(-50%,-4px);background:#FFFDF8;color:#1F3A4A;border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.38;font-weight:500;text-align:left;letter-spacing:0;box-shadow:0 12px 30px rgba(31,58,74,.30);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s;z-index:60}

.nc-act .nc-tip::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;width:12px;height:12px;background:#FFFDF8;transform:rotate(45deg);border-radius:2px}
.nc-act:nth-child(-n+2) .nc-tip{left:0;transform:translate(0,-4px)}

.nc-act:nth-child(-n+2):hover .nc-tip,.nc-act:nth-child(n+5):hover .nc-tip{transform:none}}
.nc-act:focus-visible .nc-tip{opacity:1;visibility:visible;transform:translate(-50%,0)}
.nc-act:nth-child(-n+2):focus-visible .nc-tip,.nc-act:nth-child(n+5):focus-visible .nc-tip{transform:none}
