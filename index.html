 const head=(q,sub)=>`<div class="sh"><div class="t"><div class="tiny muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.1em">${W.id?'Modifier':'Nouveau meeting'} · étape ${W.step} sur ${NS}</div>${st}<div class="q">${q}</div><div class="small muted">${sub}</div></div><button class="ib" onclick="closeSheet()" aria-label="Fermer">${ic('x',18)}</button></div>`;
 if(W.step===1)return head('Où a lieu le meeting ?','Ville et terrain : c\'est tout pour cette étape.')+`<div class="sb">
  <label class="l" for="w-city">Ville ou lieu</label><input class="in" id="w-city" value="${esc(W.city)}" placeholder="Ex. : Morlaix" oninput="W.city=this.value;wBtn()" onkeydown="if(event.key==='Enter'&&W.city.trim())wNext()">
  <label class="l" for="w-field">Terrain <span style="font-weight:500">(facultatif)</span></label><input class="in" id="w-field" value="${esc(W.field)}" placeholder="Ex. : Aérodrome de Morlaix-Ploujean" oninput="W.field=this.value">
  <label class="l" for="w-event">Nom de l'événement <span style="font-weight:500">(facultatif)</span></label><input class="in" id="w-event" value="${esc(W.event)}" placeholder="Sinon : « Meeting de ${esc(W.city||'…')} »" oninput="W.event=this.value"></div>
  <div class="sf"><span></span><button class="btn pri big" id="w-next" onclick="wNext()" ${W.city.trim()?'':'disabled'}>Suivant ${ic('back',16).replace('<svg','<svg style="transform:rotate(180deg)"')}</button></div>`;
 if(W.step===2)return head('Quand ?','La date de démonstration suffit : l\'entraînement est proposé la veille.')+`<div class="sb">
  <label class="l">Démonstration(s)</label>
  ${W.demos.map((d,i)=>`<div class="drow"><input class="in" type="date" id="w-demo-${i}" min="${iso(today)}" value="${esc(d)}" onchange="wDemo(${i},this.value)">${W.demos.length>1?`<button class="ib" onclick="W.demos.splice(${i},1);rs()" aria-label="Retirer cette date">${ic('x',16)}</button>`:''}</div>`).join('')}
  <button class="btn ghost" onclick="W.demos.push('');rs()">${ic('plus',16)} Ajouter un jour de démonstration</button>
  <label class="l">Entraînement(s)</label>
  ${W.entrs.map((d,i)=>`<div class="drow"><input class="in" type="date" id="w-entr-${i}" min="${iso(today)}" value="${esc(d)}" onchange="wEntr(${i},this.value)">${W.entrs.length>1?`<button class="ib" onclick="W.entrs.splice(${i},1);rs()" aria-label="Retirer cette date">${ic('x',16)}</button>`:''}</div>`).join('')}
  <button class="btn ghost" onclick="W.entrs.push('');rs()">${ic('plus',16)} Ajouter un jour d'entraînement</button>
  <div class="hint ${W.entrs.some(e=>e&&W.demos.some(d=>d&&d<e))?'bad':''}">${W.entrs.some(e=>e&&W.demos.some(d=>d&&d<e))?'Un entraînement est après une démonstration : vérifiez les dates.':'Créneau de référence : 60 min d\'entraînement, 35 min de démonstration.'}</div></div>
  <div class="sf"><button class="btn" onclick="W.step=1;rs()">${ic('back',16)} Retour</button><button class="btn pri big" id="w-next" onclick="wNext()" ${W.demos.some(Boolean)?'':'disabled'}>Suivant</button></div>`;
 if(W.step===3&&!W.id){const pl=(k,lab,ic0)=>`<div class="fd" style="margin-bottom:12px"><b>${tile(FCm[k==='orgs'?'org':'dv'],'xs')} ${lab}</b>
   ${W[k].map((p,i)=>`<div class="pers"><input class="in" value="${esc(p.first)}" placeholder="Prénom" aria-label="Prénom" oninput="W.${k}[${i}].first=this.value;wBtn()"><input class="in" value="${esc(p.last)}" placeholder="Nom" aria-label="Nom" oninput="W.${k}[${i}].last=this.value;wBtn()"><input class="in" type="email" inputmode="email" value="${esc(p.mail)}" placeholder="Email (facultatif)" aria-label="Email" oninput="W.${k}[${i}].mail=this.value.trim();wBtn()">${W[k].length>1?`<button class="ib" onclick="W.${k}.splice(${i},1);rs()" aria-label="Retirer">${ic('x',15)}</button>`:'<span></span>'}</div>`).join('')}
   <button class="more" style="margin-top:8px" onclick="W.${k}.push({first:'',last:'',mail:'',tel:''});rs()">${ic('plus',14)} Ajouter une personne</button></div>`;
  return head('Qui organise ?','Facultatif : vous pourrez inviter ou corriger plus tard, depuis la page du meeting.')+`<div class="sb">${pl('orgs','Organisation du meeting')}${pl('dvs','Directeur(s) des vols')}<div id="w-err" class="hint bad"></div></div>
  <div class="sf"><button class="btn" onclick="W.step=2;rs()">${ic('back',16)} Retour</button><button class="btn pri big" id="w-next" onclick="wNext()" ${wPeopleOk()?'':'disabled'}>Suivant</button></div>`}
 const demos=W.demos.filter(Boolean).sort();
 const ppl=W.id?[]:[...W.orgs.map(p=>['org',p]),...W.dvs.map(p=>['dv',p])].filter(([,p])=>p.first||p.last);
 return head('C\'est bon ?','Vérifiez puis validez.')+`<div class="sb"><div class="recap">
  <div>${tile(FC[0],'sm')}<span><b>${esc(W.event||'Meeting de '+W.city)}</b><br><span class="small muted">${esc(W.city)}${W.field?' · '+esc(W.field):''}</span></span></div>
  ${W.entrs.filter(Boolean).sort().map(d=>`<div>${tile(FU[1],'sm')}<span>Entraînement : <b>${fmtL(d)}</b></span></div>`).join('')}
  ${demos.map(d=>`<div>${tile({i:'star',c1:'#f5c24a',c2:'#c8961e'},'sm')}<span>Démonstration : <b>${fmtL(d)}</b></span></div>`).join('')}
  ${ppl.map(([k,p])=>`<div>${tile(FCm[k],'sm')}<span>${k==='org'?'Organisation':'Directeur des vols'} : <b>${esc([p.first,p.last].filter(Boolean).join(' '))}</b><br><span class="small muted">${p.mail?ic('send',12)+' invitation à '+esc(p.mail):'pas encore d\'email : invitation plus tard'}</span></span></div>`).join('')}
 </div>${W.id?'':'<p class="small muted">Vous relirez le message d\'invitation avant chaque envoi. Les personnes sans email pourront être invitées plus tard depuis la page du meeting.</p>'}</div>
 <div class="sf"><button class="btn" onclick="W.step=${W.id?2:3};rs()">${ic('back',16)} Retour</button><button class="btn pri big" onclick="wSave()">${ic('check',18)} ${W.id?'Enregistrer':'Créer le meeting'}</button></div>`;
}
function rs(){$('sheet').innerHTML=wHTML()}
const wPeopleOk=()=>[W.orgs,W.dvs].every(L=>L.every(p=>!p.mail||okMail(p.mail)));
function wBtn(){const b=$('w-next');if(b)b.disabled=W.step===1?!W.city.trim():W.step===2?!W.demos.some(Boolean):!wPeopleOk()}
function wDemo(i,v){if(v&&v<iso(today)){toast('Choisissez une date à partir d\'aujourd\'hui');rs();return}W.demos[i]=v;if(v&&!W.entrs.some(Boolean)){const d=fromISO(v);d.setDate(d.getDate()-1);if(d>=today)W.entrs[0]=iso(d)}rs()}
function wEntr(i,v){if(v&&v<iso(today)){toast('Choisissez une date à partir d\'aujourd\'hui');rs();return}W.entrs[i]=v;rs()}
function wNext(){if(W.step===1&&!W.city.trim())return;if(W.step===2&&!W.demos.some(Boolean))return;if(W.step===3&&!W.id&&!wPeopleOk())return;W.step+=(W.step===2&&W.id)?1:1;rs();if(W.step===2)setTimeout(()=>{const i=$('w-demo-0');if(i)i.focus()},60)}
function wSave(){
 const data={city:W.city.trim(),field:W.field.trim(),event:W.event.trim(),entrs:W.entrs.filter(Boolean).sort(),entr:W.entrs.filter(Boolean).sort()[0]||'',demos:W.demos.filter(Boolean).sort()};
 if(W.id){Object.assign(DB.meetings.find(x=>x.id===W.id),data);save();closeSheet();render();toast('Lieu et dates enregistrés')}
 else{const m=Object.assign({id:uid(),contacts:[]},data);let n=0;
  [['org',W.orgs],['dv',W.dvs]].forEach(([fn,L])=>L.filter(p=>p.first||p.last||p.mail).forEach(p=>{m.contacts.push({id:uid(),fn,first:(p.first||'').trim(),last:(p.last||'').trim(),org:'',tel:'',mail:p.mail||''});if(p.mail){addAccess({id:uid(),role:fn,mid:m.id,name:[p.first,p.last].filter(Boolean).join(' ').trim(),mail:p.mail});n++}}));
  m.invAt=Date.now();DB.meetings.push(m);DB.access.filter(a=>a.mid===m.id&&a.hold).forEach(a=>a.msg=invMsg(a.role,m.id,a.name));save();S.rub=null;go('meeting',m.id);toast('Meeting créé');if(n)setTimeout(()=>invQueue(m.id),300)}
}

/* ====================== Fiche contact (choisir la fonction, puis 4 champs) ====================== */
let CF=null;
function contactSheet(mid,cid,fn){
 const m=DB.meetings.find(x=>x.id===mid),c=cid?(m.contacts||[]).find(x=>x.id===cid):null;
 CF={mid,cid,step:c||fn?2:1,d:c?{...c}:{fn:fn||'',first:'',last:'',org:'',tel:'',mail:''},del:false};
 openSheet(cHTML);focusFirst();
}
function cHTML(){
 if(CF.step===1)return `<div class="sh"><div class="t"><div class="q">Qui ajoutez-vous ?</div><div class="small muted">Choisissez sa fonction.</div></div><button class="ib" onclick="closeSheet()" aria-label="Fermer">${ic('x',18)}</button></div>
  <div class="sb"><div class="pick">${FC.map(f=>`<button class="pk" onclick="CF.d.fn='${f.k}';CF.step=2;$('sheet').innerHTML=cHTML();focusFirst()">${tile(f,'sm')}<span>${f.l}</span></button>`).join('')}</div></div><div class="sf"></div>`;
 const f=FCm[CF.d.fn]||FCm.autre,d=CF.d;
 const errT=!okTel(d.tel),errM=!okMail(d.mail);
 return `<div class="sh">${tile(f,'lg')}<div class="t"><div class="tiny muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.1em">${CF.cid?'Modifier':'Nouveau contact'}</div><div class="q" style="margin-top:2px">${f.l}</div>${CF.cid?'':`<button class="btn ghost" style="padding:4px 0" onclick="CF.step=1;$('sheet').innerHTML=cHTML()">Changer de fonction</button>`}</div><button class="ib" onclick="closeSheet()" aria-label="Fermer">${ic('x',18)}</button></div>
 <div class="sb">
  <div class="two"><div><label class="l" for="c-first">Prénom</label><input class="in" id="c-first" value="${esc(d.first)}" oninput="CF.d.first=this.value" autocomplete="off"></div><div><label class="l" for="c-last">Nom</label><input class="in" id="c-last" value="${esc(d.last)}" oninput="CF.d.last=this.value" autocomplete="off"></div></div>
  <label class="l" for="c-tel">Téléphone</label><input class="in ${errT?'err':''}" id="c-tel" type="tel" inputmode="tel" value="${esc(fmtTel(d.tel))}" placeholder="06 12 34 56 78" oninput="CF.d.tel=this.value" onblur="this.value=fmtTel(this.value);this.classList.toggle('err',!okTel(this.value))">
  <label class="l" for="c-mail">Email</label><input class="in ${errM?'err':''}" id="c-mail" type="email" inputmode="email" value="${esc(d.mail)}" placeholder="prenom.nom@exemple.fr" oninput="CF.d.mail=this.value.trim()" onblur="this.classList.toggle('err',!okMail(this.value.trim()))">
  ${f.org?`<label class="l" for="c-org">${f.k==='org'?'Structure (mairie, entreprise, association…)':'Structure'} <span style="font-weight:500">(facultatif)</span></label><input class="in" id="c-org" value="${esc(d.org)}" placeholder="${f.k==='org'?'Ex. : Mairie de Morlaix':f.k==='hotel'?'Ex. : Hôtel du Port':''}" oninput="CF.d.org=this.value">`:''}
  <div id="c-err" class="hint bad"></div>
  ${CF.del?`<div class="confirm"><span><b>Supprimer ce contact ?</b></span><span style="display:flex;gap:8px"><button class="btn" onclick="CF.del=false;$('sheet').innerHTML=cHTML()">Annuler</button><button class="btn danger" onclick="cDel()">${ic('trash',16)} Supprimer</button></span></div>`:''}
 </div>
 <div class="sf">${CF.cid?`<button class="btn danger" onclick="CF.del=true;$('sheet').innerHTML=cHTML()">${ic('trash',16)} Supprimer</button>`:'<span></span>'}<button class="btn pri big" onclick="cSave()">${ic('check',18)} Enregistrer</button></div>`;
}
function focusFirst(){setTimeout(()=>{const i=$('c-first');if(i)i.focus()},60)}
function cSave(){
 const d=CF.d;
 if(!d.first.trim()&&!d.last.trim()){$('c-err').textContent='Indiquez au moins un nom ou un prénom.';return}
 if(!okTel(d.tel)){$('c-err').textContent='Le numéro de téléphone semble incomplet (10 chiffres).';return}
 if(!okMail(d.mail)){$('c-err').textContent='L\'adresse email n\'est pas valide.';return}
 const m=DB.meetings.find(x=>x.id===CF.mid);m.contacts=m.contacts||[];
 const rec={id:CF.cid||uid(),fn:d.fn,first:d.first.trim(),last:d.last.trim(),org:(d.org||'').trim(),tel:String(d.tel||'').replace(/[^\d+]/g,''),mail:(d.mail||'').trim()};
 const i=m.contacts.findIndex(x=>x.id===rec.id);if(i>=0)m.contacts[i]=rec;else m.contacts.push(rec);
 save();closeSheet();render();toast('Contact enregistré');
}
function cDel(){const m=DB.meetings.find(x=>x.id===CF.mid);m.contacts=m.contacts.filter(x=>x.id!==CF.cid);save();closeSheet();render();toast('Contact supprimé')}

/* ====================== Vue : annuaire de l'unité ====================== */
/* Ordre dans l'Unité : ordre fixé à la main, sinon n° Athos (15 directeur, 16 adjoint, 17 chef ops ; pilotes 1 à 9), puis grade, puis nom */
const gRank=g=>{const i=GRADES.indexOf(g);return i<0?99:i};
const ATH_L={DIR:'Athos',PILOTES:'Athos',PISTE:'Mecathos'};   // numéro seulement pour la direction, les pilotes et la piste
const athN=x=>{if(!ATH_L[x.fn])return 1e6;const n=parseInt(x.athos,10);return isNaN(n)?1e6:n};
const mSort=(a,b)=>((a.ord??1e6)-(b.ord??1e6))||((DFN_RANK[a.dfn]??9)-(DFN_RANK[b.dfn]??9))||(athN(a)-athN(b))||(gRank(a.grade)-gRank(b.grade))||String(a.last||'').localeCompare(String(b.last||''));
const ATHOS_F={15:'Directeur',16:'Directeur adjoint',17:'Chef des opérations',18:'Pilote réserviste'};
const NICK_FN={DIR:1,PILOTES:1};
function subs(fn){DB.subcats=DB.subcats||{};return DB.subcats[fn]=DB.subcats[fn]||[]}
function subAdd(fn){const l=prompt('Nom de la sous-catégorie ('+fn+') :');if(!l||!l.trim())return;subs(fn).push({id:uid(),l:l.trim()});S.reorder=fn;save();render()}
function subRen(fn,id){const s0=subs(fn).find(x=>x.id===id);const l=prompt('Nouveau nom :',s0.l);if(!l||!l.trim())return;s0.l=l.trim();save();render()}
function subDel(fn,id){const s0=subs(fn).find(x=>x.id===id);if(!confirm('Supprimer la sous-catégorie « '+s0.l+' » ? Ses membres restent dans '+fn+'.'))return;DB.subcats[fn]=subs(fn).filter(x=>x.id!==id);DB.members.forEach(x=>{if(x.sub===id)delete x.sub});save();render()}
function subMove(fn,id,d){const L=subs(fn),i=L.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render()}
function memMove(id,d){const x=DB.members.find(y=>y.id===id);const L=DB.members.filter(y=>y.fn===x.fn&&(y.sub||'')===(x.sub||'')).sort(mSort);const i=L.indexOf(x),j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];L.forEach((y,k)=>y.ord=k);save();render()}
function memAuto(fn){DB.members.filter(y=>y.fn===fn).forEach(y=>delete y.ord);save();render();toast('Ordre automatique rétabli (n° Athos, grade, nom)')}
function grpHTML(f,L,q){const ed=canEdit('annu'),ro=S.reorder===f.k&&ed,SC=subs(f.k);
 const rows=list=>list.length?`<div class="mlist">${list.map((x,i)=>mRow(x,ro?{up:i>0,down:i<list.length-1}:null)).join('')}</div>`:'';
 const lead=L.filter(x=>DFN_RANK[x.dfn]!=null).sort(mSort),inLead=x=>DFN_RANK[x.dfn]!=null;
 const free=L.filter(x=>!inLead(x)&&(!x.sub||!SC.some(c=>c.id===x.sub)));
 return `<section class="grp"><h3>${tile(f,'sm')} ${f.l} <span class="n">${f.d!==f.l?f.d+' · ':''}${L.length}</span>${ed&&!q&&!f.one?`<span class="gacts"><button class="btn ghost" onclick="subAdd('${f.k}')">${ic('plus',14)} Sous-catégorie</button><button class="btn ${ro?'pri':'ghost'}" onclick="S.reorder=${ro?'null':`'${f.k}'`};render()">${ic('grid',14)} ${ro?'Terminé':'Ordonner'}</button></span>`:''}</h3>
  ${ro?`<p class="small muted" style="margin:-4px 0 8px">Montez ou descendez avec les flèches. <button class="more" onclick="memAuto('${f.k}')">Revenir à l'ordre automatique</button></p>`:''}
  ${rows(lead.concat(free.sort(mSort)))}
  ${SC.map((c,ci)=>{const M=L.filter(x=>x.sub===c.id&&!inLead(x)).sort(mSort);return `<div class="subh"><b>${esc(c.l)}</b><span class="n">${M.length}</span>${ro?`<span class="gacts"><button class="ib" ${ci?'':'disabled'} onclick="subMove('${f.k}','${c.id}',-1)" aria-label="Monter" style="transform:rotate(180deg)">${ic('chev',14)}</button><button class="ib" ${ci<SC.length-1?'':'disabled'} onclick="subMove('${f.k}','${c.id}',1)" aria-label="Descendre">${ic('chev',14)}</button><button class="ib" onclick="subRen('${f.k}','${c.id}')" aria-label="Renommer">${ic('edit',14)}</button><button class="ib" onclick="subDel('${f.k}','${c.id}')" aria-label="Supprimer">${ic('trash',14)}</button></span>`:''}</div>${rows(M)||(ro?`<p class="small muted" style="margin:0 0 8px 4px">Personne pour l'instant : choisissez cette sous-catégorie dans la fiche d'un membre.</p>`:'')}`}).join('')}
  ${!L.length?(!ed?'<p class="small muted">Aucun membre.</p>':`<button class="ghostc" style="width:100%" onclick="memberSheet(null,'${f.k}')">${tile(f,'sm')}<span><b>Ajouter dans ${f.l}</b><span class="small">${q?'Aucun résultat pour cette recherche':'Aucun membre pour l\'instant'}</span></span></button>`):''}</section>`}
function vUnite(){
 const q=S.q.trim().toLowerCase();
 const match=x=>!q||[x.first,x.last,x.nick,x.grade,x.role,x.tel,x.mail,x.fn].join(' ').toLowerCase().includes(q);
 const all=DB.members.filter(match);
 const groups=FU.filter(f=>S.filter==='all'||S.filter===f.k||S.filter===f.grp).map(f=>({f,L:all.filter(x=>x.fn===f.k)}));
 return `${NOTE}<div class="head"><div><h1>Unité</h1><p class="muted">${DB.members.length} membre${DB.members.length>1?'s':''}, classés par fonction</p></div>${canEdit('annu')?`<button class="btn pri big" onclick="memberSheet()">${ic('plus',18)} Ajouter un membre</button>`:''}</div>
 ${isChef()?uAccBar():''}
 <div class="filters" role="group" aria-label="Filtrer par fonction">
  <button class="fchip" aria-pressed="${S.filter==='all'}" onclick="S.filter='all';render()"><span class="tile xs" style="--c1:#64748b;--c2:#334155">${ic('users',15)}</span>Tous <span class="n">${DB.members.length}</span></button>
  ${FU.filter(f=>!f.grp||FU.find(g=>g.grp===f.grp)===f).map(f0=>{const f=f0.grp?MECAS:f0,n=DB.members.filter(x=>f0.grp?FUm[x.fn]&&FUm[x.fn].grp===f0.grp:x.fn===f.k).length;return `<button class="fchip" aria-pressed="${S.filter===f.k}" onclick="S.filter='${f.k}';render()">${tile(f,'xs')}${f.l} <span class="n">${n}</span></button>`}).join('')}
 </div>
 <div class="search">${ic('search',18)}<input class="in" id="u-q" placeholder="Rechercher un nom, un grade, un numéro…" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const i=$('u-q');i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)"></div>
 ${groups.map(({f,L},i)=>(f.grp&&(i===0||groups[i-1].f.grp!==f.grp)?`<div class="supgrp">${tile(MECAS,'sm')} <b>${MECAS.l}</b><span class="n">${MECAS.d} · ${groups.filter(g=>g.f.grp===f.grp).reduce((a,g)=>a+g.L.length,0)}</span></div>`:'')+`<div class="${f.grp?'ingrp':''}">${grpHTML(f,L,q)}</div>`).join('')}`;
}
/* Accès PAF OPS des membres de l'unité : reliés par l'adresse email (un accès déjà envoyé est reconnu, rien n'est renvoyé) */
const U_ROLES=['visit','sec','cst','dt','comm'];   // le DMMA s'invite depuis la page de son meeting
const U_DEF={PILOTES:'visit',DIR:'visit',DT:'dt',CST:'cst'};
const lc=v=>String(v||'').trim().toLowerCase();
const accOf=mail=>mail?DB.access.find(a=>!a.mid&&a.role!=='ro'&&lc(a.mail)===lc(mail)):null;
const memOf=mail=>mail?DB.members.find(x=>lc(x.mail)===lc(mail)):null;
const memLabel=x=>x?[x.grade,x.last?String(x.last).toUpperCase():'',x.first].filter(Boolean).join(' '):'';
function accChip(x){const a=accOf(x.mail);if(!a)return x.mail&&x.acc?`<span class="uacc todo">${ic('clock',12)} ${(RLm[x.acc]||{}).l} · à inviter</span>`:'';
 return `<span class="uacc ${a.hold?'todo':'ok'}">${ic(a.hold?'clock':'check',12)} ${(RLm[a.role]||{}).l||a.role}${a.hold?' · lien à envoyer':' · lien envoyé'}</span>`}
function uPending(){return DB.members.filter(x=>x.mail&&okMail(x.mail)&&x.acc&&!accOf(x.mail))}
/* Crée (en attente de validation) les accès des membres qui en ont un de prévu, puis ouvre la relecture des messages */
function uInvite(ids){const L=(ids||uPending().map(x=>x.id)).map(id=>DB.members.find(x=>x.id===id)).filter(x=>x&&x.mail&&x.acc&&!accOf(x.mail));
 L.forEach(x=>addAccess({id:uid(),role:x.acc,mid:null,name:memLabel(x)||x.mail,mail:x.mail,hold:true}));

function uSave(){
 const d=MF.d,e=$('u-err');
 if(!d.fn){e.textContent='Choisissez une fonction.';return}
 if(!d.first.trim()&&!d.last.trim()){e.textContent='Indiquez au moins un nom ou un prénom.';return}
 if(!String(d.role||'').trim()){e.textContent='Indiquez la fonction de cette personne.';return}
 if(!okTel(d.tel)){e.textContent='Le numéro de téléphone semble incomplet (10 chiffres).';return}
 if(!okMail(d.mail)){e.textContent='L\'adresse email n\'est pas valide.';return}
 if(FUm[d.fn]&&FUm[d.fn].one){const o=DB.members.find(x=>x.fn===d.fn&&x.id!==MF.id);if(o){if(!confirm((memLabel(o)||'Quelqu\'un')+' occupe déjà le poste de '+d.fn+'. Le remplacer ? (il passera dans DEP)'))return;o.fn='DEP'}}
 const a0=accOf(MF.mail0||d.mail),accR=d.acc===undefined?(a0?a0.role:(U_DEF[d.fn]||'')):d.acc;
 const old=MF.id?DB.members.find(x=>x.id===MF.id):null;
 const rec={id:MF.id||uid(),nick:NICK_FN[d.fn]?String(d.nick||'').trim():'',pc:NICK_FN[d.fn]?!!d.pc:false,res:NICK_FN[d.fn]?!!d.res:false,spe:d.fn==='PISTE'?(d.spe||''):'',dfn:(DFN[d.fn]||[]).includes(d.dfn)?d.dfn:'',athos:ATH_L[d.fn]?String(d.athos||'').replace(/\D/g,''):'',sub:subs(d.fn).some(c=>c.id===d.sub)?d.sub:'',ord:old&&old.fn===d.fn&&(old.sub||'')===(d.sub||'')?old.ord:undefined,photo:d.photo||'',fn:d.fn,grade:d.grade.trim(),first:d.first.trim(),last:d.last.trim(),role:d.role.trim(),kp:d.kp||'',tel:String(d.tel||'').replace(/[^\d+]/g,''),mail:(d.mail||'').trim(),acc:accR};
 if(rec.kp)DB.members.forEach(y=>{if(y.kp===rec.kp&&y.id!==rec.id)y.kp=''});
 const i=DB.members.findIndex(x=>x.id===rec.id);if(i>=0)DB.members[i]=rec;else DB.members.push(rec);
 if(MF.toMeet&&i<0){const mm=DB.meetings.find(x=>x.id===MF.toMeet);if(mm){const t=team(mm);if(!isDefault(rec)&&!t.add.includes(rec.id))t.add.push(rec.id)}}
 let msg='Membre enregistré';
 if(isChef()){const a=a0;

  else if(a&&!accR){msg+=' · son accès reste actif (retirez-le depuis la page Accès si besoin)'}
  else if(a){a.role=accR;a.name=memLabel(rec)||a.name;if(rec.mail&&lc(rec.mail)!==lc(a.mail)){a.mail=rec.mail;a.hold=true;a.renew=Date.now();a.msg=invMsg(a.role,null,a.name);save();closeSheet();render();invQueue();toast('Nouvel email : relisez le message puis envoyez le lien');return}}
  else if(accR&&rec.mail){addAccess({id:uid(),role:accR,mid:null,name:memLabel(rec)||rec.mail,mail:rec.mail,hold:true});msg+=MF.adopt?'':' · lien prêt à envoyer'}}
 save();closeSheet();render();toast(msg);
}

 <section class="acard"><div class="ah"><h2>${ic('gear',20)} Droits par rôle</h2>${ed&&isChef()?`<button class="btn ghost" onclick="DB.rights=JSON.parse(JSON.stringify(DEF_RIGHTS));save();render();toast('Droits par défaut rétablis')">Rétablir les droits par défaut</button>`:''}</div>
  <div class="legend"><span class="rt e">Modifier</span><span class="rt r">Lecture</span><span class="rt n">Aucun accès</span>${isChef()?'<span>Touchez une case pour la changer.</span>':''}</div>
  <div class="matrix"><table><thead><tr><th>Rôle</th>${AREAS.map(a=>`<th>${a.l}${a.soon?'<span class="soon">à venir</span>':''}</th>`).join('')}</tr></thead><tbody>
  ${[['paf','Patrouille de France'],['suivi','Pilotes PAF / DMMA'],['meet','Meeting'],['ro','Lien public']].map(([sd,lb])=>`<tr class="grp"><td colspan="${AREAS.length+1}">${lb}</td></tr>`+ROLES.filter(r=>r.side===sd).map(r=>`<tr><td><span class="rl">${tile(r,'xs')} ${r.l}</span></td>${AREAS.map(a=>{const v=right(a.k,r.k);const lock=!isChef()||r.k==='chef'||r.side==='ro'||(a.k==='acces'&&r.side!=='paf');return `<td><button class="rt ${v}" ${lock?'disabled':''} onclick="cycleRight('${r.k}','${a.k}')" aria-label="${r.l}, ${a.l} : ${v==='e'?'modifier':v==='r'?'lecture':'aucun accès'}">${v==='e'?'Modifier':v==='r'?'Lecture':'—'}</button></td>`}).join('')}</tr>`).join('')).join('')}
  </tbody></table></div></section>`;
}
function cycleRight(role,area){const o=['n','r','e'],v=right(area,role);DB.rights[role][area]=o[(o.indexOf(v)+1)%3];save();render()}
function delAccess(id){const a=DB.access.find(x=>x.id===id);DB.access=DB.access.filter(x=>x.id!==id);save();render();toast('Accès retiré : son lien ne marche plus'+(a?' ('+(a.name||a.mail)+')':''))}
let IV=null;
function inviteSheet(role,mid,name,mail){IV={role,mid:mid||null,name:name||'',mail:mail||'',step:1,msg:''};openSheet(ivHTML);setTimeout(()=>{const i=$('iv-name');if(i)i.focus()},60)}
function ivHTML(){
 const r=RLm[IV.role],m=IV.mid?DB.meetings.find(x=>x.id===IV.mid):null;
 return `<div class="sh">${tile(r,'lg')}<div class="t"><div class="tiny muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.1em">Inviter</div><div class="q" style="margin-top:2px">${r.l}</div>${m?`<div class="small muted">${esc(mName(m))}</div>`:''}</div><button class="ib" onclick="closeSheet()" aria-label="Fermer">${ic('x',18)}</button></div>
 <div class="sb"><label class="l" for="iv-name">Prénom et nom</label><input class="in" id="iv-name" value="${esc(IV.name)}" oninput="IV.name=this.value">
 <label class="l" for="iv-mail">Email</label><input class="in" id="iv-mail" type="email" inputmode="email" value="${esc(IV.mail)}" placeholder="prenom.nom@exemple.fr" oninput="IV.mail=this.value.trim()" onkeydown="if(event.key==='Enter')ivSave()">
 <div class="hint">Il recevra un lien personnel par email. Droits : ${AREAS.filter(a=>!a.soon&&right(a.k,IV.role)==='e').map(a=>a.l.toLowerCase()).join(', ')||'consultation uniquement'}.</div><div id="iv-err" class="hint bad"></div></div>
 <div class="sf"><span></span><button class="btn pri big" onclick="ivNext()">Continuer ${ic('chev',18)}</button></div>`;
}
function ivNext(){
 if(!okMail(IV.mail)||!IV.mail){$('iv-err').textContent='Indiquez une adresse email valide.';return}
 if(DB.access.some(a=>a.role===IV.role&&a.mid===IV.mid&&a.mail.toLowerCase()===IV.mail.toLowerCase())){$('iv-err').textContent='Cette personne a déjà cet accès.';return}
 IV.step=2;if(!IV.msg)IV.msg=invMsg(IV.role,IV.mid,IV.name.trim());openSheet(ivMsgHTML)}
function ivMsgHTML(){const r=RLm[IV.role];
 return `<div class="sh">${tile(r,'lg')}<div class="t"><div class="tiny muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.1em">Votre message</div><div class="q" style="margin-top:2px">${esc(IV.name||IV.mail)}</div><div class="small muted">${esc(IV.mail)} · ${r.l}</div></div><button class="ib" onclick="closeSheet()" aria-label="Fermer">${ic('x',18)}</button></div>
 <div class="sb"><label class="l">Message envoyé avec le lien (modifiable)</label><textarea class="in iqt" rows="11" oninput="IV.msg=this.value">${esc(IV.msg)}</textarea>
 <div class="hint">Le bouton « Ouvrir PAF OPS » avec le lien personnel est ajouté automatiquement sous votre message.</div></div>
 <div class="sf"><button class="btn" onclick="IV.step=1;openSheet(ivHTML)">${ic('back',16)} Modifier la personne</button><button class="btn pri big" onclick="ivSave()">${ic('send',18)} Envoyer le lien</button></div>`}
function ivSave(){
 if(!okMail(IV.mail)||!IV.mail){$('iv-err').textContent='Indiquez une adresse email valide.';return}
 if(DB.access.some(a=>a.role===IV.role&&a.mid===IV.mid&&a.mail.toLowerCase()===IV.mail.toLowerCase())){$('iv-err').textContent='Cette personne a déjà cet accès.';return}
 addAccess({id:uid(),role:IV.role,mid:IV.mid,name:IV.name.trim(),mail:IV.mail,msg:IV.msg,hold:false,at:Date.now()});
 if(IV.mid&&(IV.role==='org'||IV.role==='dv')){const m=DB.meetings.find(x=>x.id===IV.mid);m.contacts=m.contacts||[];const c=m.contacts.find(x=>x.fn===IV.role&&(!x.mail||x.mail.toLowerCase()===IV.mail.toLowerCase())&&(!x.mail||true));const [f,...l]=IV.name.trim().split(' ');if(c&&!c.mail){c.mail=IV.mail}else if(!m.contacts.some(x=>x.mail&&x.mail.toLowerCase()===IV.mail.toLowerCase()))m.contacts.push({id:uid(),fn:IV.role,first:f||'',last:l.join(' '),org:'',tel:'',mail:IV.mail})}
 save();closeSheet();render();
 toast('Lien envoyé à '+IV.mail);
}

/* ====================== Feuille modale ====================== */
let sheetFn=null;
function openSheet(fn){if($('ov').hidden)SHD=false;S.live=false;sheetFn=fn;const sh=$('sheet');sh.innerHTML=fn();fixSheet();$('ov').hidden=false;sh.scrollTop=0;$('ov').scrollTop=0;sh.querySelectorAll('.sb').forEach(e=>e.scrollTop=0);requestAnimationFrame(()=>{sh.scrollTop=0})}   // toute fenêtre s'ouvre en haut
function fixSheet(){const sh=$('sheet');if(!sh)return;const ctrls=[...sh.querySelectorAll('input,textarea,select,.yn button,.chips button,.step button,.mchip,.pk,.ocat button,.fdrop,.ghostc,.more')];const any=ctrls.some(x=>!x.disabled);if(ROLE==='visit'||RLm[ROLE].side==='suivi'||!any){sh.querySelectorAll('.sf .btn.pri').forEach(b=>{if(/Je valide|C'est noté|Enregistrer|Remplir/.test(b.textContent)){b.textContent='Fermer';b.onclick=closeSheet;b.className='btn pri'}})}}
function closeSheet(){$('ov').hidden=true;sheetFn=null;SHD=false}
/* Fermeture en touchant à côté : seulement si le doigt s'est posé ET levé à côté (pas en fin de sélection de texte ou de défilement),
   et jamais quand une saisie est en cours (on ferme alors avec la croix ou « Annuler ») */
let OVD=false,SHD=false;
function ovClick(e){if(e.target!==$('ov')||!OVD)return;OVD=false;if(SHD){toast('Saisie en cours : enregistrez, ou fermez avec la croix');const sh=$('sheet');sh.classList.remove('nudge');void sh.offsetWidth;sh.classList.add('nudge');return}closeSheet()}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#sheet'))SHD=true},true);
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#sheet'))SHD=true},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').hidden&&(!SHD||confirm('Fermer sans enregistrer ?')))closeSheet()});

$('filein').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f||!PICK)return;
 const P=PICK;PICK=null;   // le dépôt est lié à la tuile choisie, même si on en choisit une autre pendant l'envoi
 if(f.size>20*1024*1024){toast('Fichier trop lourd (20 Mo maximum)');return}
 toast('Envoi de '+f.name+'…');
 const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(f)});
 const mid=P.mid||P.park||null,label=P.pdoc?'Dossier pilotes':P.press?'Dossier de presse':P.itw?'Interview':P.park?'Parking':P.key==='axe'?'Plan du site':P.key==='pb'?'Pilot book':'';
 let up;try{up=await api('upload',{name:f.name,type:f.type,b64,mid,label})}catch(err){up={error:'Connexion impossible'}}
 if(!up||up.error){toast(up&&up.error||'Envoi impossible');return}
 const meta={name:f.name,size:f.size,t:Date.now(),url:up.url,driveId:up.id};
 if(P.park){const T=tech(DB.meetings.find(x=>x.id===P.park));T.parkFile=meta;if(/^image\//.test(f.type)){try{FILES[P.park+'park']=URL.createObjectURL(f)}catch(err){}}else delete FILES[P.park+'park'];save();render();toast('Schéma du parking déposé');return}
 if(P.pdoc){const nid=uid();try{FILEB[nid]=URL.createObjectURL(f)}catch(err){}DB.pdocs.unshift(Object.assign({id:nid,cat:P.pdoc},meta));save();closeSheet();render();toast('Document ajouté au dossier des pilotes');return}
 if(P.press){const nid=uid();try{FILEB[nid]=URL.createObjectURL(f)}catch(err){}DB.press=DB.press||[];DB.press.unshift(Object.assign({id:nid,kind:'file',by:ccWho()},meta));save();render();toast('Fichier ajouté au dossier de presse');return}
 if(P.itw){const e=(DB.itw||[]).find(x=>x.id===P.itw);if(!e)return;const nid=uid();try{FILEB[nid]=URL.createObjectURL(f)}catch(err){}e.att=(e.att||[]).concat([Object.assign({id:nid,kind:'file'},meta)]);e.tm=Date.now();save();render();toast('Fichier joint à l\'interview');return}
 const m=DB.meetings.find(x=>x.id===P.mid),A=aero(m),old=A[P.key];
 A[P.key]=Object.assign(meta,P.key==='pb'?{draft:old?!!old.draft:true}:{});
 if(/^image\//.test(f.type)){try{FILES[m.id+P.key]=URL.createObjectURL(f)}catch(err){}}else delete FILES[m.id+P.key];
 save();render();toast((P.key==='axe'?'Plan du site':'Pilot book')+' déposé');
});
/* iPhone : après la fermeture du clavier, la barre du bas pouvait rester remontée au-dessus de l'ancien clavier.
   Pendant la saisie, elle est masquée ; à la fermeture du clavier, la page est recalée. */
(()=>{const vv=window.visualViewport;const typing=()=>{const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/^(checkbox|radio|file|button)$/.test(a.type||'')};
 const sync=()=>{const kb=typing()&&!!vv&&vv.height<window.innerHeight*0.8;document.body.classList.toggle('kb',kb)};
 if(vv){vv.addEventListener('resize',sync);vv.addEventListener('scroll',sync)}
 document.addEventListener('focusin',()=>setTimeout(sync,300));
 document.addEventListener('focusout',()=>setTimeout(()=>{sync();if(!typing())window.scrollTo(window.scrollX,window.scrollY)},120));})();
/* ---- Application installable sur téléphone (PWA) ---- */
let INSTALL=null;
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;instBar()});
window.addEventListener('appinstalled',()=>{const b=$('instbar');if(b)b.remove();toast('PAF OPS est installé sur votre écran d\'accueil')});
function instBar(){
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 let off=false;try{off=!!localStorage.getItem('pafops:inst')}catch(e){}
 if(standalone||off||innerWidth>900||$('instbar'))return;
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.MSStream;
 const how=INSTALL?'':ios?'Touchez <b>Partager</b> (le carré avec la flèche) puis <b>« Sur l\'écran d\'accueil »</b>.':'Ouvrez le menu du navigateur (⋮) puis <b>« Ajouter à l\'écran d\'accueil »</b> ou <b>« Installer l\'application »</b>.';
 const d=document.createElement('div');d.id='instbar';d.className='instbar';
 d.innerHTML=`<img src="./icon-192.png" alt="" width="40" height="40"><div><b>Garder PAF OPS sur le téléphone</b><span>${how||'Un raccourci sur l\'écran d\'accueil, comme une application.'}</span></div>${INSTALL?`<button class="btn pri" onclick="INSTALL.prompt()">Installer</button>`:''}<button class="ib" aria-label="Fermer" onclick="try{localStorage.setItem('pafops:inst','1')}catch(e){};this.parentNode.remove()">${ic('x',16)}</button>`;
 document.querySelector('header.top').after(d)}
window.addEventListener('load',()=>setTimeout(instBar,1500));
boot();
</script>
