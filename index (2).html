<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAF OPS — Meeting Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1f45;--navy-2:#13306a;--navy-3:#1d3f86;
  --sky:#3d8bfd;--sky-soft:#e8f1ff;
  --bg:#f3f5f9;--card:#fff;--line:#e2e7ef;--text:#14213d;--muted:#5d6b84;
  --red:#d62839;--red-soft:#fdecee;
  --green:#1f9d55;--green-soft:#e6f6ec;
  --orange:#e8890c;--orange-soft:#fff3e2;
  --grey:#8a96ab;--grey-soft:#eef1f6;
  --r:18px;--sh:0 1px 2px rgba(11,31,69,.05),0 6px 20px rgba(11,31,69,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-3)}
svg{flex:none}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(61,139,253,.45),transparent 60%),linear-gradient(165deg,#06132e 0%,#0b1f45 55%,#13306a 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;position:relative;overflow:hidden}
.login .smoke{position:absolute;left:-10%;right:-10%;bottom:-40px;height:260px;opacity:.9;pointer-events:none}
.lg-box{width:min(920px,100%);position:relative;z-index:1;text-align:center}
.lg-logo{display:inline-flex;align-items:center;gap:14px;margin-bottom:10px}
.lg-logo b{font-size:30px;font-weight:900;letter-spacing:.04em}
.lg-logo span{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.75;text-align:left}
.lg-sub{opacity:.8;margin:0 0 34px}
.lg-q{font-size:13px;text-transform:uppercase;letter-spacing:.16em;opacity:.7;margin-bottom:14px}
.lg-roles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.lg-role{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:20px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;transition:transform .15s,background .15s}
.lg-role:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.lg-role .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.lg-role b{font-size:15px}
.lg-role small{opacity:.7;font-size:12px;line-height:1.3}
.lg-role.on{background:#fff;color:var(--navy);transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.3)}
.lg-role.on .ic{background:var(--sky-soft);color:var(--navy-3)}
.lg-pw{margin:26px auto 0;max-width:420px;background:#fff;color:var(--text);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:left;display:none}
.lg-pw.on{display:block;animation:pop .2s ease}
.lg-pw .row{gap:10px;flex-wrap:nowrap}
.lg-err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:6px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.lg-foot{margin-top:30px;font-size:12px;opacity:.6}

/* ---------- SHELL ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.03em;white-space:nowrap}
.brand small{display:block;font-weight:500;opacity:.7;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.top .sp{flex:1}
.ubtn{display:flex;align-items:center;gap:10px;background:var(--navy-2);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:6px 10px 6px 6px;color:#fff}
.ubtn .av{width:30px;height:30px;border-radius:9px;background:var(--sky);display:grid;place-items:center}
.ubtn b{font-size:13px;display:block;line-height:1.1;text-align:left}
.ubtn small{font-size:11px;opacity:.7;display:block;text-align:left}
.bell{position:relative;background:transparent;border:0;color:#fff;padding:7px;border-radius:10px}
.bell:hover{background:var(--navy-2)}
.bell .dot{position:absolute;top:1px;right:-1px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:10px;padding:1px 5px}
.menu{position:absolute;right:16px;top:58px;background:#fff;color:var(--text);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.2);display:none;z-index:40;min-width:240px;overflow:hidden}
.menu.on{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:#fff;padding:12px 16px;text-align:left;font-weight:600}
.menu button:hover{background:var(--bg)}
.notif{width:min(400px,calc(100vw - 32px));max-height:70vh;overflow:auto}
.notif .it{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.notif .it.imp{border-left:4px solid var(--red)}
.shell{display:flex;min-height:calc(100vh - 56px)}
.side{width:236px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:56px;height:calc(100vh - 56px);display:flex;flex-direction:column}
.side button.nv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px;border-radius:12px;color:var(--muted);font-weight:600;text-align:left}
.side button.nv:hover{background:var(--grey-soft);color:var(--text)}
.side button.nv.on{background:var(--navy);color:#fff}
.side .cnt{margin-left:auto;background:var(--orange);color:#fff;border-radius:20px;font-size:11.5px;padding:1px 8px;font-weight:700}
.side .nv.on .cnt{background:#fff;color:var(--navy)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-radius:12px;background:var(--bg)}
main{flex:1;min-width:0;padding:26px 30px 110px;max-width:1320px}
.bnav{display:none}

h1{font-size:27px;margin:0 0 4px;letter-spacing:-.015em;font-weight:800}
h2{font-size:19px;margin:0 0 12px;font-weight:800}
h3{font-size:15.5px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.gtile{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.click{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.click:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(11,31,69,.12);border-color:#cdd7e6}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.mt{margin-top:22px}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px}
.crumb button{border:0;background:none;color:var(--navy-3);font-weight:600;padding:2px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 15px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#c2cde0}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.sec{background:var(--sky-soft);border-color:#cfe0ff;color:var(--navy-3)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:#fff;border-color:#f3b8bf;color:var(--red)}
.btn.big{padding:14px 22px;font-size:15.5px;border-radius:14px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:#fff;border-radius:30px;padding:8px 15px;font-weight:700;font-size:13.5px;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* badges / pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
.s-nr{background:var(--grey-soft);color:#56627a}
.s-ec{background:var(--sky-soft);color:var(--navy-3)}
.s-av{background:var(--orange-soft);color:#a35e00}
.s-ok{background:var(--green-soft);color:#14713c}
.s-cor{background:var(--red-soft);color:var(--red)}
.s-na{background:repeating-linear-gradient(45deg,#f1f3f7,#f1f3f7 4px,#e6eaf0 4px,#e6eaf0 8px);color:#56627a}
.ph-av{background:var(--grey-soft);color:#56627a}
.ph-rap{background:var(--orange-soft);color:#a35e00}
.ph-urg{background:var(--orange);color:#fff}
.ph-late{background:var(--red);color:#fff}
.ph-sent{background:var(--sky-soft);color:var(--navy-3)}
.ph-done{background:var(--green-soft);color:#14713c}
.p-crit{background:var(--navy);color:#fff}
.p-lvl{background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:700}
.p-ecart{background:#fff;border:1.5px solid var(--red);color:var(--red)}
.p-demo{background:#fff4c7;color:#6b5200}
.dotc{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.t-red{background:var(--red)}.t-orange{background:var(--orange)}.t-green{background:var(--green)}.t-blue{background:var(--sky)}.t-grey{background:#c5cdd9}

/* priority tiles */
.prio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
.pa{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.pa:hover{border-color:#b9c7dd;transform:translateY(-1px)}
.pa .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.pa .n{font-size:28px;font-weight:900;line-height:1}
.pa .l{font-weight:700;margin-top:3px}
.pa .h{font-size:12.5px;color:var(--muted);margin-top:2px}
.ic-red{background:var(--red-soft);color:var(--red)}
.ic-or{background:var(--orange-soft);color:var(--orange)}
.ic-bl{background:var(--sky-soft);color:var(--navy-3)}
.ic-gr{background:var(--green-soft);color:var(--green)}

/* meeting card */
.mc{display:flex;flex-direction:column;gap:12px}
.mc .hd{display:flex;gap:14px;align-items:center}
.mc .ttl{flex:1;min-width:0}
.mc h3{font-size:16.5px}
.jx{text-align:center;min-width:70px;border-radius:14px;padding:8px;background:var(--bg)}
.jx b{display:block;font-size:22px;line-height:1.05;font-weight:900}
.jx span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.jx.urg{background:var(--orange-soft);color:#a35e00}
.jx.late{background:var(--red-soft);color:var(--red)}
.picons{display:flex;gap:6px;flex-wrap:wrap}
.pic-s{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;position:relative;background:var(--bg);color:var(--navy-3)}
.pic-s i{position:absolute;right:-2px;top:-2px;width:11px;height:11px;border-radius:50%;border:2px solid #fff}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--bg);border-radius:12px;padding:8px 10px}
.kv b{display:block;font-size:18px;font-weight:800}
.kv span{font-size:11.5px;color:var(--muted)}
.kv .r b{color:var(--red)}
.kv .o b{color:#a35e00}
.next{font-size:13px;display:flex;gap:8px;align-items:center;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.next b{color:var(--text)}
.bar{height:8px;background:var(--grey-soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-3),var(--sky));border-radius:8px}
.bar.g i{background:var(--green)}
.ring text{fill:var(--text)}

/* meeting header */
.mhead{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:22px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.mhead::after{content:"";position:absolute;right:-60px;top:-80px;width:360px;height:360px;background:radial-gradient(circle,rgba(61,139,253,.35),transparent 65%);pointer-events:none}
.mhead h1{color:#fff}
.mhead .meta{opacity:.85;font-size:14px}
.mhead .z{position:relative;z-index:1}
.mhead .stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mhead .st{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 14px;min-width:118px}
.mhead .st b{display:block;font-size:21px;font-weight:900}
.mhead .st span{font-size:12px;opacity:.8}
.mhead .st.alert{background:rgba(214,40,57,.38);border-color:rgba(255,120,130,.5)}
.mhead .st.warn{background:rgba(232,137,12,.35);border-color:rgba(255,190,110,.5)}
.mhead .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.mhead .btn.pri{background:#fff;color:var(--navy);border-color:#fff}
.mhead .ring text{fill:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.tab{flex:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab .n{background:var(--orange);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}

/* timeline */
.frise{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 10px;box-shadow:var(--sh);margin-bottom:18px}
.fr-track{position:relative;height:122px;margin:4px 6px 0}
.fr-line{position:absolute;left:0;right:0;top:70px;height:10px;border-radius:10px;overflow:hidden;display:flex}
.fr-line i{display:block;height:100%}
.fr-mk{position:absolute;top:64px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.fr-mk .pt{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--navy)}
.fr-mk .lb{position:absolute;white-space:nowrap;font-size:11.5px;font-weight:700;text-align:center;line-height:1.2}
.fr-mk .lb small{display:block;font-weight:500;color:var(--muted)}
.fr-mk.up .lb{bottom:30px}
.fr-mk.dn .lb{top:28px}
.fr-today{position:absolute;top:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.fr-today .tg{background:var(--navy);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap}
.fr-today .ln{width:2px;height:62px;background:var(--navy);opacity:.6}
.fr-today{bottom:auto!important}

/* pole tiles */
.ptile{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;text-align:left;position:relative}
.ptile .hd{display:flex;gap:14px;align-items:center}
.ptile .pic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;flex:none}
.ptile h3{font-size:16.5px;text-transform:uppercase;letter-spacing:.02em}
.ptile .subs{display:flex;gap:6px;flex-wrap:wrap}
.ptile .sc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--bg);border-radius:20px;padding:4px 10px 4px 8px}
.ptile .flag{position:absolute;top:14px;right:14px}
.stile{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 18px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative}
.stile .pic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:var(--sky-soft);color:var(--navy-3)}
.stile h3{font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.stile .flag{position:absolute;top:12px;right:12px}
.stile .bar{width:100%}

/* org hero */
.hero{border-radius:24px;padding:24px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy-3));margin-bottom:18px;position:relative;overflow:hidden}
.hero .z{position:relative;z-index:1}
.hero::after{content:"";position:absolute;right:-40px;bottom:-90px;width:320px;height:320px;background:radial-gradient(circle,rgba(61,139,253,.4),transparent 65%)}
.hero .big{font-size:44px;font-weight:900;line-height:1}
.phase-banner{display:flex;gap:14px;align-items:center;border-radius:18px;padding:14px 16px;margin-bottom:18px;font-weight:600}
.phase-banner .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.25)}
.pb-av{background:var(--sky-soft);color:var(--navy-3)}
.pb-rap{background:var(--orange-soft);color:#7a4500}
.pb-urg{background:var(--orange);color:#fff}
.pb-late{background:var(--red);color:#fff}
.pb-ok{background:var(--green-soft);color:#14713c}

/* item blocks */
.ib{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:16px;border-left:6px solid #c5cdd9}
.ib.st-ec{border-left-color:var(--sky)}
.ib.st-av{border-left-color:var(--orange)}
.ib.st-ok{border-left-color:var(--green)}
.ib.st-cor{border-left-color:var(--red)}
.ib.st-na{border-left-color:#d5dbe5;opacity:.85}
.ib .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ib .ttl{font-weight:800;font-size:15.5px}
.ib .need{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:9px 11px;font-size:13.5px;margin:10px 0 4px}
.ib .need b{color:var(--navy-3)}
.ib .body{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 14px}
.ib .body .full{grid-column:1/-1}
.ib .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ib .ft .meta{font-size:12.5px;color:var(--muted)}
.ib .acts{display:flex;gap:6px;flex-wrap:wrap}
label.fl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 5px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:15px}
.in:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px #d8e7ff}
.in:disabled{background:#f6f8fb;color:#5d6b84}
textarea.in{min-height:76px;resize:vertical}
.yn{display:flex;gap:8px}
.yn button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:800;color:var(--muted)}
.yn button.y.on{background:var(--green);border-color:var(--green);color:#fff}
.yn button.n.on{background:var(--red);border-color:var(--red);color:#fff}
.cks{display:flex;gap:8px;flex-wrap:wrap}
.ck{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:30px;padding:8px 13px;font-weight:700;font-size:13.5px;color:var(--muted)}
.ck .b{width:18px;height:18px;border-radius:6px;border:2px solid #c5cdd9;display:grid;place-items:center}
.ck.on{border-color:var(--navy-3);color:var(--navy-3);background:var(--sky-soft)}
.ck.on .b{background:var(--navy-3);border-color:var(--navy-3);color:#fff}
.yn button:disabled,.ck:disabled,.stp:disabled{cursor:not-allowed;opacity:.65}
.stepper{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:10px 12px}
.stp{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:800;color:var(--navy)}
.stepper .val{font-size:26px;font-weight:900;min-width:44px;text-align:center}
.stepper .of{color:var(--muted);font-weight:700}
.stepper .bar{flex:1;min-width:60px}
.hint{font-size:12.5px;border-radius:10px;padding:8px 10px;margin-top:8px}
.hint.or{background:var(--orange-soft);color:#7a4500}
.hint.red{background:var(--red-soft);color:#8f1622}
.hint.gr{background:var(--green-soft);color:#14713c}
.hint.bl{background:var(--sky-soft);color:var(--navy-3)}
.saved{font-size:12px;color:var(--green);font-weight:700}
.docchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:600}
.drop{border:2px dashed #c6d0e0;border-radius:14px;padding:12px;text-align:center;color:var(--muted);background:#fafcff;font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
.drop:hover{border-color:var(--sky);color:var(--navy-3)}
.drop:disabled{opacity:.5;cursor:not-allowed}

/* sticky bar */
.sbar{position:sticky;bottom:14px;z-index:20;margin-top:20px;background:var(--navy);color:#fff;border-radius:18px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(11,31,69,.35)}
.sbar .t{flex:1;font-weight:600;font-size:14px}
.sbar .t small{display:block;opacity:.7;font-weight:500}
.sbar .btn.pri{background:#fff;color:var(--navy);border-color:#fff}

/* widgets */
.cars{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.car{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--grey-soft);color:#b3bccb;position:relative}
.car.on{background:var(--green-soft);color:var(--green)}
.car.big::after{content:"";position:absolute;inset:-3px;border:2px dashed #9fb2d0;border-radius:15px}
.car.ut{width:60px}
.hotel{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.hotel .pic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sky-soft);color:var(--navy-3);flex:none}
.meals{width:100%;border-collapse:separate;border-spacing:6px}
.meals th{font-size:12px;color:var(--muted);text-align:left;font-weight:700}
.meal{border:1.5px solid var(--line);border-radius:12px;padding:9px;font-size:12px;cursor:pointer;min-width:118px;background:#fff;text-align:left;width:100%}
.meal.s0{background:#fafbfd;color:#a0aabb}
.meal.s1{border-color:#f4c2c8;background:var(--red-soft);color:#8f1622}
.meal.s2{border-color:#f7d9ad;background:var(--orange-soft);color:#7a4500}
.meal.s3{border-color:#bfe6cd;background:var(--green-soft);color:#14713c}
.meal b{display:block;font-size:12.5px}

/* tables */
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#f8fafc;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.cl{cursor:pointer}
.tbl tr.cl:hover td{background:#f8fbff}
.twrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff}
.twrap .tbl{border:0}
.vrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff}
.vrow:last-child{border-bottom:0}
.vrow .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sky-soft);color:var(--navy-3);flex:none}
.vrow .tx{flex:1;min-width:0}
.vlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(11,31,69,.45);z-index:50;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:60;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.dh{padding:18px 20px;border-bottom:1px solid var(--line)}
.db{padding:18px 20px;overflow-y:auto;flex:1}
.x{border:0;background:var(--grey-soft);width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--muted)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:90vh;overflow:auto;background:#fff;border-radius:20px;z-index:70;display:none;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.on{display:block;animation:pop .18s ease}
.modal .mb{padding:22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#fbfcfe}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;margin:20px 0 8px}
.msg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.msg .w{font-size:12px;color:var(--muted);margin-bottom:3px}
.msg.r-chef{border-left:4px solid var(--navy)}
.msg.r-sec{border-left:4px solid var(--navy-3)}
.msg.r-dv{border-left:4px solid var(--sky)}
.msg.r-org{border-left:4px solid var(--orange)}
.msg.r-dmma{border-left:4px solid var(--grey)}
.msg.r-sys{background:#f8fafc;border-style:dashed}
.hist{padding-left:16px;margin:0}
.hist li{font-size:12.5px;color:var(--muted);margin-bottom:5px}
.hist li.imp{color:var(--red);font-weight:700}
.alertbox{border-radius:14px;padding:12px 14px;font-size:13.5px;margin:10px 0;display:flex;gap:10px;align-items:flex-start}
.alertbox.red{background:var(--red-soft);color:#8f1622}
.alertbox.or{background:var(--orange-soft);color:#7a4500}
.alertbox.bl{background:var(--sky-soft);color:var(--navy-3)}
.alertbox.gr{background:var(--green-soft);color:#14713c}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(140px);background:var(--navy);color:#fff;padding:13px 18px;border-radius:14px;z-index:90;transition:transform .25s;font-weight:700;font-size:14px;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{transform:translateX(-50%) translateY(0)}
.preview{background:#f1f4f9;border-radius:14px;min-height:220px;display:grid;place-items:center;overflow:hidden;color:var(--muted);text-align:center;padding:10px}
.preview img{max-width:100%;max-height:420px}
.preview iframe{width:100%;height:420px;border:0;background:#fff}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 10px}
.disc{font-size:12.5px;color:var(--muted);border-left:3px solid var(--orange);padding:7px 11px;background:#fff;border-radius:0 10px 10px 0}
.synth-doc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px}
.synth-doc h2{border-bottom:2px solid var(--navy);padding-bottom:6px;margin-top:26px;font-size:17px}
.synth-doc h3{margin-top:14px;color:var(--navy-3)}
.synth-doc .tbl{font-size:13px}
.search{position:relative;max-width:320px;flex:1}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .in{padding-left:38px}
.set-row{display:grid;grid-template-columns:1fr 90px 90px 90px;gap:8px;align-items:center;margin-bottom:8px}
.set-row .in{text-align:center;padding:9px}

#syncst{position:fixed;left:12px;bottom:12px;z-index:85;font-size:12px;font-weight:800;padding:7px 11px;border-radius:10px;background:#fff;color:var(--navy-3);box-shadow:0 6px 18px rgba(11,31,69,.15);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#syncst.on{opacity:1;transform:none}
#syncst.ok{color:var(--green)}#syncst.err{color:#fff;background:var(--red)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--grey-soft);border-top-color:var(--navy-3);margin:0 auto 10px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:820px){#syncst{bottom:84px}}
/* ---------- ESPACE TIERS (organisateur, DV, DMMA) ---------- */
.thead{position:sticky;top:0;z-index:30;background:rgba(243,245,249,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,231,239,.8)}
.thead .in2{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.tlogo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.tlogo b{display:block;font-weight:900;letter-spacing:.03em;color:var(--navy)}
.tlogo small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.thead .bell{color:var(--navy)}
.thead .bell:hover{background:var(--grey-soft)}
.thead .bell .dot{border:2px solid #fff}
.tav{width:40px;height:40px;border-radius:13px;border:0;background:var(--navy);color:#fff;display:grid;place-items:center}
.tw{max-width:1000px;margin:0 auto;padding:18px 16px 130px}
.tmode .sbar{bottom:16px!important}
.thero{border-radius:28px;padding:24px;color:#fff;background:radial-gradient(500px 260px at 100% 0%,rgba(98,166,255,.55),transparent 60%),linear-gradient(140deg,#0b1f45 0%,#16357a 60%,#1f4a9e 100%);display:flex;gap:18px;align-items:center;justify-content:space-between;box-shadow:0 18px 40px rgba(11,31,69,.25);position:relative;overflow:hidden}
.thero .z{position:relative;z-index:1;min-width:0}
.thero h1{color:#fff;font-size:26px;margin:6px 0 0}
.thero .up{text-transform:uppercase;letter-spacing:.14em;opacity:.75;font-weight:700}
.thero .ring text{fill:#fff}
.hring{text-align:center;flex:none}
.hring .tiny{opacity:.85;margin-top:4px;font-weight:600}
.hpill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:700}
.hpill.strong{background:#fff;color:var(--navy)}
.hmsg{margin-top:14px;display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:9px 13px;font-weight:700;font-size:14px;background:rgba(255,255,255,.12)}
.hmsg.urg{background:var(--orange);color:#fff}
.hmsg.late{background:var(--red);color:#fff}
.hmsg.ok{background:var(--green);color:#fff}
.tcor{margin-top:16px;border-radius:22px;padding:16px;background:#fff;border:2px solid #f4c2c8;box-shadow:var(--sh)}
.tcor .cic{width:44px;height:44px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.cchip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #f4c2c8;background:var(--red-soft);color:#8f1622;border-radius:14px;padding:6px 12px 6px 6px;font-weight:800;font-size:13.5px}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.qb{border:0;background:#fff;border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:var(--sh);transition:transform .15s}
.qb:hover{transform:translateY(-2px)}.qb:active{transform:scale(.97)}
.qb b{display:block;font-size:14.5px}
.qb small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.qi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}
.sech{display:flex;align-items:center;gap:10px;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--navy);margin:28px 0 12px}
.sdot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:14px}
.app{border:0;background:#fff;border-radius:24px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.app:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(11,31,69,.13)}
.app:active{transform:scale(.96)}
.aic{width:74px;height:74px;border-radius:23px;display:grid;place-items:center;position:relative;color:#fff;flex:none;box-shadow:0 10px 20px rgba(29,63,134,.28),inset 0 1px 0 rgba(255,255,255,.28)}
.aic.lg{width:80px;height:80px;border-radius:25px}
.aic.sm{width:46px;height:46px;border-radius:15px;box-shadow:0 6px 12px rgba(29,63,134,.22)}
.aic.xs{width:30px;height:30px;border-radius:10px;box-shadow:none}
.abd{position:absolute;top:-7px;right:-7px;min-width:26px;height:26px;border-radius:13px;border:3px solid #fff;color:#fff;font-size:12.5px;font-weight:900;display:grid;place-items:center;padding:0 5px;line-height:1}
.abd.o{background:var(--orange)}.abd.r{background:var(--red)}.abd.g{background:var(--green)}.abd.b{background:var(--sky)}
.al{font-weight:800;font-size:14px;text-align:center;line-height:1.2;color:var(--text)}
.as{font-size:12px;font-weight:800;border-radius:20px;padding:2px 9px}
.as.o{background:var(--orange-soft);color:#a35e00}.as.r{background:var(--red-soft);color:var(--red)}.as.g{background:var(--green-soft);color:#14713c}.as.b{background:var(--sky-soft);color:var(--navy-3)}.as.mu{color:var(--muted)}
.shead{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.shead h1{font-size:26px}
.shead .up{text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.rback{width:46px;height:46px;border-radius:15px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--navy);flex:none;box-shadow:var(--sh)}
.sbar.ok{background:var(--green)}
.sbar.idle{background:#fff;color:var(--text);border:1px solid var(--line)}
.sbar.idle .t small{color:var(--muted);opacity:1}
.msgrow{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);text-align:left;width:100%;border-left:0;border-right:0;border-top:0}
.msgrow:last-child{border-bottom:0}
.msubs{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto}
.msub{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:4px 10px 4px 4px;font-weight:700;font-size:13px}
.msub.on{border-color:var(--navy-3);background:var(--sky-soft);color:var(--navy-3)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px rgba(214,40,57,.35)}100%{box-shadow:var(--sh)}}
@media (max-width:620px){
  .thero{flex-direction:column;align-items:flex-start;padding:20px}
  .thero h1{font-size:22px}
  .thero .hring{position:absolute;right:16px;top:18px}
  .hring svg{width:76px;height:76px}
  .hring .tiny{display:none}
  .thero .z:first-child{padding-right:84px}
  .qa{grid-template-columns:repeat(3,1fr);gap:8px}
  .qb{flex-direction:column;text-align:center;padding:12px 6px;gap:6px}
  .qb b{font-size:12.5px}.qb small{display:none}
  .apps{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .app{padding:14px 4px 10px;border-radius:20px;gap:7px}
  .aic{width:62px;height:62px;border-radius:20px}
  .aic svg{width:32px;height:32px}
  .al{font-size:12.5px}
  .as{font-size:11px;padding:1px 7px}
  .shead h1{font-size:21px}
  .aic.lg{width:64px;height:64px;border-radius:20px}
}

@media (max-width:1060px){.prio{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .lg-roles{grid-template-columns:repeat(2,1fr)}
  .lg-roles .lg-role:first-child{grid-column:1/-1}
  .side{display:none}
  main{padding:18px 14px 110px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:35;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:12px;position:relative}
  .bnav button.on{color:#fff;background:var(--navy)}
  .bnav .cnt{position:absolute;top:2px;right:18%;background:var(--orange);color:#fff;border-radius:10px;font-size:10px;padding:0 5px}
  .g2,.g3{grid-template-columns:1fr}
  .brand small,.ubtn .tx{display:none}
  .top{padding:10px 12px;gap:8px}
  h1{font-size:22px}
  .mhead,.hero{padding:18px}
  .hero .big{font-size:36px}
  .sbar{bottom:76px}
  .gtile{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stile{padding:16px 10px}
  .stile .pic{width:60px;height:60px;border-radius:18px}
  .stile h3{font-size:14px}
  .fr-mk .lb{font-size:10px}
  .set-row{grid-template-columns:1fr 64px 64px 64px}
}
@media print{
  .top,.side,.bnav,.no-print,.toast,.ov,.drawer,.modal,.menu{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .synth-doc{border:0;padding:0}
  .tbl tr{page-break-inside:avoid}
}
</style>

 flushing=call('sync',{changes:ch.map(c=>({key:c.key,val:JSON.parse(c.s)})),logs}).then(r=>{
  const rej=r.rejected||[];
  ch.forEach(c=>{if(!rej.includes(c.key))SRV.snap[c.key]=c.s});logs.forEach(l=>SRV.logs.add(l.id));

const PH={avenir:['À venir','ph-av'],rappel:['À compléter','ph-rap'],urgent:['Urgent','ph-urg'],late:['Hors délai','ph-late'],sent:['Envoyé à la PAF','ph-sent'],done:['Terminé','ph-done'],nodate:['Dates à confirmer','ph-av'],passed:['Meeting passé','ph-av']};
const mOver=m=>m.date&&m.date+(m.days-1)*DAY<today;
const deadline=(m,d)=>m.date?m.date-CFG.delays[d.delay].limite*DAY:null;
function phase(m,d,it){
 it=it||IT(m,d);
 if(it.status==='ok'||it.status==='na')return 'done';
 if(it.status==='av')return 'sent';
 if(!m.date)return 'nodate';
 if(mOver(m))return 'passed';
 const n=daysTo(m.date),p=CFG.delays[d.delay];
 if(n<p.limite)return 'late';if(n<=p.urgent)return 'urgent';if(n<=p.rappel)return 'rappel';return 'avenir';
}
const PHR={late:4,urgent:3,rappel:2,avenir:1,nodate:0,passed:0,sent:0,done:0};
function filled(m,d,it){
 it=it||IT(m,d);
 if(d.w==='hotels')return W(m).hotels.length>0;
 if(d.w==='meals'&&Object.values(W(m).meals).some(x=>x.s>0))return true;
 if(d.w==='comm'&&W(m).comm.length)return true;
 if(d.qty&&qOf(m,d,it)>0)return true;
 if(it.docs.length)return true;
 return Object.values(it.v).some(x=>Array.isArray(x)?x.length:(x!==''&&x!=null));
}
function qOf(m,d,it){if(d.auto)return W(m).hotels.reduce((a,h)=>a+(+h.chambres||0),0);return (it||IT(m,d)).q}
function mins(a,b){if(!a||!b)return null;const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);return (h2*60+m2)-(h1*60+m1)}
function ecarts(m,d,it){
 it=it||IT(m,d);const out=[];
 if(d.qty){const q=qOf(m,d,it);if(q<d.qty)out.push(`${q} ${d.unit} confirmé(s) pour un besoin de ${d.qty}${d.max?'–'+d.max:''}.`)}
 d.f.forEach(f=>{
  const v=it.v[f.k];
  if(f.type==='yn'&&v==='non'&&d.lvl==='oblig')out.push(`Réponse « Non » : ${f.k.toLowerCase()}.`);
  if(f.type==='checks'&&f.all&&Array.isArray(v)&&v.length&&v.length<f.o.length)out.push('Manquant : '+f.o.filter(o=>!v.includes(o)).join(', ')+'.');
  if(f.type==='select'&&v==='Aucun'&&d.lvl==='oblig')out.push('Aucun dispositif prévu.');
 });
 if(d.dur){const n=mins(it.v['Début'],it.v['Fin']);if(n!=null&&n<d.dur)out.push(`Créneau de ${n} min, inférieur à la référence de ${d.dur} min.`)}
 if(d.brief&&CFG.briefingLimit){const n=(it.v['Liste nominative']||'').split('\n').filter(x=>x.trim()).length;if(n>CFG.briefingLimit)out.push(`${n} personnes pour une limite de ${CFG.briefingLimit}.`)}
 return out;
}

function stats(m,defs){
 const s={tot:0,ok:0,na:0,av:0,ec:0,nr:0,cor:0,late:0,urgent:0,rappel:0,ecart:0};
 defs.forEach(d=>{const it=IT(m,d);s.tot++;s[it.status]++;const ph=phase(m,d,it);if(ph in s)s[ph]++;if(it.ecart&&it.ecart.open)s.ecart++});
 s.app=s.tot-s.na;s.pct=s.app?Math.round(s.ok/s.app*100):100;s.done=s.ok+s.na;s.sentpct=s.app?Math.round((s.ok+s.av)/s.app*100):100;return s;
}

function mStatus(m){

 const s=stats(m,DEFS);if(s.pct===100)return 'Prêt';if(s.ok+s.av+s.ec+s.cor>0)return 'En cours';return 'À préparer';

function mPhase(m){const w=worst(m,DEFS);return w&&PHR[w]>0?w:'done'}
function worst(m,defs){let w=null,r=-1;defs.forEach(d=>{const p=phase(m,d);if(PHR[p]>r){r=PHR[p];w=p}});return w}
function nextAction(m){
 const L=DEFS.filter(d=>!['ok','na'].includes(IT(m,d).status));if(!L.length)return null;
 L.sort((a,b)=>(PHR[phase(m,b)]-PHR[phase(m,a)])||((IT(m,b).status==='av')-(IT(m,a).status==='av'))||((b.crit||0)-(a.crit||0)));

}
function lastMod(m){const l=DB.log.find(e=>e.mid===m.id);let t=l?l.t:0;DEFS.forEach(d=>{const x=IT(m,d).mod;if(x>t)t=x});return t?fmtT(t):'Aucune'}
const visMeetings=()=>DB.meetings;
function schedule(){
 const out=[];
 DB.meetings.filter(m=>m.date&&!m.archived&&!mOver(m)).forEach(m=>{
  Object.entries(CFG.delays).forEach(([pk,p])=>{
   [['rappel','Rappel'],['urgent','Urgent'],['limite','Date limite']].forEach(([s,l])=>{
    const t=m.date-p[s]*DAY;
    const open=DEFS.filter(d=>d.delay===pk&&['nr','ec','cor'].includes(IT(m,d).status));
    out.push({m,pk,s,l,t,past:t<=today,n:open.length,resp:[...new Set(open.map(d=>RESP[d.resp]))]});
   });
  });
 });
 return out.sort((a,b)=>a.t-b.t);
}

function myActions(){
 const out=[];
 visMeetings().filter(m=>!m.archived&&!mOver(m)).forEach(m=>DEFS.forEach(d=>{
  if(!visible(d))return;const it=IT(m,d),ph=phase(m,d,it);let need=false;
  if(S.role==='chef')need=it.status==='av';
  else if(S.role==='sec')need=['nr','ec','cor'].includes(it.status)&&['late','urgent'].includes(ph);
  else need=canEdit(d)&&['nr','ec','cor'].includes(it.status);
  if(need)out.push({m,d,it,ph});
 }));
 return out.sort((a,b)=>(PHR[b.ph]-PHR[a.ph])||((b.it.status==='cor')-(a.it.status==='cor')));
}

  <div style="min-width:0;flex:1"><h1>${esc(m.name)} ${m.fake?'<span class="pill p-demo">fictif</span>':''}</h1>
  <div class="meta">${ic('pin',14)} ${esc(m.place)} · ${m.field?esc(m.field):'Terrain à renseigner'} · ${m.date?'Présentation le '+fmt(m.date):'Dates à confirmer'}</div></div>
  <div>${ring(s.pct,76,8,'#fff')}</div></div>
  <div class="z stats"><div class="st"><b>${m.date?(daysTo(m.date)>=0?'J-'+daysTo(m.date):'Passé'):'?'}</b><span>avant le meeting</span></div>
   <div class="st ${s.av?'warn':''}"><b>${s.av}</b><span>à valider</span></div>
   <div class="st ${co.length?'alert':''}"><b>${co.length}</b><span>critiques non validés</span></div>
   <div class="st ${bl.length?'alert':''}"><b>${bl.length}</b><span>points bloquants</span></div>
   <div class="st"><b>${s.ok}/${s.app}</b><span>validés</span></div></div>
  ${m.imported===false?`<div class="z alertbox or" style="margin-top:14px">${ic('info')}<span>Fiche retour non importée : aucune donnée inventée. Les informations restent à renseigner.</span></div>`:''}
  ${S.role==='chef'?`<div class="z row" style="margin-top:14px;gap:8px"><button class="btn sm" onclick="editMeeting('${m.id}')">${ic('edit',15)} Modifier</button><button class="btn sm" onclick="invite('${m.id}')">${ic('mail',15)} Inviter</button><button class="btn sm" onclick="newMeeting('${m.id}')">${ic('copy',15)} Dupliquer la structure</button><button class="btn sm" onclick="archive('${m.id}')">${ic('archive',15)} ${m.archived?'Désarchiver':'Archiver'}</button><button class="btn sm pri" onclick="S.mtab='synth';render(true)">${ic('doc',15)} État de préparation</button></div>`:''}
 </div>`;
 const tabs=[['poles','Pôles'],...(org?[]:[['val','À valider',s.av],['blk','Points bloquants',bl.length],['journal','Journal']]),['synth','État de préparation']];
 const tb=org||S.pole?'':`<div class="tabs no-print">${tabs.map(([k,l,n])=>`<button class="tab ${S.mtab===k?'on':''}" onclick="S.mtab='${k}';S.pole=null;S.sub=null;render(true)">${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</div>`;
 let body;
 if(S.mtab==='val')body=vValList([m]);

 else if(S.mtab==='journal')body=vJournal(m);

 else if(S.sub)body=subView(m,SUB[S.sub]);
 else if(S.pole)body=poleView(m,POLE[S.pole]);
 else body=frise(m)+poleGrid(m);
 return head+tb+body;
}

  ${POLES.map(p=>`<h2>${p.t}</h2>${p.subs.map(sb=>`<h3>${sb.t}</h3><table class="tbl"><tr><th style="width:26%">Élément</th><th>Statut</th><th>Informations / pièces</th><th>Validé par</th><th>Réserves</th></tr>

  <p class="tiny muted" style="margin-top:20px">Référence : ${REF}. ⚑ = critique.</p>
 </div>`;
}
function valsText(m,d,it){
 const p=[];
 Object.entries(it.v).forEach(([k,v])=>{if(Array.isArray(v)?v.length:v)p.push(esc(k)+' : '+esc(Array.isArray(v)?v.join(', '):v))});
 if(d.qty)p.push(qOf(m,d,it)+'/'+d.qty+' '+d.unit);
 if(d.w==='hotels')W(m).hotels.forEach(h=>p.push('🏨 '+esc(h.nom)+' ('+(+h.chambres||0)+' ch.)'));
 if(d.w==='meals'){const n=Object.values(W(m).meals).filter(x=>x.s===3).length;p.push(n+' repas réservé(s)')}
 if(d.w==='comm')W(m).comm.forEach(e=>p.push('📅 '+esc(e.type)+' — '+esc(e.o)));
 if(it.docs.length)p.push('📎 '+it.docs.map(id=>{const x=DB.docs.find(y=>y.id===id);return x?esc(x.versions[x.versions.length-1].name)+' (v'+x.versions.length+')':''}).join(', '));
 return p.join('<br>');
}
function exportCSV(mid){
 const m=M(mid);const rows=[['Pôle','Rubrique','Élément','Niveau','Critique','Responsable','Statut','Informations','Validé par','Date validation','Réserves']];
 DEFS.forEach(d=>{const it=IT(m,d);rows.push([POLE[d.p].t,SUB[d.s].t,d.t,LVL[d.lvl],d.crit?'Oui':'',RESP[d.resp],ST[it.status],valsText(m,d,it).replace(/<br>/g,' | ').replace(/&#39;/g,"'").replace(/&amp;/g,'&'),it.vBy||'',it.vAt?fmt(it.vAt):'',it.na||(it.ecart?(it.ecart.derog||it.ecart.txt):'')])});
 const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
 toast('Export en cours…');
 call('export',{mid,name:'Checklist accueil PAF — '+m.name+'.csv',csv}).then(r=>modal(`<h2>Checklist exportée</h2><p>Le fichier est enregistré dans le dossier Drive du meeting, sous « Exports ».</p><a class="btn pri big" href="${r.url}" target="_blank" rel="noopener">${ic('folder',18)} Ouvrir dans Drive</a>`,[['Fermer','closeModal()','']])).catch(()=>{});
}

/* =========================================================

========================================================= */
function touch(m,d,it){it.mod=now();if(it.status==='nr')it.status='ec';save()}
function fv(mid,iid,i,val){
 const m=M(mid),d=D[iid],it=IT(m,d),f=d.f[i];
 it.v[f.k]=val;touch(m,d,it);

function loadPreview(did,vi){
 const x=DB.docs.find(y=>y.id===did),v=x&&x.versions[vi];const box=()=>$('pvbox');
 if(!v||!v.fileId){if(box())box().innerHTML='Aperçu indisponible';return}

 call('file',{fileId:v.fileId}).then(r=>{
  const b=box();if(!b)return;
  if(r.tooBig){b.innerHTML=`<div>Fichier volumineux : aperçu indisponible.${r.url?`<br><a href="${r.url}" target="_blank" rel="noopener">Ouvrir dans Drive</a>`:''}</div>`;return}
  const bin=atob(r.b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  if(pvUrl)try{URL.revokeObjectURL(pvUrl)}catch(e){}
  pvUrl=URL.createObjectURL(new Blob([arr],{type:r.mime||'application/octet-stream'}));
  const mm=r.mime||'';

function appTile(m,sb){
 const vis=vDefs(d=>d.s===sb.id),ed=vis.filter(canEdit),st=d=>IT(m,d).status;
 const cor=ed.filter(d=>st(d)==='cor').length,todo=ed.filter(d=>['nr','ec','cor'].includes(st(d)));
 const hot=todo.some(d=>['late','urgent'].includes(phase(m,d)));
 const chk=c=>`<span class="abd ${c}">${ic('check',12,4)}</span>`;
 let b='',cap,cc;
 if(!ed.length){cap='Consulter';cc='mu';if(vis.length&&vis.every(d=>['ok','na'].includes(st(d))))b=chk('g')}
 else if(cor){b='<span class="abd r">!</span>';cap='À corriger';cc='r'}
 else if(todo.length){b=`<span class="abd ${hot?'r':'o'}">${todo.length}</span>`;cap=hot?'Urgent':`${todo.length} à remplir`;cc=hot?'r':'o'}
 else if(ed.every(d=>['ok','na'].includes(st(d)))){b=chk('g');cap='Validé';cc='g'}
 else{b=chk('b');cap='Envoyé';cc='b'}
 return `<button class="app" onclick="openSub('${m.id}','${sb.id}')"><span class="aic" style="${grad(sb.p)}">${duo(sb.id,38)}${b}</span><span class="al">${sb.t}</span><span class="as ${cc}">${cap}</span></button>`;
}

function tMsg(sid){
 const m=M(S.mid);const subs=POLES.flatMap(p=>p.subs).filter(sb=>vDefs(d=>d.s===sb.id).length);
 let cur=sid||S.sub||subs[0].id;if(!subs.some(x=>x.id===cur))cur=subs[0].id;
 modal(`<h2>Écrire à la PAF</h2><label class="fl">À propos de</label><div class="msubs">${subs.map(sb=>`<button class="msub ${sb.id===cur?'on':''}" data-s="${sb.id}" onclick="document.querySelectorAll('.msub').forEach(b=>b.classList.remove('on'));this.classList.add('on')"><span class="aic xs" style="${grad(sb.p)}">${duo(sb.id,18)}</span>${sb.t}</button>`).join('')}</div>
  <label class="fl">Votre message</label><textarea class="in" id="tmsg" placeholder="Votre question ou information…"></textarea>`,
 [['Annuler','closeModal()',''],[`${ic('send',16)} Envoyer`,'__go','pri']],()=>{
  const t=$('tmsg').value.trim();if(!t){toast('Écrivez votre message');return false}
  const s=document.querySelector('.msub.on').dataset.s,d=vDefs(x=>x.s===s)[0],it=IT(m,d);
  it.thread.push({t:now(),who:ROLES[S.role].me,role:S.role,text:t});it.mod=now();
  log(m.id,me(),SUB[s].t+' : message à la PAF',false);closeModal();save();toast('Message envoyé à la PAF ✓');
 });
 setTimeout(()=>{const x=$('tmsg');if(x)x.focus()},60);
}

  <button class="btn big pri" style="width:100%;margin-top:14px" onclick="closeModal();tMsg()">${ic('chat',18)} Écrire un message</button>`,[['Fermer','closeModal()','']]);
}

/* =========================================================
   MODALES / TOAST
========================================================= */
let modalCb=null;
function modal(html,btns,cb){
 modalCb=cb||null;
 $('modal').innerHTML=`<div class="mb">${html}</div><div class="mf">${btns.map(([l,fn,c])=>`<button class="btn ${c}" onclick="${fn==='__go'?'modalGo()':fn}">${l}</button>`).join('')}</div>`;
 $('modal').classList.add('on');$('ov').classList.add('on');$('ov').style.zIndex=65;
}
function modalGo(){if(modalCb){const r=modalCb();if(r===false)return}}
function closeModal(){$('modal').classList.remove('on');$('ov').style.zIndex='';if(!$('drawer').classList.contains('on'))$('ov').classList.remove('on')}
function closeAll(){if($('modal').classList.contains('on')){closeModal();return}$('drawer').classList.remove('on');$('ov').classList.remove('on')}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});

/* =========================================================
   DÉMARRAGE
========================================================= */
showGate('load');
function forgetToken(){if(!HAS_GAS)try{localStorage.removeItem('pafops_k')}catch(e){}}
function getToken(cb){
 if(HAS_GAS){google.script.url.getLocation(l=>cb((l&&l.parameter&&l.parameter.k)||''));return}
 let k='';try{k=new URLSearchParams(location.search).get('k')||''}catch(e){}
 if(k){try{localStorage.setItem('pafops_k',k)}catch(e){}try{history.replaceState(null,'',location.pathname)}catch(e){}cb(k);return}
 try{k=localStorage.getItem('pafops_k')||''}catch(e){}
 cb(k);
}
function forgetDevice(){forgetToken();closeModal();SRV.k='';S.role=null;showGate('auth');toast('Déconnecté de cet appareil')}
getToken(k=>{
 SRV.k=k;
 if(!SRV.k){showGate('auth');return}
 call('load',{}).then(r=>{applyLoad(r);S.view='dash';S.tv='home';render(true);toast('Bienvenue — '+ROLES[S.role].l)})
  .catch(e=>{if(!(e&&e.error==='auth'))showGate('err')});
});
setInterval(()=>refresh(false),90000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.role)refresh(false)});
window.addEventListener('beforeunload',e=>{if(flushing||(S.role&&pending().ch.length)){flush();e.preventDefault();e.returnValue=''}});
