<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Série PAF</title>
<style>
:root{--bg:#0b1220;--pan:rgba(10,16,30,.93);--line:rgba(255,255,255,.12);--mu:#94a3b8;--tx:#e2e8f0;--acc:#3b82f6;--red:#ef4444}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#pan{position:fixed;top:0;bottom:0;left:0;width:340px;background:var(--pan);border-right:1px solid var(--line);overflow-y:auto;padding:12px 12px 80px;z-index:3;backdrop-filter:blur(6px)}
#pan.hid{transform:translateX(-100%)}
#pan h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:16px 0 6px}
#pan h2:first-child{margin-top:0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
.b{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.b:hover{background:rgba(255,255,255,.14)}.b.pri{background:var(--acc);border-color:var(--acc)}.b.on{background:#1d4ed8;border-color:#60a5fa}.b.dng{color:#fca5a5}
.b:disabled{opacity:.45;cursor:default}
select,.in{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:6px 8px;width:100%}
select option{background:#0f172a}
.fl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.fl li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;background:rgba(255,255,255,.03)}
.fl li.sel{border-color:#60a5fa;background:rgba(59,130,246,.18)}
.fl li .n{width:22px;height:22px;border-radius:7px;background:#1e293b;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.fl li .t{flex:1;min-width:0}.fl li .t b{display:block;font-size:13.5px}.fl li .t small{color:var(--mu)}
.fl li .x{opacity:.7;padding:2px 6px;border-radius:6px;border:0;background:none;cursor:pointer}.fl li .x:hover{opacity:1;background:rgba(255,255,255,.1)}
.pr{display:grid;grid-template-columns:96px 1fr 84px;gap:6px;align-items:center;margin:4px 0}
.pr label{font-size:12.5px;color:var(--mu)}.pr .nu{display:flex;align-items:center;gap:3px}.pr .nu input{width:100%;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:7px;padding:3px 4px;color:inherit;font:inherit;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}.pr .nu input::-webkit-inner-spin-button{display:none}.pr .nu i{font-style:normal;font-size:11.5px;color:var(--mu);min-width:12px}.pr output{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#3b82f6}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:6px 0}
.lib button{font-size:12px;padding:7px 4px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;color:inherit}
.lib button:hover{background:rgba(59,130,246,.25)}
.lib.lbb{grid-template-columns:1fr}.lib.lbb button{text-align:left;padding:8px 10px;display:flex;flex-direction:column;gap:2px}.lib.lbb b{font-size:13px}.lib.lbb small{font-size:11.5px;color:var(--mu);line-height:1.3}
.lbf button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px}.lbf span{font-size:11.5px}
.sn{display:grid;grid-template-columns:1fr 112px 26px;gap:6px;align-items:center;margin:4px 0}
.mu{color:var(--mu);font-size:12.5px}#asm{position:fixed;left:50%;transform:translateX(-50%);bottom:52px;z-index:6;display:flex;gap:6px;align-items:center;background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:8px 10px;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}#asm .grip{cursor:grab;font-size:20px;line-height:1;padding:4px 6px;color:var(--mu);touch-action:none;user-select:none}#asm.drag{opacity:.85}#asm.drag .grip{cursor:grabbing}#asm input[type=range]{width:min(320px,40vw)}#asm select{width:auto;max-width:190px}#asm .g2{display:inline-flex;gap:4px;align-items:center;padding-left:6px;border-left:1px solid var(--line)}#asm .rec{color:#ef4444;font-weight:800;animation:rcb 1s infinite}@keyframes rcb{50%{opacity:.3}}.rcbox{margin-top:10px;padding:10px;border:1px solid #f97316;border-radius:12px;background:rgba(249,115,22,.08)}.rcdir{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.rcb{display:flex;flex-direction:column;align-items:center;font-size:22px;padding:8px 4px;line-height:1.1}.rcb small{font-size:11.5px;margin-top:3px}.rci{font-size:26px;line-height:1}.rcchips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.rcchips .b{padding:5px 9px}.rcpl .b{display:flex;flex-direction:column;align-items:center;padding:4px 6px;color:#bfdbfe}.rcpl .b small{font-size:10.5px}.rcgo{flex:1;font-size:16px;padding:10px}.savebox{margin-top:8px;padding:9px 10px;border:1px solid #22c55e;border-radius:11px;background:rgba(34,197,94,.1);display:flex;flex-direction:column;gap:2px}.smk{min-width:34px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.35);font-weight:800;cursor:pointer;font-size:12.5px}.hint{color:var(--mu);font-size:12px;line-height:1.4;margin:6px 0}
#tog{position:fixed;left:350px;top:10px;z-index:4;background:rgba(10,16,30,.9);color:#fff}#pan.hid+#tog{left:10px}
#vbar{position:fixed;right:10px;top:10px;z-index:4;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#vbar .g{display:flex;gap:4px;background:var(--pan);padding:4px;border-radius:11px;border:1px solid var(--line)}
#info{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:var(--pan);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:12.5px;z-index:4;pointer-events:none;max-width:90vw;text-align:center}
#info:empty{display:none}
#fe{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:grid;place-items:center}#fe[hidden]{display:none}
#fe .box{background:#0f172a;border:1px solid var(--line);border-radius:16px;padding:14px;width:min(560px,94vw);max-height:92vh;overflow:auto}
#fesvg{width:100%;height:auto;background:#0b1220;border-radius:12px;touch-action:none;border:1px solid var(--line)}
#pan .axb{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;font-size:13px}#pan .ownb{border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0;background:rgba(100,116,139,.1)}#pan .ownb small{opacity:.7;margin-left:3px}
#mdl{position:fixed;inset:0;z-index:30;background:rgba(2,6,23,.6);display:grid;place-items:center;padding:16px}#mdl .mbox{position:relative;background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}#mdl .mx{position:absolute;right:10px;top:10px}#mdl h2{margin-top:0;padding-right:40px}
.tw{overflow-x:auto}.smt{border-collapse:collapse;width:100%;font-size:13px}.smt th,.smt td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}.smt td:first-child{text-align:left}.smt td small{display:block;color:var(--mu);font-size:11px}.smt th{background:rgba(148,163,184,.12)}.smt .warn{background:rgba(245,158,11,.25);font-weight:700}.smt .over{background:rgba(239,68,68,.35);font-weight:800}
#load{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);color:var(--mu)}#load[hidden]{display:none}
@media (max-width:760px){#pan{width:100%;top:auto;height:52%;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0}#pan.hid{transform:translateY(100%)}#tog{left:auto;right:10px;top:auto;bottom:calc(52% + 8px)}#pan.hid+#tog{left:auto;bottom:10px}#vbar{top:10px}}
</style></head><body>
<canvas id="cv"></canvas>
<aside id="pan"></aside>
<button id="tog" class="b" onclick="togPan()">☰ Panneau</button>
<div id="vbar"></div>
<div id="info"></div>
<div id="fe" hidden><div class="box"><div class="row" style="justify-content:space-between"><b id="fet">Formation</b><button class="b" onclick="feClose()">Fermer</button></div>
 <p class="hint">Vue de dessus, nez vers le haut. Faites glisser les avions ; touchez-en un pour le choisir (numéro, retrait). Le quadrillage est la place (« slot »).</p>
 <div id="fename"></div>
 <svg id="fesvg" viewBox="-6.5 -2 13 10"></svg>
 <div id="fectl"></div>
 <div class="row" style="margin-top:8px;justify-content:space-between"><span class="row"><button class="b" id="ferst" onclick="feReset()">Revenir au dessin d'origine</button><button class="b dng" id="fedel" onclick="feDel()">Supprimer la formation</button></span><button class="b pri" onclick="feSave()">Enregistrer dans mes formations</button></div><p class="hint" id="femsg"></p></div></div>
<div id="load">Chargement du moteur 3D…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   Série PAF — dessin 3D du ruban (les 8 avions groupés).
   Une série = un point de départ + une suite de figures enchaînées.
   Chaque figure est « pilotée » : lignes, ressources, virages, tonneaux,
   de sorte que le ruban reste continu. Le leader règle chaque figure
   (curseurs ou poignées 3D) et place des « snapshots » de formation.
   ===================================================================== */
const D2R=Math.PI/180;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* --- Lieu : Salon-de-Provence (LFMY) --- */
const C0={la:43.6063,lo:5.1092};
const MX=111320*Math.cos(C0.la*D2R),MZ=110540;
const toW=(la,lo)=>({x:(lo-C0.lo)*MX,z:-(la-C0.la)*MZ});
/* --- Formations (8 avions : 1 leader, 2-3 intérieurs, 4-5 extérieurs, 6 charognard, 7-8 solos) ---
   [latéral (droite +), arrière (+)] en places ; d'après la planche des formations de la Patrouille.
   Chacune peut être redessinée dans l'outil (bouton « Modifier la formation »). */
/* relevé sur la planche « Les formations » : le leader (1) est toujours devant, en [0,0] ;
   2-3 intérieurs, 4-5 extérieurs, 6 charognard, 7-8 solos. 1 place latérale = 1 ; distances arrière à la même échelle. */
/* relevé sur la planche « Les formations » ; [latéral (droite +), arrière (+), n° d'Athos]. Règles de placement :
   1 devant ; 4 derrière le 1 ; 2 au plus près à droite du 1, 3 au plus près à gauche ; 8 dans l'aile du 2, 7 dans l'aile du 3
   (parfois plus en arrière) ; 6 derrière le 2, 5 derrière le 3. Colonne de 4 avions : 1, 4, 5, 6. Grande et très grande flèche :
   5 au bout à gauche, 6 au bout à droite. Big nine : grande flèche + 4 au bout à gauche, 9 au bout à droite. */
const FORMS0={
 'DIAMANT':[[0,0,1],[1,0.9,2],[-1,0.9,3],[0,1.8,4],[-1,2.7,5],[1,2.7,6],[-2,1.8,7],[2,1.8,8]],
 'CONCORDE':[[0,0,1],[1,2.3,2],[-1,2.3,3],[0,1.5,4],[-1,4,5],[1,4,6],[-2,3.1,7],[2,3.1,8]],
 'CANARD':[[0,0,1],[1,0.8,2],[-1,0.8,3],[0,1.5,4],[-1,2.3,5],[1,2.3,6],[-2,3.1,7],[2,3.1,8]],
 'TÉ':[[0,0,1],[1,0,2],[-1,0,3],[0,1.4,4],[0,2.7,5],[0,4.1,6],[-2,0,7],[2,0,8]],
 'FLECHE':[[0,0,1],[1,0.8,2],[-1,0.8,3],[0,1.6,4],[0,3.1,5],[0,4.6,6],[-2,1.6,7],[2,1.6,8]],
 'RAFALE':[[0,0,1],[1,2.3,2],[-1,2.3,3],[0,1.5,4],[-1,3.9,5],[1,3.9,6],[-2,2.3,7],[2,2.3,8]],
 'DARD':[[0,0,1],[1,2.2,2],[-1,2.2,3],[0,1.4,4],[0,2.9,5],[0,4.4,6],[-2,3,7],[2,3,8]],
 'GF':[[0,0,1],[1,0.9,2],[-1,0.9,3],[0,1.6,4],[-3,2.5,5],[3,2.5,6],[-2,1.7,7],[2,1.7,8]],
 'ALPHA':[[0,0,1],[1,0.9,2],[-1,0.9,3],[0,3,4],[-1,2.2,5],[1,2.2,6],[-2,3,7],[2,3,8]],
 'TRANSALL':[[0,0,1],[1,0.9,2],[-1,0.9,3],[0,1.5,4],[-1,2.2,5],[1,2.2,6],[-2,0.9,7],[2,0.9,8]],
 'CYGNE':[[0,0,1],[1,3.7,2],[-1,3.7,3],[0,1.5,4],[0,2.9,5],[0,4.5,6],[-2,4.5,7],[2,4.5,8]],
 'TGF':[[0,0,1],[1,2.3,2],[-1,2.3,3],[0,1.5,4],[-3,3.9,5],[3,3.9,6],[-2,3.1,7],[2,3.1,8]],
 'SUPER-BALANCE':[[0,0,1],[1,0.8,2],[-1,0.8,3],[0,1.5,4],[-3,0.8,5],[3,0.8,6],[-2,0.8,7],[2,0.8,8]],
 'CROISILLON':[[0,0,1],[1,2.4,2],[-1,2.4,3],[0,1.6,4],[0,3.1,5],[0,4.6,6],[-2,2.4,7],[2,2.4,8]],
 'FUSEE':[[0,0,1],[1,5.2,2],[-1,5.2,3],[0,1.5,4],[0,3,5],[0,4.4,6],[-2,6.1,7],[2,6.1,8]],
 'DEUX POUTRES':[[0,0,1],[1,0.8,2],[-1,0.8,3],[0,1.6,4],[-1,2.5,5],[1,2.5,6],[-1,4.1,7],[1,4.1,8]],
 'APOLLO':[[0,0,1],[1,2.2,2],[-1,2.2,3],[0,1.4,4],[-1,3.7,5],[1,3.7,6],[-2,4.6,7],[2,4.6,8]],
 'LOSANGE':[[0,0,1],[1,0.8,2],[-1,0.8,3],[0,3.2,4],[-1,2.4,5],[1,2.4,6],[-2,1.6,7],[2,1.6,8]],
 'ARIANE':[[0,0,1],[1,3.9,2],[-1,3.9,3],[0,1.5,4],[0,3,5],[0,4.7,6],[-1,5.4,7],[1,5.4,8]],
 'TORPILLE':[[0,0,1],[0,1,4],[0,2,5],[0,3,6],[0,4,3],[0,5,2],[0,6,7],[0,7,8]],
 'MR':[[0,0,1],[1,0.9,2],[-1,0.9,3],[0,1.8,4],[-1,2.7,5],[1,2.7,6],[-2,1.8,7],[2,1.8,8]],
 'BIG NINE':[[0,0,1],[1,0.85,2],[-1,0.85,3],[-4,3.4,4],[-3,2.55,5],[3,2.55,6],[-2,1.7,7],[2,1.7,8],[4,3.4,9]]};
const FORM_L={'BIG NINE':'Big nine','GF':'Grande flèche','TGF':'Très grande flèche','MR':'MR','TÉ':'Té','FLECHE':'Flèche','FUSEE':'Fusée','SUPER-BALANCE':'Super-balance','DEUX POUTRES':'Deux poutres'};
const formL=k=>FORM_L[k]||(k?k.charAt(0)+k.slice(1).toLowerCase():'');
/* --- Figures : paramètres et « pilotage » --- */
const SIDE=[['G','Gauche'],['D','Droite']];
const P=(k,l,min,max,st,def,u)=>({k,l,min,max,st,def,u});
const LEAD=P('L0','Ligne d\'entrée',0,3000,50,0,'m');   // 0 par défaut : les briques s'enchaînent bout à bout
const FIG={
 LIGNE:{l:'Ligne droite',ps:[P('L','Longueur',100,5000,50,1200,'m')],gen:(T,p)=>{T.line(p.L);T.mark('end')},h:[['end','F','L',1]]},
 DEMI:{l:'Demi-boucle',ps:[P('a','Angle',-360,360,5,180,'°'),P('R','Rayon',150,900,10,380,'m'),P('rt','Demi-tonneau en haut',0,1,1,0,''),P('L','Ligne après',0,3000,50,600,'m')],gen:(T,p)=>{T.pitch(p.a,p.R,'top');if(p.rt)T.roll(180,220);T.line(p.L);T.mark('end')},h:[['top','U','R',.5],['end','F','L',1]]},
 VIRAGE:{l:'Virage',side:1,ps:[P('a','Angle',5,720,5,180,'°'),P('R','Rayon',150,3000,10,700,'m'),P('bank','Inclinaison',10,180,1,60,'°'),P('L','Ligne après',0,3000,50,0,'m')],gen:(T,p,s)=>{T.turn(s*p.a,p.R,p.bank,'mid');if(p.L)T.line(p.L);T.mark('end')},h:[['mid','OUT','R',1]]},
 BOUCLE:{l:'Boucle',ps:[P('a','Angle',30,360,5,360,'°'),P('R','Rayon',150,900,10,380,'m'),P('obl','Oblique',0,90,5,0,'°'),P('bk','Ailes à plat à la fin',0,1,1,1,''),P('L','Ligne après',0,3000,50,0,'m')],side:1,gen:(T,p,s)=>{if(p.obl)T.roll(-s*p.obl,250);T.pitch(p.a/2,p.R,'top');T.pitch(p.a/2,p.R);if(p.obl&&p.bk)T.roll(s*p.obl,250);if(p.L)T.line(p.L);T.mark('end')},h:[['top','U','R',.5]]},
 'BOUCLE OBL':{base:'BOUCLE',l:'Boucle oblique',def:{obl:45}},
 TG:{l:'Boucle tonneau G',ps:[P('R','Rayon',200,700,10,380,'m'),P('Lr','Tonneau au sommet',150,900,10,350,'m')],gen:(T,p)=>{T.pitch(180,p.R,'top');T.roll(-360,p.Lr);T.pitch(180,p.R)},h:[['top','U','R',.5]]},
 TD:{base:'TG',gen:(T,p)=>{T.pitch(180,p.R,'top');T.roll(360,p.Lr);T.pitch(180,p.R)}},
 TGTD:{l:'TG puis TD',ps:[P('R','Rayon',200,700,10,380,'m'),P('Lr','Longueur tonneau',150,900,10,300,'m')],gen:(T,p)=>{T.pitch(90,p.R);T.roll(-360,p.Lr);T.pitch(180,p.R,'top');T.roll(360,p.Lr);T.pitch(90,p.R)},h:[['top','U','R',.5]]},
 TDTG:{base:'TGTD',gen:(T,p)=>{T.pitch(90,p.R);T.roll(360,p.Lr);T.pitch(180,p.R,'top');T.roll(-360,p.Lr);T.pitch(90,p.R)}},
 GTG:{l:'Grand tonneau G',ps:[P('R','Rayon',200,800,10,420,'m')],gen:(T,p)=>T.barrel(-1,p.R),h:[]},
 GTD:{base:'GTG',gen:(T,p)=>T.barrel(1,p.R)},
 /* Construction façon RollerCoaster Tycoon : tout droit (à plat, courbe vers le haut ou vers le bas) ou virage G/D.
    Un virage = l'avion s'incline puis tire dans son plan : à 90° d'inclinaison il tourne à plat, en dessous la trajectoire
    monte (boucle oblique, et boucle si 0°), au-delà elle descend ; il se remet ensuite ailes à plat. */
 RC_S:{l:'Tout droit',ps:[P('v','Trajectoire',-1,1,1,0,''),P('ang','Angle de la courbe',5,360,5,90,'°'),P('R','Rayon',150,1200,10,400,'m'),P('L','Ligne droite',0,5000,50,800,'m')],
  gen:(T,p)=>{if(+p.v){T.pitch(+p.v*p.ang,p.R,'top')}if(p.L)T.line(p.L);T.mark('end')},h:[['end','F','L',1]]},
 RC_V:{l:'Virage',side:1,ps:[P('bank','Inclinaison',0,180,5,90,'°'),P('ang','Angle de virage',5,720,5,90,'°'),P('R','Rayon',150,3000,10,700,'m'),P('L','Ligne après',0,5000,50,0,'m')],
  gen:(T,p,s)=>{const b=+p.bank,rl=Math.max(60,b*1.4);if(b)T.roll(-s*b,rl);T.pitch(p.ang,p.R,'mid');if(b)T.roll(s*b,rl);if(p.L)T.line(p.L);T.mark('end')},h:[['mid','OUT','R',1]]},
 ACT_F:{l:'Changement de formation',ps:[P('tr','Durée du passage',0,2000,50,400,'m')],gen:()=>{},h:[]},
 ACT_S:{l:'Action fumée',ps:[],gen:()=>{},h:[]},

const plOf=n=>SYN&&SYN.pl.find(p=>p.n===n);
function plPos(P,A){return A.c.clone().addScaledVector(A.F,P.a).addScaledVector(A.Rp,P.c).setY(P.h)}
function plQ(P,A){return Q().setFromAxisAngle(AY,(90-(A.hdg+(+P.cap||0)))*D2R).multiply(Q().setFromAxisAngle(AZ,(+P.pit||0)*D2R)).multiply(Q().setFromAxisAngle(AX,(+P.rol||0)*D2R))}

 <div class="row" style="gap:6px;flex-wrap:wrap">${Array.from({length:9},(_,i)=>i+1).filter(n=>n!==ME.n).map(n=>`<button class="b ${SEND.has(n)?'on':''}" style="min-width:74px" onclick="SEND.has(${n})?SEND.delete(${n}):SEND.add(${n});sendDraw()">Athos ${n}</button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="b pri" style="flex:1" ${SEND.size?'':'disabled'} onclick="sendGo()">Envoyer${SEND.size?' à '+[...SEND].sort((a,b)=>a-b).map(n=>'Athos '+n).join(', '):''}</button></div>`)}
function sendGo(){const x=curItem();if(!x||!SEND.size)return;if(mine(x)&&x.figs)x.forms=usedForms(x);clearTimeout(saveT);clearTimeout(saveS);if(mine(x))post({srSave:x});post({srSend:{id:x.id,to:[...SEND]}});mdl(`<h2>✉ Envoi en cours…</h2><p class="hint">Vous recevrez la confirmation dans un instant.</p>`);setTimeout(()=>mdl(),1800)}
/* fichier : enregistrer / ouvrir (le fichier reçu par mail s'ouvre ici) */
function fileOut(){const x=curItem();if(!x)return;const o=JSON.parse(JSON.stringify(x));if(o.figs)o.forms=Object.assign({},o.forms||{},usedForms(x));delete o.own;delete o.ownN;const j=JSON.stringify({pafSerie:1,from:ME.name||'',items:[o]});
 const n=((x.year?x.year+' ':'')+x.name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\- ]+/g,' ').trim()+'.paf-serie.json',url='data:application/json;base64,'+btoa(unescape(encodeURIComponent(j)));
 if(parent!==window)parent.postMessage({srFile:{url,name:n}},'*');else{const a=document.createElement('a');a.href=url;a.download=n;a.click()}}
function fileIn(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{fileLoad(JSON.parse(r.result))}catch(e){info('Fichier illisible');setTimeout(()=>info(''),2500)}};r.readAsText(f)};i.click()}
function fileLoad(o){const L=Array.isArray(o.items)?o.items:(o.figs||o.pl)?[o]:[];if(!L.length){info('Ce fichier ne contient pas de série');setTimeout(()=>info(''),2500);return}let last=null;
 L.forEach(x=>{if(!x||!(Array.isArray(x.figs)||Array.isArray(x.pl)))return;const s=mineOf(JSON.parse(JSON.stringify(x)));s.id=uid();s.t=Date.now();if(o.from)s.from=o.from;s.figs=s.figs||[];SR.list.push(s);post({srSave:s});last=s});
 if(!last)return;if(last.kind==='sync'){MODE='sync';SYN=last;SP=null}else{MODE='ruban';CUR=last;SEL=-1}draw();setTimeout(()=>view('pub'),20);info('Ouvert dans votre espace : '+last.name);setTimeout(()=>info(''),2500)}
/* temps de fumée par avion : ruban (tous les rubans enchaînés) + figures synchro, à la vitesse moyenne choisie */
let SMKV=300;
function smkCalc(){const v=SMKV*.514444,T={},add=(n,k,sec)=>{const o=T[n]=T[n]||{rw:0,rc:0,sw:0,sc:0};o[k]+=sec};
 const A=asmBuild('all'),sv=RP.A;RP.A=A;const st=10;
 for(let s=0;s<A.len;s+=st){const F=asmForm(s),d=Math.min(st,A.len-s)/v;Object.keys(F).forEach(n=>{const c=asmSmk(s,n);if(c==='w')add(n,'rw',d);else if(c)add(n,'rc',d);else add(n,'rw',0)})}
 RP.A=sv;
 const own=CUR.own||'',Ls=SL().filter(x=>(x.own||'')===own);
 Ls.forEach(x=>(x.pl||[]).forEach(P=>{const c=P.smk||'',L=P.smkL!=null?+P.smkL:450;if(!c||L<=0)return;add(P.n,c==='w'?'sw':'sc',L/v)}));
 return {T,len:A.len,nS:Ls.length,v}}
function smkTab(){const {T,len,nS,v}=smkCalc(),MX=420,f=t=>{t=Math.round(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')},col=n=>[1,2,6,8].includes(+n)?'bleu':[3,4,5,7].includes(+n)?'rouge':'couleur';
 const cl=t=>t>MX?'over':t>MX*.85?'warn':'',N=Object.keys(T).sort((a,b)=>a-b);
 mdl(`<h2>⏱ Temps de fumée</h2><p class="hint" style="margin-top:0">Vitesse moyenne <input class="in" type="number" min="150" max="500" step="10" value="${SMKV}" style="width:76px;display:inline-block" onchange="SMKV=+this.value||300;smkTab()"> kt (${Math.round(v)} m/s) · Ruban : ${CUR.year} ${esc(CUR.name)} (${(CUR.saves||[]).length?'tous les rubans enchaînés':'ruban en cours'}, ${f(len/v)}) · Synchro : ${nS} figure${nS>1?'s':''} (longueur des traînées). Maximum : 7:00 de blanc et 7:00 de couleur par avion.</p>
 ${N.length?`<div class="tw"><table class="smt"><thead><tr><th rowspan="2">Avion</th><th colspan="2">Ruban</th><th colspan="2">Synchro</th><th colspan="2">Total / 7:00</th></tr><tr><th>Blanc</th><th>Couleur</th><th>Blanc</th><th>Couleur</th><th>Blanc</th><th>Couleur</th></tr></thead><tbody>
 ${N.map(n=>{const o=T[n],tw=o.rw+o.sw,tc=o.rc+o.sc;return `<tr><td><b>Athos ${n}</b><small>${col(n)}</small></td><td>${f(o.rw)}</td><td>${f(o.rc)}</td><td>${f(o.sw)}</td><td>${f(o.sc)}</td><td class="${cl(tw)}">${f(tw)}${tw>MX?' ⚠':''}</td><td class="${cl(tc)}">${f(tc)}${tc>MX?' ⚠':''}</td></tr>`}).join('')}</tbody></table></div>
 <p class="hint">Orange : plus de 85 % du réservoir · Rouge : au-delà de 7:00.</p>`:'<p class="hint">Aucun avion ne fume encore dans cette série.</p>'}`)}
/* =========================== Démarrage =========================== */
function start(d){SR={list:(d&&d.list)||[],forms:(d&&d.forms)||{},formsBy:(d&&d.formsBy)||{}};ED=BED=!d||d.ed!==false;if(d&&d.me)Object.assign(ME,d.me);
 SR.list.forEach(s=>{if(s.v>=2||s.kind==='sync')return;(s.figs||[]).forEach(f=>{if(f.t==='LIGNE'){f.t='DEMI';f.p=Object.assign({L:+((f.p||{}).L)||600},{L0:(f.p||{}).L0||0})}});s.v=2;if(ED&&mine(s))post({srSave:s})});
 SR.list.forEach(s=>{if(s.v>=3)return;(s.figs||[]).forEach(f=>{f.p=f.p||{};if(f.p.L0==null)f.p.L0=300});s.v=3;if(ED&&mine(s))post({srSave:s})});
 const byT=(a,b)=>(b.t||0)-(a.t||0);CUR=RL().filter(mine).sort(byT)[0]||(BED?null:RL().sort(byT)[0])||null;if(!CUR){CUR=newSerie();SR.list.push(CUR);if(ED)post({srSave:CUR})}
 if(!R3)init3d();draw();setTimeout(()=>view('pub'),30);$('load').hidden=true}
addEventListener('message',e=>{const d=e.data;if(d&&d.pafSize&&d.pafSize.w>50){PSZ=d.pafSize;if(R3)resize()}if(d&&d.srInit)start(d.srInit);if(d&&d.srList){const loc=new Map(SR.list.map(x=>[x.id,x]));SR.list=d.srList.map(x=>{const l=loc.get(x.id);return l&&(l.t||0)>=(x.t||0)?l:x});loc.forEach((l,id)=>{if(!SR.list.some(x=>x.id===id))SR.list.push(l)});
  const c=CUR&&SR.list.find(x=>x.id===CUR.id);if(c&&c!==CUR){CUR=c;draw()}if(SYN){SYN=SR.list.find(x=>x.id===SYN.id)||null}}});
addEventListener('load',()=>{if(typeof THREE==='undefined'){$('load').textContent='Moteur 3D indisponible : vérifiez la connexion, puis rouvrez l\'outil.';return}
 if(parent===window){let d=null;try{d=JSON.parse(localStorage.getItem('pafSerieLocal')||'null')}catch(e){}start(d||{})}else parent.postMessage({srReady:1},'*')});
</script></body></html>
